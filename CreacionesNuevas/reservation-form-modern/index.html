<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reservation Form Modern</title>
<meta name="description" content="Restaurant table reservation form with date picker and party size.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<div class="res-card">
  <div class="res-header"><span>🍽️</span><h2>Reserve a Table</h2></div>
  <form class="res-form" id="resForm" novalidate>
    <div class="res-row">
      <div class="res-field"><label for="resDate">Date</label><input type="date" id="resDate" required></div>
      <div class="res-field"><label for="resTime">Time</label>
        <select id="resTime">
          <option>12:00</option><option>12:30</option><option>13:00</option><option>18:00</option><option>18:30</option><option>19:00</option><option>19:30</option><option>20:00</option><option>20:30</option><option>21:00</option>
        </select>
      </div>
    </div>
    <div class="res-field"><label>Guests</label>
      <div class="stepper-ctrl">
        <button type="button" id="rdec">−</button><span id="guestCount">2</span><button type="button" id="rinc">+</button>
      </div>
    </div>
    <div class="res-field"><label for="resName">Name</label><input type="text" id="resName" placeholder="Full name" required></div>
    <button class="res-btn" type="submit">Confirm Reservation</button>
    <div class="res-ok" id="resOk" hidden>✅ Reservation confirmed!</div>
  </form>
</div>
</body>
</html>
