<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider Liquid Color Mixer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="mixer-card">
    <div class="color-flask" id="flaskMix"></div>
    <div class="sliders-row">
      <input type="range" min="0" max="255" value="168" id="rSlider" aria-label="Canal rojo">
      <input type="range" min="0" max="255" value="85" id="gSlider" aria-label="Canal verde">
      <input type="range" min="0" max="255" value="247" id="bSlider" aria-label="Canal azul">
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
