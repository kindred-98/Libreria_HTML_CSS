<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Wave Radio Tuner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="radio-card">
    <div class="wave-screen">
      <canvas id="radioWave" width="340" height="100"></canvas>
    </div>
    <div class="tuner-bar">
      <input type="range" min="88" max="108" step="0.1" value="98.5" id="freqSlider" aria-label="FM frequency in MHz">
      <div class="freq-readout"><span id="freqVal">98.5</span> MHz FM</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
