<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Range Slider</title>
<meta name="description" content="Custom range slider with 3D depth track and glowing thumb.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<div class="slider-wrap">
  <input type="range" class="slider3d" id="sl" min="0" max="100" value="40" aria-label="3D range slider value">
  <div class="value-badge" id="vb">40</div>
</div>
</body>
</html>
