<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search Autocomplete Input</title>
<meta name="description" content="Search input with animated dropdown autocomplete suggestions.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<div class="ac-wrap">
  <div class="ac-input-wrap">
    <span class="ac-icon">⌕</span>
    <input type="search" class="ac-input" id="acInput" placeholder="Search components..." autocomplete="off" aria-label="Search components">
  </div>
  <ul class="ac-list" id="acList"></ul>
</div>
</body>
</html>
