<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Mute Sign</title>
<meta name="description" content="A poster with a live microphone sign wired in: the switch kills the tube, the glass goes cold and grey, the buzz stops, and a muted sign takes its place while the bulbs keep chasing round the frame.">
<meta name="description-es" content="Un cartel con un cartel de micrófono en vivo cableado: el interruptor apaga el tubo, el vidrio se queda frío y gris, el zumbido cesa y un cartel de silencio ocupa su lugar mientras las bombillas siguen girando por el marco.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="page">
  <header class="head">
    <p class="head__kicker">Poster wall · bay 7</p>
    <h1>Neon Mute Sign</h1>
    <p class="head__lead">The switch is the breaker on the wall. Reach it with a click or a thumb, or focus it and use Space, Enter or the arrow keys, and watch the tube give up.</p>
  </header>

  <div class="wall">
    <span class="wall__brick" aria-hidden="true"></span>
    <span class="wall__lamp" aria-hidden="true"></span>

    <div class="poster" id="poster">
      <span class="bulbs" aria-hidden="true">
        <i style="--b:0"></i><i style="--b:1"></i><i style="--b:2"></i><i style="--b:3"></i>
        <i style="--b:4"></i><i style="--b:5"></i><i style="--b:6"></i><i style="--b:7"></i>
        <i style="--b:8"></i><i style="--b:9"></i><i style="--b:10"></i><i style="--b:11"></i>
        <i style="--b:12"></i><i style="--b:13"></i><i style="--b:14"></i><i style="--b:15"></i>
        <i style="--b:16"></i><i style="--b:17"></i><i style="--b:18"></i><i style="--b:19"></i>
        <i style="--b:20"></i><i style="--b:21"></i><i style="--b:22"></i><i style="--b:23"></i>
      </span>

      <div class="tube tube--live" aria-hidden="true">
        <span class="tube__text">
          <i class="tube__mic"></i>
          <b>on air</b>
        </span>
        <span class="tube__halo"></span>
      </div>

      <div class="tube tube--muted" aria-hidden="true">
        <span class="tube__text"><b>muted</b></span>
        <span class="tube__halo"></span>
      </div>

      <div class="plate" aria-hidden="true">
        <span>studio seven</span>
        <span>do not touch</span>
      </div>

      <label class="breaker" for="mute">
        <input class="breaker__input" id="mute" type="checkbox" role="switch" aria-label="Microphone muted">
        <span class="breaker__body">
          <span class="breaker__track"><i class="breaker__lever"></i></span>
          <span class="breaker__plate"><b>mic</b><s>breaker</s></span>
        </span>
        <span class="breaker__state" aria-hidden="true">live</span>
      </label>
    </div>
  </div>

  <p class="foot">Twenty four bulbs, one breaker, no sound at any point.</p>
</main>
</body>
</html>
