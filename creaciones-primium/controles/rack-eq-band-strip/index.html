<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rack EQ Band Strip</title>
<meta name="description" content="A four band equaliser sitting in a rack unit: every fader cap drags with a little weight, the ring meter beside them fills and falls, and the fan behind the grille keeps turning whatever the mix is doing.">
<meta name="description-es" content="Un ecualizador de cuatro bandas montado en una unidad de rack: cada capuchón se arrastra con algo de peso, el medidor circular de al lado sube y baja y el ventilador tras la rejilla sigue girando haga lo que haga la mezcla.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="page">
  <header class="head">
    <p class="head__kicker">Rack unit · 4 band</p>
    <h1>EQ Band Strip</h1>
    <p class="head__lead">Drag a cap, or focus one and use the arrow keys, Page Up and Page Down, Home and End. Space returns that band to flat.</p>
  </header>

  <div class="rack">
    <span class="rack__ear rack__ear--l" aria-hidden="true"><i></i><i></i></span>
    <span class="rack__ear rack__ear--r" aria-hidden="true"><i></i><i></i></span>

    <div class="unit">
      <div class="ring" aria-hidden="true">
        <span class="ring__track"></span>
        <span class="ring__fill" id="ringFill"></span>
        <span class="ring__peak"></span>
        <b class="ring__label">level</b>
      </div>

      <div class="bands" id="bands">
        <div class="band">
          <span class="band__scale" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="band__slot" aria-hidden="true"></span>
          <span class="band__cap" aria-hidden="true"><i></i></span>
          <input class="band__input" type="range" min="-12" max="12" step="1" value="0"
            data-name="low" aria-label="Low band gain" aria-valuetext="0 decibels">
          <span class="band__name" aria-hidden="true">low</span>
          <span class="band__hz" aria-hidden="true">80 hz</span>
        </div>

        <div class="band">
          <span class="band__scale" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="band__slot" aria-hidden="true"></span>
          <span class="band__cap" aria-hidden="true"><i></i></span>
          <input class="band__input" type="range" min="-12" max="12" step="1" value="4"
            data-name="mid" aria-label="Mid band gain" aria-valuetext="4 decibels">
          <span class="band__name" aria-hidden="true">mid</span>
          <span class="band__hz" aria-hidden="true">1k hz</span>
        </div>

        <div class="band">
          <span class="band__scale" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="band__slot" aria-hidden="true"></span>
          <span class="band__cap" aria-hidden="true"><i></i></span>
          <input class="band__input" type="range" min="-12" max="12" step="1" value="-3"
            data-name="high" aria-label="High band gain" aria-valuetext="minus 3 decibels">
          <span class="band__name" aria-hidden="true">high</span>
          <span class="band__hz" aria-hidden="true">6k hz</span>
        </div>

        <div class="band">
          <span class="band__scale" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="band__slot" aria-hidden="true"></span>
          <span class="band__cap" aria-hidden="true"><i></i></span>
          <input class="band__input" type="range" min="-12" max="12" step="1" value="0"
            data-name="air" aria-label="Air band gain" aria-valuetext="0 decibels">
          <span class="band__name" aria-hidden="true">air</span>
          <span class="band__hz" aria-hidden="true">14k hz</span>
        </div>
      </div>

      <div class="side">
        <span class="fan" aria-hidden="true"><i></i></span>
        <span class="side__plate" aria-hidden="true">
          <b>nexo</b>
          <i>eq 4b</i>
        </span>
        <span class="side__lamps" aria-hidden="true">
          <i style="--s:0"></i><i style="--s:1"></i><i style="--s:2"></i><i style="--s:3"></i>
        </span>
      </div>
    </div>

    <p class="readout" aria-hidden="true">mix <b id="mix">flat</b></p>
  </div>

  <p class="foot">Flat is a setting, not a default: Space will take a band back to it.</p>
</main>
</body>
</html>
