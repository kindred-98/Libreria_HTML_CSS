<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remote Power Switch</title>
<meta name="description" content="A television remote with a real slide power switch: the chrome slider snaps between run and standby, the status screen wakes or goes dark, and the row of indicator lamps keeps blinking while the remote is alive.">
<meta name="description-es" content="Un mando de televisión con un interruptor deslizante de verdad: la lámina de cromo encaja entre encendido y reposo, la pantalla de estado se enciende o se apaga y la fila de pilotos sigue parpadeando mientras el mando está vivo.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="page">
  <header class="head">
    <p class="head__kicker">Handset · model R9</p>
    <h1>Power Switch</h1>
    <p class="head__lead">Slide the switch with the mouse or a thumb, or focus it and use Space, Enter or the arrow keys. The handset answers on the same beat.</p>
  </header>

  <div class="table">
    <span class="table__glow" aria-hidden="true"></span>

    <div class="remote">
      <span class="remote__sheen" aria-hidden="true"></span>
      <span class="remote__ir" aria-hidden="true"></span>

      <div class="screen" aria-hidden="true">
        <span class="screen__on">RUN</span>
        <span class="screen__off">STBY</span>
        <span class="screen__scan"></span>
      </div>

      <div class="lamps" aria-hidden="true">
        <i style="--l:0"></i><i style="--l:1"></i><i style="--l:2"></i>
        <i style="--l:3"></i><i style="--l:4"></i>
      </div>

      <label class="power" for="power">
        <input class="power__input" id="power" type="checkbox" role="switch" aria-label="Remote power">
        <span class="power__track">
          <span class="power__cap"><i></i></span>
        </span>
        <span class="power__marks" aria-hidden="true"><b>I</b><b>O</b></span>
        <span class="power__label">power</span>
      </label>

      <div class="pad" aria-hidden="true">
        <span class="pad__row"><i></i><i class="hot"></i><i></i></span>
        <span class="pad__row"><i></i><i></i><i></i></span>
        <span class="pad__row"><i></i><i></i><i class="hot"></i></span>
        <span class="pad__rocker"><i></i></span>
      </div>
    </div>

    <p class="readout" aria-hidden="true">state <b id="state">standby</b></p>
  </div>

  <p class="foot">Five lamps, one switch, no batteries required by this demo.</p>
</main>
</body>
</html>
