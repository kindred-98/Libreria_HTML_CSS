<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tamper Seal Checkbox</title>
<meta name="description" content="A security seal crossing the seam of a shipping crate: the wax blob holds the cord shut while the seal is intact, and clearing the checkbox snaps the cord, cracks the wax and drops a void stamp across the label.">
<meta name="description-es" content="Un precinto de seguridad cruzando la costura de una caja de envío: la gota de cera sujeta el cordón mientras el precinto está intacto, y al desmarcar la casilla el cordón se rompe, la cera se agrieta y cae un sello de anulación sobre la etiqueta.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="page">
  <header class="head">
    <p class="head__kicker">Security label · lot 07</p>
    <h1>Tamper Seal</h1>
    <p class="head__lead">The checkbox is the seal itself. Focus it and use Space, Enter or the arrow keys: clear it and the crate is opened for good.</p>
  </header>

  <div class="dock">
    <span class="dock__shadow" aria-hidden="true"></span>

    <div class="crate">
      <span class="crate__lid" aria-hidden="true"></span>
      <span class="crate__tape" aria-hidden="true"></span>
      <span class="crate__lamp" aria-hidden="true"></span>

      <div class="label">
        <span class="label__side label__side--l" aria-hidden="true">
          <b>security seal</b>
          <i>do not tamper</i>
        </span>
        <span class="label__side label__side--r" aria-hidden="true">
          <i>4421&#8209;B</i>
          <b>07 / 24</b>
        </span>
        <span class="label__bar" aria-hidden="true"></span>
        <span class="label__scan" aria-hidden="true"></span>
      </div>

      <label class="seal" for="seal">
        <input class="seal__input" id="seal" type="checkbox" checked aria-label="Security seal intact">
        <span class="seal__cord" aria-hidden="true"></span>
        <span class="seal__wax" aria-hidden="true"></span>
        <span class="seal__gloss" aria-hidden="true"></span>
        <span class="seal__void" aria-hidden="true">void</span>
        <span class="seal__ring" aria-hidden="true"></span>
      </label>

      <p class="state" aria-hidden="true">seal <b id="state">intact</b></p>
    </div>
  </div>

  <p class="foot">A scanner walks the label on its own, all night, whatever you decide.</p>
</main>
</body>
</html>
