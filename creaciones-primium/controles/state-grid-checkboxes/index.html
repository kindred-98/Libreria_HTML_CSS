<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkbox State Grid</title>
<meta name="description" content="One checkbox drawn six times so every state can be read at a glance: at rest, hovered, focused, pressed, ticked and disabled, each sample still breathing on its own so the grid never looks like a frozen screenshot.">
<meta name="description-es" content="Una casilla dibujada seis veces para leer todos sus estados de un vistazo: en reposo, al pasar el ratón, con foco, pulsada, marcada y desactivada, y cada muestra sigue respirando por su cuenta para que la rejilla no parezca una captura congelada.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="page">
  <header class="head">
    <p class="head__kicker">Component sheet · checkbox</p>
    <h1>State Grid</h1>
    <p class="head__lead">The two live samples are real checkboxes: focus them and use Space or Enter, or the arrow keys. The rest hold their state so the whole sheet can be read at a glance.</p>
  </header>

  <section class="sheet">
    <div class="tile">
      <label class="box" for="idle">
        <input type="checkbox" id="idle" aria-label="At rest">
        <span class="box__mark"><i></i></span>
        <span class="tile__text"><b>at rest</b><span>default, nothing touching it</span></span>
      </label>
    </div>

    <div class="tile">
      <label class="box is-hover" for="hover">
        <input type="checkbox" id="hover" aria-label="Hovered">
        <span class="box__mark"><i></i></span>
        <span class="tile__text"><b>hovered</b><span>pointer over the row</span></span>
      </label>
    </div>

    <div class="tile">
      <label class="box is-focus" for="focus">
        <input type="checkbox" id="focus" aria-label="Focused">
        <span class="box__mark"><i></i></span>
        <span class="tile__text"><b>focused</b><span>keyboard ring, two pixels</span></span>
      </label>
    </div>

    <div class="tile">
      <label class="box is-press" for="press">
        <input type="checkbox" id="press" aria-label="Pressed">
        <span class="box__mark"><i></i></span>
        <span class="tile__text"><b>pressed</b><span>held down, box sinks</span></span>
      </label>
    </div>

    <div class="tile">
      <label class="box is-on" for="on">
        <input type="checkbox" id="on" checked aria-label="Checked">
        <span class="box__mark"><i></i></span>
        <span class="tile__text"><b>checked</b><span>value on, tick settles</span></span>
      </label>
    </div>

    <div class="tile">
      <label class="box is-off" for="off">
        <input type="checkbox" id="off" disabled aria-label="Disabled">
        <span class="box__mark"><i></i></span>
        <span class="tile__text"><b>disabled</b><span>greyed out, no pointer</span></span>
      </label>
    </div>
  </section>

  <p class="foot">Six samples, one component, no build step.</p>
</main>
</body>
</html>
