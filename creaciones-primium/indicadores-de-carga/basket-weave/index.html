<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basket Weave</title>
<meta name="description" content="A basket maker passes pale willow rods over and under a growing base: each stake bends around its neighbour, the weave tightens row by row, the rods take the honey colour where the light hits them, and the rim is pulled in and squared off at the end of every pass.">
<meta name="description-es" content="Un cestrero pasa varillas de mimbre pálido por encima y por debajo de un fondo que crece: cada estaca se dobla alrededor de su vecina, la trama se aprieta fila a fila, las varillas toman el color de la miel donde les da la luz y el borde se cierra y se cuadra al final de cada pasada.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="basket" aria-hidden="true">
    <div class="rows">
      <i style="--i:0"></i>
      <i style="--i:1"></i>
      <i style="--i:2"></i>
      <i style="--i:3"></i>
      <i style="--i:4"></i>
      <i style="--i:5"></i>
      <i style="--i:6"></i>
      <i style="--i:7"></i>
    </div>
    <div class="stakes">
      <i style="--i:0"></i>
      <i style="--i:1"></i>
      <i style="--i:2"></i>
      <i style="--i:3"></i>
      <i style="--i:4"></i>
      <i style="--i:5"></i>
      <i style="--i:6"></i>
      <i style="--i:7"></i>
      <i style="--i:8"></i>
      <i style="--i:9"></i>
    </div>
    <span class="rim"></span>
    <span class="handle"></span>
    <span class="light"></span>
  </div>
  <p class="sr" role="status">Cestería en curso: las varillas de mimbre se cruzan por encima y por debajo de las estacas, la trama se aprieta fila a fila y el borde se cierra.</p>
</main>
</body>
</html>
