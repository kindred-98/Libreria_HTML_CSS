<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ink Mill</title>
<meta name="description" content="Two stone rollers grind printer's ink: the rollers draw the paste in, the gap narrows under pressure, the paste darkens and thickens as the pigment is worked, the colour climbs the stones and a bead of finished ink gathers at the edge before the scraper takes it off.">
<meta name="description-es" content="Dos rodillos de piedra muelen tinta de imprenta: los rodillos la chupan, la separación se estrecha bajo presión, la pasta se oscurece y espesa mientras se trabaja el pigmento, el color trepa por la piedra y una gota de tinta acabada se acumula en el borde antes de que la raspa se la lleve.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="mill" aria-hidden="true">
    <span class="table top"></span>
    <span class="table bot"></span>
    <div class="roller top">
      <span class="stone"></span>
      <span class="shaft"></span>
    </div>
    <div class="roller bot">
      <span class="stone"></span>
      <span class="shaft"></span>
    </div>
    <span class="gap"></span>
    <span class="feed"></span>
    <span class="bead"></span>
    <span class="scraper"></span>
  </div>
  <p class="sr" role="status">Molienda de tinta: los rodillos de piedra giran, la pasta se espesa y oscurece entre ellos y una gota de tinta acabada se acumula al borde.</p>
</main>
</body>
</html>
