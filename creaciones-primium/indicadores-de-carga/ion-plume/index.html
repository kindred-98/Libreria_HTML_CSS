<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ion Plume</title>
<meta name="description" content="A gridded ion thruster spits a wide diffuse cyan cloud on low throttle, then pinches the plume into a narrow bright column as it accelerates, the beam grid lines converging to a hard core over a dark blue night.">
<meta name="description-es" content="Un motor de iones con rejilla escupe una nube cian ancha y difusa a baja potencia y luego estrecha el penacho en una columna brillante al acelerar, con las líneas de la rejilla convergiendo hacia un núcleo duro sobre una noche azul oscura.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="night" aria-busy="true">
  <div class="night__bg" aria-hidden="true"></div>
  <div class="night__stars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="night__limb" aria-hidden="true"></div>

  <div class="stack" aria-hidden="true">
    <span class="grid"></span>
    <span class="glow"></span>
    <span class="plume plume--wide"></span>
    <span class="plume plume--mid"></span>
    <span class="plume plume--core"></span>
    <span class="ray ray--a"></span>
    <span class="ray ray--b"></span>
    <span class="ray ray--c"></span>
    <span class="throat"></span>
    <div class="head">
      <span class="head__top"></span>
      <span class="head__band"></span>
      <span class="head__pot"></span>
      <span class="head__pole"></span>
      <span class="head__coil"></span>
      <span class="head__bell"></span>
      <span class="head__ring"></span>
    </div>
  </div>

  <p class="read" aria-hidden="true">Throttle<span class="read__v" id="th">0 pct</span></p>

  <p class="sr" role="status">Ion thruster running: the plume starts wide and diffuse at low throttle, then narrows and brightens into a tight cyan column as the vehicle accelerates.</p>
</main>
</body>
</html>
