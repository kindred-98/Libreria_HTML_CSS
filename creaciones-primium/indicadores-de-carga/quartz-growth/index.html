<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quartz Growth</title>
<meta name="description" content="A quartz cluster grows upward inside a vial of mother liquor, the prisms rising from the seed at the bottom while the facet edges light up and sweep the background behind them before the crystal settles and dissolves back into the solution.">
<meta name="description-es" content="Un racimo de cuarzo crece dentro de una vial de licor madre: los prismas ascienden desde la semilla del fondo mientras las aristas se encienden y barren el fondo del objetivo antes de asentarse y disolverse de nuevo en la solución.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Quartz growing in the mother liquor, its facets catching the light</p>
  <div class="obj" aria-hidden="true">
    <i class="aura"></i>
    <div class="vial">
      <i class="liquid"></i>
      <i class="meniscus"></i>
      <i class="ticks"></i>
      <i class="sheen"></i>
    </div>
    <div class="crystal">
      <i class="shard c"></i>
      <i class="shard b"></i>
      <i class="core">
        <i class="facets"></i>
        <i class="glint"></i>
      </i>
      <i class="shard a"></i>
      <i class="shard d"></i>
      <i class="bud"></i>
    </div>
    <i class="caustic"></i>
    <i class="motes m1"></i>
    <i class="motes m2"></i>
    <i class="motes m3"></i>
  </div>
  <p class="phase" aria-hidden="true"><span class="t1">seed</span><span class="t2">grow</span><span class="t3">facet</span><span class="t4">clear</span></p>
</main>
</body>
</html>
