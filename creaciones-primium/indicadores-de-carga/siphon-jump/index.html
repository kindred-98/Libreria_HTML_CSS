<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siphon Jump</title>
<meta name="description" content="A glass siphon standing over a dish: the green column is pulled taut, snaps off the mouth of the tube, runs down the elbow into the dish and a new column hangs from the top and fills the glass again.">
<meta name="description-es" content="Un sifón de vidrio sobre una pila: la columna verde se tensa, se despega de la boca del tubo, baja por el codo hasta la pila y una columna nueva cuelga de arriba y vuelve a llenar el vidrio.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="rig">
    <div class="siphon">
      <span class="bore">
        <span class="col"></span>
        <span class="fresh"></span>
        <span class="flash"></span>
        <span class="spec"></span>
      </span>
      <span class="elbow">
        <span class="hold"></span>
      </span>
      <span class="mouth"></span>
      <span class="rimlight"></span>
    </div>
    <div class="fall">
      <span class="stream">
        <i class="t1"></i><i class="t2"></i>
      </span>
      <span class="burst">
        <i class="p1"></i><i class="p2"></i><i class="p3"></i>
      </span>
    </div>
    <div class="dish">
      <span class="water"></span>
      <span class="skin"></span>
      <span class="ring r1"></span>
      <span class="ring r2"></span>
      <span class="glint"></span>
    </div>
  </div>
  <p class="sr" role="status">The water column snaps away from the mouth of the siphon, runs into the dish and a new column fills the glass</p>
</main>
</body>
</html>
