<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petri Colony</title>
<meta name="description" content="Colonies of bacteria grow across an agar plate in a staggered incubation cycle, each one spreading from a speck into a domed disc whose rim breaks into granular beads while a light sweep crosses the medium.">
<meta name="description-es" content="Colonias de bacterias crecen sobre una placa de agar en un ciclo de incubación escalonado: cada una pasa de un punto a un disco abombado cuyo borde se rompe en gránulos, mientras una luz barre el medio de cultivo.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Colonies spreading across the agar plate, edges breaking into granules</p>
  <div class="obj" aria-hidden="true">
    <div class="plate">
      <i class="agar"></i>
      <i class="swirl"></i>
      <i class="col a"></i>
      <i class="col b"></i>
      <i class="col c"></i>
      <i class="col d"></i>
      <i class="col e"></i>
      <i class="col f"></i>
      <i class="sheen"></i>
      <i class="lid"></i>
      <i class="bar"></i>
      <p class="scale">5 mm</p>
    </div>
  </div>
</main>
</body>
</html>
