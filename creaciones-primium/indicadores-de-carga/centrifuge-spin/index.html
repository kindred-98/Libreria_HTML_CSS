<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centrifuge Spin</title>
<meta name="description" content="A swinging-bucket rotor swings a loaded tube through its orbit: the dense red phase creeps outward along the tube as the blue supernatant gives way, while a bright meniscus ring rides the rotation.">
<meta name="description-es" content="Un rotor de brazos oscilantes hace girar un tubo cargado en su órbita: la fase densa roja avanza hacia el exterior del tubo mientras el sobrenadante azul cede, y un anillo de menisco brillante gira con la rotación.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Centrifuge spinning, the two phases separating in the tube</p>
  <div class="obj" aria-hidden="true">
    <i class="halo"></i>
    <div class="body">
      <i class="brushed"></i>
      <i class="orbit"></i>
      <i class="mount m1"><i class="seat"></i></i>
      <i class="mount m2"><i class="seat"></i></i>
      <i class="mount m3"><i class="seat"></i></i>
    </div>
    <div class="arm">
      <i class="spoke"></i>
      <div class="rig">
        <i class="bucket"></i>
        <div class="tube">
          <i class="sup"></i>
          <i class="band"></i>
          <i class="iface"></i>
          <i class="men"><i class="glint"></i></i>
          <i class="glassline"></i>
        </div>
      </div>
    </div>
    <i class="hub"></i>
    <i class="cap"></i>
  </div>
</main>
</body>
</html>
