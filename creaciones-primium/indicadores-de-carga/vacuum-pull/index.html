<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vacuum Pull</title>
<meta name="description" content="A vacuum gauge pulls down from atmosphere: the needle sweeps the engraved scale, hunts for an instant as it crosses the violet critical band, and settles at deep vacuum before the vent opens and sends it back.">
<meta name="description-es" content="Un manómetro de vacío baja desde la atmósfera: la aguja barre la escala grabada, tiembla un instante al cruzar la banda crítica violeta y se estabiliza en vacío profundo antes de que abra la purga y la devuelva.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Vacuum dropping, the needle crossing the critical band</p>
  <div class="obj" aria-hidden="true">
    <div class="gauge">
      <i class="scale"></i>
      <i class="face">
        <i class="flash"></i>
        <p class="unit">mbar</p>
      </i>
      <i class="lab l1">1000</i>
      <i class="lab l2">100</i>
      <i class="lab l3">1</i>
      <div class="needle">
        <i class="blade"></i>
        <i class="tail"></i>
      </div>
      <i class="pivot"></i>
      <i class="glass"></i>
    </div>
  </div>
</main>
</body>
</html>
