<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plane Shavings</title>
<meta name="description" content="A wooden hand plane is pushed along a board: the blade bites, a shaving lifts and curls over the mouth, thins to a translucent ribbon, breaks off and falls in a slow spiral, and the next pass lifts another one as the board behind the plane comes up bright and smooth.">
<meta name="description-es" content="Un cepillo de madera avanza sobre un tablón: la hoja muerde, una viruta se levanta y se enrosca sobre la boca, se adelgaza hasta ser una cinta translúcida, se rompe y cae en espiral lenta, y la pasada siguiente levanta otra mientras la madera que deja el cepillo sale brillante y lisa.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="work" aria-hidden="true">
    <span class="board"></span>
    <span class="sheen"></span>
    <div class="plane">
      <span class="sole"></span>
      <span class="body"></span>
      <span class="mouth"></span>
      <span class="iron"></span>
      <span class="wedge"></span>
      <span class="knob"></span>
    </div>
    <span class="curl"></span>
    <span class="curl two"></span>
    <span class="curl three"></span>
  </div>
  <p class="sr" role="status">Cepillando: la hoja muerde la madera, la viruta se enrosca sobre la boca, se adelgaza, se rompe y cae en espiral.</p>
</main>
</body>
</html>
