<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coral Build</title>
<meta name="description" content="A coral polyp lays down its skeleton: branch segments stack upward one after another, a calcareous pore texture spreads over the new growth and the tentacle crown opens at the tip.">
<meta name="description-es" content="Un pólipo de coral levanta su esqueleto: los segmentos del rama se apilan uno tras otro, la textura calcárea de poros se extiende y la corona de tentáculos se abre en la punta.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="reef" aria-hidden="true">
    <div class="holdfast"></div>
    <div class="trunk">
      <span class="seg seg--1"><span class="pore"></span></span>
      <span class="seg seg--2"><span class="pore"></span></span>
      <span class="seg seg--3"><span class="pore"></span></span>
      <span class="seg seg--4"><span class="pore"></span></span>
      <span class="seg seg--5"><span class="pore"></span></span>
      <span class="crown">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </span>
    </div>
  </div>
  <p class="sr" role="status">Coral creciendo: el esqueleto sube segmento a segmento y la textura calcárea se extiende por la rama.</p>
</main>
</body>
</html>
