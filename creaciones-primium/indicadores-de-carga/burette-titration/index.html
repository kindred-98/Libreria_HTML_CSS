<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Burette Titration</title>
<meta name="description" content="A glass burette on a stand lets a single amber bead grow at the tip, stretch into a long neck and fall into a conical flask, where each impact ripples the surface and swings the indicator from blue-green to amber.">
<meta name="description-es" content="Una bureta de vidrio sobre su soporte deja crecer una perla ámbar en la punta, estirarla en un hilo largo y dejarla caer dentro de un matraz cónico, donde cada impacto riega la superficie y hace virar el indicador del verde azulado al ámbar.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Burette titration running, the indicator turning as drops land</p>
  <div class="obj" aria-hidden="true">
    <i class="pool"></i>
    <i class="stand"></i>
    <i class="foot"></i>
    <i class="clamp"></i>
    <div class="burette">
      <i class="fill"><i class="men"></i></i>
      <i class="grad"></i>
      <i class="sheen"></i>
    </div>
    <i class="tip"></i>
    <i class="cock"></i>
    <i class="bead"></i>
    <i class="bead late"></i>
    <div class="flask">
      <i class="sol teal"></i>
      <i class="sol amber"></i>
      <i class="ring a"></i>
      <i class="ring b"></i>
      <i class="ring c"></i>
      <i class="rim"></i>
    </div>
    <p class="unit">0.05 ml / drop</p>
  </div>
</main>
</body>
</html>
