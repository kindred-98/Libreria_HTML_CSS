<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Molten Pour</title>
<meta name="description" content="Molten bronze falls from a tilted crucible into a steel mould, spreads with the weight of liquid, then skins over while a bright vein on the crust narrows and dulls as it hardens and smoke drifts off the pour.">
<meta name="description-es" content="El bronce fundido cae de un crisol inclinado a una matriz de acero, se reparte con el peso del líquido y luego se cubre de piel mientras una veta de luz sobre la costra se estrecha y se apaga al endurecerse, con humo saliendo de la colada.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Molten bronze pouring into the mould, spreading and skinning over</p>
  <div class="obj" aria-hidden="true">
    <div class="crucible">
      <i class="handle"></i>
      <i class="body"></i>
      <i class="melt"></i>
      <i class="rim"></i>
      <i class="spout"></i>
    </div>
    <i class="stream"></i>
    <i class="glare"></i>
    <div class="mould">
      <i class="back"></i>
      <i class="wall w1"></i>
      <i class="wall w2"></i>
      <i class="base"></i>
      <div class="pool">
        <i class="hot"></i>
        <i class="skin"></i>
        <i class="vein"></i>
        <i class="oxide o1"></i>
        <i class="oxide o2"></i>
        <i class="oxide o3"></i>
        <i class="oxide o4"></i>
      </div>
    </div>
    <i class="splash"></i>
    <i class="drop d1"></i>
    <i class="drop d2"></i>
    <i class="haze h1"></i>
    <i class="haze h2"></i>
  </div>
  <p class="phase" aria-hidden="true"><span class="t1">tilt</span><span class="t2">pour</span><span class="t3">skin</span><span class="t4">draw</span></p>
</main>
</body>
</html>
