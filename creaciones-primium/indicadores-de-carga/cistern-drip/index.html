<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cistern Drip</title>
<meta name="description" content="A stone cistern fills one drop at a time: the drop hangs at the lip, stretches until it lets go, falls into the bowl, throws a crown and two rings, and the level creeps up before the weep hole lets it back down.">
<meta name="description-es" content="Una cisterna de piedra se llena gota a gota: la gota cuelga del labio, se estira hasta que se suelta, cae en el cuenco, lanza una corona y dos ondas, y el nivel sube antes de que el goterón lo devuelva.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="vault" aria-busy="true">
  <div class="rig">
    <div class="cast"></div>
    <div class="stone">
      <span class="grain"></span>
      <span class="moss"></span>
      <span class="lipstone"></span>
      <span class="bowl">
        <span class="level">
          <i class="ring r1"></i>
          <i class="ring r2"></i>
          <span class="sheen"></span>
        </span>
        <span class="rim"></span>
        <span class="darkside"></span>
      </span>
      <span class="weep"></span>
      <span class="trickle"></span>
    </div>
    <div class="spout">
      <span class="ledge"></span>
      <span class="nose"></span>
    </div>
    <span class="cap"></span>
    <div class="fall">
      <span class="bead"></span>
    </div>
    <div class="crown">
      <i class="c1"></i><i class="c2"></i><i class="c3"></i>
    </div>
  </div>
  <p class="sr" role="status">A drop stretches at the stone lip, falls into the cistern and raises the water level</p>
</main>
</body>
</html>
