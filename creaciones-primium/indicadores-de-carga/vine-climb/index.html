<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vine Climb</title>
<meta name="description" content="A vine climbs a support stem: the shoot lengthens node by node, each leaf unfurls from its bud and the inner vessel column keeps marking itself as the tip advances.">
<meta name="description-es" content="Una enredadera trepa un soporte: el brote se alarga nudo a nudo, cada hoja se despliega de su brote y la columna de vasos interiores se sigue marcando según avanza el ápice.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="plant" aria-hidden="true">
    <div class="post"></div>
    <div class="stem"><span class="vessel"></span></div>
    <span class="node node--1"></span>
    <span class="node node--2"></span>
    <span class="node node--3"></span>
    <span class="node node--4"></span>
    <span class="leaf leaf--1"></span>
    <span class="leaf leaf--2"></span>
    <span class="leaf leaf--3"></span>
    <span class="leaf leaf--4"></span>
    <span class="hook"></span>
    <span class="tendril"></span>
  </div>
  <p class="sr" role="status">La enredadera trepa: el tallo se alarga, las hojas se abren y los vasos se marcan al crecer.</p>
</main>
</body>
</html>
