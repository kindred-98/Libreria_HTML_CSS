<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launch Sequence</title>
<meta name="description" content="A white two-stage rocket on its pad runs a full launch sequence: the tower struts swing clear, the engine lights, and the exhaust flame changes section from a broad orange sea-level plume to a narrow vacuum plume with a shock diamond before throttle-down.">
<meta name="description-es" content="Un cohete blanco de dos etapas en su plataforma ejecuta la secuencia completa de despegue: los brazos de la torre se abren, el motor se enciende y la llama de escape cambia de sección, de una columna naranja ancha a nivel del mar a una pluma estrecha en vacío con diamante de choque, antes de reducir gases.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="pad" aria-busy="true">
  <div class="sky" aria-hidden="true"></div>
  <div class="spark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="bloom" aria-hidden="true"></div>

  <div class="stack" aria-hidden="true">
    <div class="steam"><i></i><i></i><i></i></div>
    <div class="plume">
      <span class="plume__halo"></span>
      <span class="plume__sheath"></span>
      <span class="plume__core"></span>
      <span class="plume__neck"></span>
      <span class="shock"><i></i><i></i><i></i><i></i></span>
    </div>
    <span class="hold hold--l"></span>
    <span class="hold hold--r"></span>

    <div class="rocket">
      <div class="hull">
        <span class="nose"></span>
        <span class="cap"></span>
        <span class="gloss"></span>
        <span class="band"></span>
        <span class="seam seam--a"></span>
        <span class="hatch"></span>
        <span class="pipe"></span>
        <span class="seam seam--b"></span>
        <span class="belt"></span>
        <span class="seam seam--c"></span>
        <span class="port port--a"></span>
        <span class="port port--b"></span>
        <span class="rung"></span>
        <span class="skirt"></span>
        <span class="bell"></span>
      </div>
      <span class="fin fin--l"></span>
      <span class="fin fin--r"></span>
    </div>
  </div>

  <p class="tag tag--a">Atmospheric</p>
  <p class="tag tag--v">Vacuum</p>

  <p class="sr" role="status">Launch sequence running: the hold-down struts swing clear, the engine ignites, the exhaust flame changes section from a broad atmospheric plume to a narrow vacuum plume with a shock diamond, then the vehicle throttles down.</p>
</main>
</body>
</html>
