<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pcr Cycling</title>
<meta name="description" content="A thermal cycler drives eight tubes through denaturation, annealing and extension: the light on the block snaps from hot amber to cold turquoise and back without easing while the sample glows brighter as product accumulates.">
<meta name="description-es" content="Un termociclador lleva ocho tubos por desnaturalización, anillamiento y extensión: la luz del bloque salta del ámbar caliente al turquesa frío y de vuelta sin suavizado, mientras la muestra brilla más al acumularse producto.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Thermal cycler running, temperature stepping through each stage</p>
  <div class="obj" aria-hidden="true">
    <div class="machine">
      <i class="lid"></i>
      <i class="hinge"></i>
      <div class="block">
        <i class="face"></i>
        <div class="wells">
          <i class="tube t1"><i class="liq"></i><i class="cap"></i></i>
          <i class="tube t2"><i class="liq"></i><i class="cap"></i></i>
          <i class="tube t3"><i class="liq"></i><i class="cap"></i></i>
          <i class="tube t4"><i class="liq"></i><i class="cap"></i></i>
          <i class="tube t5"><i class="liq"></i><i class="cap"></i></i>
          <i class="tube t6"><i class="liq"></i><i class="cap"></i></i>
          <i class="tube t7"><i class="liq"></i><i class="cap"></i></i>
          <i class="tube t8"><i class="liq"></i><i class="cap"></i></i>
        </div>
        <i class="lamp cold"></i>
        <i class="lamp hot"></i>
        <i class="lamp warm"></i>
        <i class="vapour"></i>
        <i class="frost"></i>
      </div>
      <i class="console">
        <p class="read"><span><b>95.0</b><b>60.0</b><b>72.0</b></span><em>°C</em></p>
        <i class="bar"></i>
      </i>
      <i class="led"></i>
    </div>
  </div>
</main>
</body>
</html>
