<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fountain Loop</title>
<meta name="description" content="A stone fountain in the sun: the jet swells out of the nozzle, throws off drops that each trace their own arc to the water in the bowl, and sinks back to a short spurt before the next surge.">
<meta name="description-es" content="Una fuente de piedra al sol: el chorro se hincha en la boquilla, lanza gotas que trazan su propio arco hasta el agua del pilón y se retira a un chorro corto antes del siguiente empujón.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="court" aria-busy="true">
  <div class="rig">
    <div class="glow"></div>
    <div class="jet">
      <span class="column"></span>
      <span class="crown"></span>
    </div>
    <div class="drops">
      <span class="drop" style="--dx:-0.95;--dl:0s"><i class="ball"></i></span>
      <span class="drop" style="--dx:-0.78;--dl:-.25s"><i class="ball"></i></span>
      <span class="drop" style="--dx:-0.6;--dl:-.5s"><i class="ball"></i></span>
      <span class="drop" style="--dx:-0.42;--dl:-.75s"><i class="ball"></i></span>
      <span class="drop" style="--dx:0.42;--dl:-1s"><i class="ball"></i></span>
      <span class="drop" style="--dx:0.6;--dl:-1.25s"><i class="ball"></i></span>
      <span class="drop" style="--dx:0.78;--dl:-1.5s"><i class="ball"></i></span>
      <span class="drop" style="--dx:0.95;--dl:-1.75s"><i class="ball"></i></span>
    </div>
    <div class="basin">
      <span class="edge"></span>
      <span class="bowl">
        <span class="skin"></span>
        <i class="ripple p1"></i>
        <i class="ripple p2"></i>
        <i class="ripple p3"></i>
      </span>
      <span class="front"></span>
    </div>
    <div class="pedestal"></div>
    <div class="nozzle">
      <span class="stem"></span>
      <span class="lip"></span>
    </div>
  </div>
  <p class="sr" role="status">The fountain jet rises and the drops it throws follow their arcs back into the bowl</p>
</main>
</body>
</html>
