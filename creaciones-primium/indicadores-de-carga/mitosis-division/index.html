<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mitosis Division</title>
<meta name="description" content="One living cell duplicates its nucleus, condenses its chromosomes, pulls them to opposite poles and pinches at the waist until two clean daughter cells drift apart.">
<meta name="description-es" content="Una célula viva duplica su núcleo, condensa sus cromosomas, los lleva a polos opuestos y se estrangula por la cintura hasta que dos células hijas se separan con limpieza.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="cell" aria-hidden="true">
    <span class="rim"></span>
    <span class="body"></span>
    <span class="slide slide--l"><span class="chrom"><i></i><i></i><i></i></span></span>
    <span class="slide slide--r"><span class="chrom"><i></i><i></i><i></i></span></span>
    <span class="pole pole--l"><span class="nuc nuc--l"><b></b></span></span>
    <span class="pole pole--r"><span class="nuc nuc--r"><b></b></span></span>
  </div>
  <p class="sr" role="status">Mitosis: la célula replica su núcleo, condensa los cromosomas y se divide en dos células hijas.</p>
</main>
</body>
</html>
