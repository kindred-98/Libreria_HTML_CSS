<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wax Cell Seal</title>
<meta name="description" content="A bee works three brood cells in turn: a wax pellet is pressed in, spread to the hexagon corners and smoothed by fanning while the wet shine slowly goes off.">
<meta name="description-es" content="Una abeja trabaja tres celdillas seguidas: deposita un trozo de cera, lo extiende hasta las esquinas del hexágono y lo alisa con las alas mientras el brillo húmedo se apaga.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="comb" aria-hidden="true">
      <span class="cell" style="left:0.00%;top:6.70%;width:25%;height:28.87%"></span>
      <span class="cell" style="left:25.00%;top:6.70%;width:25%;height:28.87%"></span>
      <span class="cell" style="left:50.00%;top:6.70%;width:25%;height:28.87%"></span>
      <span class="cell" style="left:75.00%;top:6.70%;width:25%;height:28.87%"></span>
      <span class="cell" style="left:-12.50%;top:35.60%;width:25%;height:28.87%"></span>
      <span class="cell cell--a" style="left:12.50%;top:35.60%;width:25%;height:28.87%"><span class="wax"></span></span>
      <span class="cell cell--b" style="left:37.50%;top:35.60%;width:25%;height:28.87%"><span class="wax"></span></span>
      <span class="cell cell--c" style="left:62.50%;top:35.60%;width:25%;height:28.87%"><span class="wax"></span></span>
      <span class="cell" style="left:0.00%;top:64.40%;width:25%;height:28.87%"></span>
      <span class="cell" style="left:25.00%;top:64.40%;width:25%;height:28.87%"></span>
      <span class="cell" style="left:50.00%;top:64.40%;width:25%;height:28.87%"></span>
      <span class="cell" style="left:75.00%;top:64.40%;width:25%;height:28.87%"></span>
      <span class="pellet pellet--a" style="left:25.00%;top:11.60%"></span>
      <span class="pellet pellet--b" style="left:50.00%;top:11.60%"></span>
      <span class="pellet pellet--c" style="left:75.00%;top:11.60%"></span>
    <span class="wing wing--l"></span>
    <span class="wing wing--r"></span>
    <span class="sheen"></span>
  </div>
  <p class="sr" role="status">Sellando celdas: la cera se extiende dentro del panal y se alisa con el batir de las alas.</p>
</main>
</body>
</html>
