<title>Fibonacci Spiral Trace</title>
<meta name="description" content="A golden spiral draws itself out of seven nested squares: each square lands, the quarter arc that belongs to it sweeps from its centre, and the overlapping translucent panels pile the light up brighter toward the eye of the spiral.">

</head>
