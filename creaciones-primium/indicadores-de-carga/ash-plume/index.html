<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ash Plume</title>
<meta name="description" content="A volcano feeds a tall ash column into the air: dark billows roll up from the throat in a steady stream, the top spreads into a wide cap whose edge frays into separate tufts that drift away, and an orange glow pulses at the vent while grey specks fall around it.">
<meta name="description-es" content="Un volcán alimenta una alta columna de ceniza: bolloques oscuros suben de la boca en un flujo constante, la parte alta se abre en un capuchón ancho cuyo borde se deshilacha en mechones sueltos que se van, y un resplandor naranja late en la garganta mientras caen motas grises alrededor.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="scene" aria-busy="true">
  <div class="sky" aria-hidden="true"></div>
  <div class="obj" aria-hidden="true">
    <div class="vent">
      <span class="throat"></span>
      <span class="cone"></span>
    </div>
    <div class="plume">
      <span class="stem"></span>
      <span class="cap"></span>
      <span class="billow" style="--k:0;--dx:-6"></span>
      <span class="billow" style="--k:1;--dx:9"></span>
      <span class="billow" style="--k:2;--dx:-14"></span>
      <span class="billow" style="--k:3;--dx:16"></span>
      <span class="billow" style="--k:4;--dx:-22"></span>
      <span class="billow" style="--k:5;--dx:26"></span>
    </div>
    <div class="fuzz">
      <i style="--k:0;--dx:-18"></i><i style="--k:1;--dx:22"></i><i style="--k:2;--dx:-30"></i>
      <i style="--k:3;--dx:34"></i><i style="--k:4;--dx:-40"></i>
    </div>
    <div class="specks">
      <i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i>
      <i style="--k:3"></i><i style="--k:4"></i><i style="--k:5"></i>
    </div>
  </div>
  <p class="sr" role="status">An ash column rises from a vent: dark billows roll upward, the top spreads into a cap that frays into loose tufts drifting away, and an orange glow pulses at the throat.</p>
</main>
</body>
</html>
