<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wave Break</title>
<meta name="description" content="A tiled pool in cross section: a swell builds from the left, climbs, folds its crest backwards over itself and throws a burst of foam forward before the water settles back to a flat skin.">
<meta name="description-es" content="Una piscina alicatada de perfil: una ola crece por la izquierda, sube, dobla la cresta hacia atrás sobre sí misma y lanza una ráfaga de espuma hacia delante antes de que el agua vuelva a quedar lisa.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="pool" aria-busy="true">
  <div class="rig">
    <div class="deck">
      <span class="coping"></span>
      <span class="grout"></span>
    </div>
    <div class="body">
      <span class="tiles">
        <i class="trow"></i>
      </span>
      <span class="water"></span>
      <span class="caustic"></span>
    </div>
    <div class="skin"></div>
    <div class="swell"></div>
    <div class="breaker">
      <span class="crest">
        <i class="front"></i>
        <i class="back"></i>
        <i class="lip"></i>
      </span>
    </div>
    <div class="foam">
      <i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i>
    </div>
  </div>
  <p class="sr" role="status">A wave builds, its crest folds backwards and the foam scatters across the pool</p>
</main>
</body>
</html>
