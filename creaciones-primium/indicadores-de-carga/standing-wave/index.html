<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standing Wave</title>
<meta name="description" content="A string clamped at both ends holds a fourth mode standing wave: the shape of the curve never travels, every bead swings in phase, and the five nodes stay locked on the axis while only a reflection of light breathes under the water.">
<meta name="description-es" content="Una cuerda sujeta por los dos extremos sostiene una onda estacionaria de cuarto modo: la forma de la curva no viaja, cada cuenta oscila en fase y los cinco nodos quedan clavados en el eje mientras el agua está quieta salvo por un reflejo de luz.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="fig" aria-hidden="true">
    <div class="tank"><div class="tide"></div></div>
    <div class="ends"><b class="clamp clamp--l"></b><b class="clamp clamp--r"></b></div>
    <div class="strand">
      <i style="--a:0.000;left:0%"></i>
      <i style="--a:0.259;left:2.083%"></i>
      <i style="--a:0.500;left:4.167%"></i>
      <i style="--a:0.707;left:6.25%"></i>
      <i style="--a:0.866;left:8.333%"></i>
      <i style="--a:0.966;left:10.417%"></i>
      <i style="--a:1.000;left:12.5%"></i>
      <i style="--a:0.966;left:14.583%"></i>
      <i style="--a:0.866;left:16.667%"></i>
      <i style="--a:0.707;left:18.75%"></i>
      <i style="--a:0.500;left:20.833%"></i>
      <i style="--a:0.259;left:22.917%"></i>
      <i style="--a:0.000;left:25%"></i>
      <i style="--a:-0.259;left:27.083%"></i>
      <i style="--a:-0.500;left:29.167%"></i>
      <i style="--a:-0.707;left:31.25%"></i>
      <i style="--a:-0.866;left:33.333%"></i>
      <i style="--a:-0.966;left:35.417%"></i>

      <i style="--a:-0.966;left:39.583%"></i>
      <i style="--a:-0.866;left:41.667%"></i>
      <i style="--a:-0.707;left:43.75%"></i>
      <i style="--a:-0.500;left:45.833%"></i>
      <i style="--a:-0.259;left:47.917%"></i>
      <i style="--a:-0.000;left:50%"></i>
      <i style="--a:0.259;left:52.083%"></i>
      <i style="--a:0.500;left:54.167%"></i>
      <i style="--a:0.707;left:56.25%"></i>
      <i style="--a:0.866;left:58.333%"></i>
      <i style="--a:0.966;left:60.417%"></i>
      <i style="--a:1.000;left:62.5%"></i>

      <i style="--a:0.000;left:75%"></i>
      <i style="--a:-0.259;left:77.083%"></i>
      <i style="--a:-0.500;left:79.167%"></i>
      <i style="--a:-0.707;left:81.25%"></i>
      <i style="--a:-0.866;left:83.333%"></i>
      <i style="--a:-0.966;left:85.417%"></i>
      <i style="--a:-1.000;left:87.5%"></i>

      <i style="--a:-0.000;left:100%"></i>
    </div>
    <div class="nodes">
      <b style="left:0%"></b>
      <b style="left:25%"></b>
      <b style="left:50%"></b>
      <b style="left:75%"></b>
      <b style="left:100%"></b>
    </div>
    <div class="bed"></div>
    <div class="gloss"></div>
  </div>
  <p class="sr" role="status">A standing wave between two fixed ends: the string keeps its shape, the five nodes barely move and the crests swing in phase.</p>
</main>
</body>
</html>
