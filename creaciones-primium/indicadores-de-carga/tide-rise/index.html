<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tide Rise</title>
<meta name="description" content="A cut of beach in cross section: the sheet of water walks up the sand, the wet strip it leaves keeps its own darker colour while it drains, and then the tide comes back and buries the sand under the water again.">
<meta name="description-es" content="Un corte de playa de perfil: la lámina de agua sube por la arena, la franja mojada conserva su color más oscuro mientras se vacía, y luego la marea vuelve y cubre la arena otra vez.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shore" aria-busy="true">
  <div class="rig">
    <div class="haze"></div>
    <div class="bed">
      <div class="wet">
        <span class="sheen"></span>
        <span class="drain d1"></span>
        <span class="drain d2"></span>
      </div>
      <span class="grit"></span>
      <span class="pebble p1"></span>
      <span class="pebble p2"></span>
      <span class="shell"></span>
    </div>
    <div class="water">
      <span class="body"></span>
      <span class="skin">
        <i class="crest c1"></i><i class="crest c2"></i><i class="crest c3"></i>
        <i class="foam f1"></i><i class="foam f2"></i><i class="foam f3"></i><i class="foam f4"></i>
      </span>
      <span class="glint"></span>
    </div>
  </div>
  <p class="sr" role="status">The tide walks up the sand, drains out of the strip it wetted and comes back over the beach</p>
</main>
</body>
</html>
