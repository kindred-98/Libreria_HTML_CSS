<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slag Skim</title>
<meta name="description" content="A skimmer rod pushes the grey slag crust off the surface of a crucible: the torn crust slides aside in two halves and the clean metal underneath comes up bright, then the rod comes back, the crust closes over the bath and the fire keeps working around the pot.">
<meta name="description-es" content="Una varilla aparta la costra de escoria de la superficie de un crisol: la costra rasgada se desliza en dos mitades y el metal limpio de debajo sale a la luz, y luego la varilla vuelve, la costra se cierra sobre el baño y el fuego sigue trabajando alrededor del crisol.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Slag being skimmed off the crucible, clean metal showing through</p>
  <div class="obj" aria-hidden="true">
    <i class="heat"></i>
    <div class="crucible">
      <i class="rimback"></i>
      <i class="bath"></i>
      <i class="sheen"></i>
      <i class="slag"></i>
      <i class="rim"></i>
    </div>
    <div class="rod">
      <i class="shaft"></i>
      <i class="tip"></i>
    </div>
    <i class="flame f1"></i>
    <i class="flame f2"></i>
    <i class="flame f3"></i>
    <i class="spark s1"></i>
    <i class="spark s2"></i>
  </div>
  <p class="phase" aria-hidden="true"><span class="t1">crust</span><span class="t2">skim</span><span class="t3">bright</span><span class="t4">close</span></p>
</main>
</body>
</html>
