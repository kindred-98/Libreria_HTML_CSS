<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geyser Burst</title>
<meta name="description" content="A geyser on a silica terrace builds pressure, swells the water in its vent and then fires a narrow column of water into the empty air: higher up the jet thins out, breaks into separate droplets and dissolves into a wide cloud of steam.">
<meta name="description-es" content="Un geiser sobre una terraza de sílice acumula presión, hincha el agua de su boca y dispara una columna estrecha de agua al vacío: arriba el chorro se afina, se rompe en gotas sueltas y se disuelve en una nube de vapor ancha.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="scene" aria-busy="true">
  <div class="sky" aria-hidden="true"></div>
  <div class="obj" aria-hidden="true">
    <div class="vent">
      <span class="pool"></span>
      <span class="dome"></span>
      <span class="lip"></span>
    </div>
    <div class="jet">
      <span class="water"></span>
      <span class="spray"></span>
    </div>
    <div class="vapor"><i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i><i style="--k:3"></i></div>
    <div class="drops">
      <i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i><i style="--k:3"></i><i style="--k:4"></i>
      <i style="--k:5"></i><i style="--k:6"></i><i style="--k:7"></i><i style="--k:8"></i><i style="--k:9"></i>
      <i style="--k:10"></i><i style="--k:11"></i>
    </div>
    <div class="terrace">
      <span class="crust"></span>
      <span class="wet"></span>
      <span class="ledge l1"></span>
      <span class="ledge l2"></span>
    </div>
  </div>
  <p class="sr" role="status">A geyser builds pressure, bursts into a narrow jet, and the column breaks into droplets and steam before falling back into the vent.</p>
</main>
</body>
</html>
