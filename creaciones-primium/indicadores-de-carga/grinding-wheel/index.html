<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grinding Wheel</title>
<meta name="description" content="A steel wheel spins up against a blade on a grinder: the stone accelerates to speed, the piece is pressed in, a shower of orange sparks leaves the contact tangentially and falls away in a fan, the wheel slows as the bevel takes shape, and the sparks die down to a few slow embers.">
<meta name="description-es" content="Una muela de acero acelera contra una cuchilla en un esmeril: la piedra toma velocidad, la pieza se presiona, un chorro de chispas naranjas sale del contacto de forma tangencial y cae en abanico, la muela baja de vueltas mientras se forma el bisel y las chispas mueren en un par de ascuas lentas.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="grinder" aria-hidden="true">
    <span class="base"></span>
    <div class="wheel">
      <span class="rim"></span>
      <span class="hub"></span>
      <span class="groove"></span>
    </div>
    <div class="rest"></div>
    <span class="blade"></span>
    <div class="sparks">
      <i style="--t:-2.4;--r:66"></i>
      <i style="--t:-1.9;--r:44"></i>
      <i style="--t:-1.3;--r:74"></i>
      <i style="--t:-0.8;--r:52"></i>
      <i style="--t:-0.3;--r:62"></i>
      <i style="--t:0.2;--r:48"></i>
      <i style="--t:0.7;--r:70"></i>
      <i style="--t:1.2;--r:56"></i>
      <i style="--t:1.8;--r:40"></i>
      <i style="--t:-1.1;--r:34"></i>
      <i style="--t:0.5;--r:30"></i>
      <i style="--t:1.5;--r:36"></i>
    </div>
    <span class="glow"></span>
  </div>
  <p class="sr" role="status">Esmerilando: la muela de acero acelera, la pieza entra contra el disco y salen chispas tangentes que caen en abanico mientras el bisel se forma.</p>
</main>
</body>
</html>
