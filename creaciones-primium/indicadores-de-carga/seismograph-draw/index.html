<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seismograph Draw</title>
<meta name="description" content="A paper drum turns under a fixed stylus: the chart accelerates through the middle of the pass, stretching the inked wave into long lazy swells, then calms to a crawl where the trace packs into tight tremors before the paper returns to the start.">
<meta name="description-es" content="Un tambor de papel gira bajo un estilete fijo: el gráfico acelera en el centro de la pasada, estirando la onda entintada en lomos largos, y luego se calma hasta arrastrarse, con la traza apretada en temblores, antes de volver al inicio.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Seismograph drawing, the trace accelerating and calming on the drum</p>
  <div class="obj" aria-hidden="true">
    <i class="shadow"></i>
    <div class="drum">
      <div class="tape">
        <i class="w1"></i>
        <i class="w2"></i>
        <i class="w3"></i>
        <i class="w4"></i>
      </div>
      <i class="shade"></i>
      <i class="glassline"></i>
      <i class="ticks"></i>
      <p class="unit">±2 mm</p>
    </div>
    <i class="cap l"></i>
    <i class="cap r"></i>
    <i class="post"></i>
    <i class="arm"></i>
    <div class="pen"><i class="barrel"></i><i class="nib"></i></div>
    <i class="plinth"></i>
    <i class="drive"></i>
  </div>
</main>
</body>
</html>
