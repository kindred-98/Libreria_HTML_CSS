<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waterwheel Turn</title>
<meta name="description" content="An eight paddle water wheel turns in its wooden frame: every board goes under the water at the bottom of the turn, comes up wet and dark, and the trough splashes each time one enters.">
<meta name="description-es" content="Una rueda de agua de ocho palas gira en su marco de madera: cada tabla entra en el agua al final de la vuelta, sale mojada y oscura, y el canal salpica cada vez que una entra.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="mill" aria-busy="true">
  <div class="rig">
    <div class="post post-l"></div>
    <div class="post post-r"></div>
    <div class="beam"></div>
    <div class="bearing"></div>
    <div class="moss moss-a"></div>
    <div class="moss moss-b"></div>
    <div class="wheel">
      <span class="ring ring-in"></span>
      <span class="ring ring-out"></span>
      <span class="spokes">
        <i class="sp s1"></i><i class="sp s2"></i><i class="sp s3"></i><i class="sp s4"></i>
        <i class="sp s5"></i><i class="sp s6"></i><i class="sp s7"></i><i class="sp s8"></i>
      </span>
      <span class="paddles">
        <i class="p" style="--r:0deg;--d:2s"><b class="board"><em class="wet"></em></b></i>
        <i class="p" style="--r:45deg;--d:2.5s"><b class="board"><em class="wet"></em></b></i>
        <i class="p" style="--r:90deg;--d:3s"><b class="board"><em class="wet"></em></b></i>
        <i class="p" style="--r:135deg;--d:3.5s"><b class="board"><em class="wet"></em></b></i>
        <i class="p" style="--r:180deg;--d:0s"><b class="board"><em class="wet"></em></b></i>
        <i class="p" style="--r:225deg;--d:.5s"><b class="board"><em class="wet"></em></b></i>
        <i class="p" style="--r:270deg;--d:1s"><b class="board"><em class="wet"></em></b></i>
        <i class="p" style="--r:315deg;--d:1.5s"><b class="board"><em class="wet"></em></b></i>
      </span>
      <span class="hub"></span>
      <span class="axle"></span>
    </div>
    <div class="trough">
      <span class="rimwood"></span>
      <span class="water">
        <i class="sk sk1"></i><i class="sk sk2"></i><i class="sk sk3"></i>
        <span class="caustic"></span>
      </span>
      <span class="spray"><i class="q1"></i><i class="q2"></i><i class="q3"></i></span>
      <span class="moss moss-c"></span>
    </div>
  </div>
  <p class="sr" role="status">The water wheel turns and every paddle comes up out of the trough wet</p>
</main>
</body>
</html>
