<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whirlpool Drain</title>
<meta name="description" content="A floor drain seen from above: three spiral arms of water wind down into the bolted grate, foam circles the bowl and the outer sheet is flung off at the rim.">
<meta name="description-es" content="Un desagüe visto desde arriba: tres brazos en espiral bajan hasta la rejilla atornillada, la espuma rodea el cuenco y la lámina exterior sale despedida por el borde.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="floor" aria-busy="true">
  <div class="rig">
    <div class="slab"></div>
    <div class="dish">
      <span class="rim"></span>
      <span class="sheet"></span>
      <div class="swirl spin">
        <div class="arm a1"><i></i><i></i><i></i><i></i></div>
        <div class="arm a2"><i></i><i></i><i></i><i></i></div>
        <div class="arm a3"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="swirl core spinBack">
        <div class="arm b1"><i></i><i></i><i></i></div>
        <div class="arm b2"><i></i><i></i><i></i></div>
      </div>
      <div class="foam">
        <i class="arc a1"></i><i class="arc a2"></i><i class="arc a3"></i>
        <span class="track"><i class="bub"></i></span>
        <span class="track tr2"><i class="bub"></i></span>
        <span class="track tr3"><i class="bub"></i></span>
        <span class="track tr4"><i class="bub"></i></span>
      </div>
      <div class="spray">
        <span class="track"><i class="dot"></i></span>
        <span class="track tr2"><i class="dot"></i></span>
        <span class="track tr3"><i class="dot"></i></span>
      </div>
      <div class="grate">
        <span class="ring"></span>
        <span class="hole"></span>
        <i class="bar b1"></i><i class="bar b2"></i><i class="bar b3"></i>
        <span class="bolt q1"></span><span class="bolt q2"></span>
      </div>
    </div>
  </div>
  <p class="sr" role="status">Three spiral arms of water wind down into the drain while foam circles the bowl</p>
</main>
</body>
</html>
