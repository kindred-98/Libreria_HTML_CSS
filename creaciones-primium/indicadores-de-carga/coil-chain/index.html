<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coil Chain</title>
<meta name="description" content="A fifteen link steel chain winds itself into a helix and keeps turning: every link holds the orientation it was forged with while the coil screws up and down its axis, and a hard specular band rakes across the steel.">
<meta name="description-es" content="Una cadena de acero de quince eslabones se enrolla en una hélice y no deja de girar: cada eslabón conserva la orientación con la que fue forjado mientras la bobina sube y baja por su eje, y una banda especular dura barre el acero.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="fig" aria-hidden="true">
    <div class="hall">
      <div class="deck"></div>
      <div class="coil">
<i style="--a:0deg;top:7%;--tilt:-7deg;animation-delay:0s"></i>
<i style="--a:24deg;top:13%;--tilt:84deg;animation-delay:-0.09s"></i>
<i style="--a:48deg;top:19%;--tilt:-7deg;animation-delay:-0.18s"></i>
<i style="--a:72deg;top:25%;--tilt:84deg;animation-delay:-0.27s"></i>
<i style="--a:96deg;top:31%;--tilt:-7deg;animation-delay:-0.36s"></i>
<i style="--a:120deg;top:37%;--tilt:84deg;animation-delay:-0.45s"></i>
<i style="--a:144deg;top:43%;--tilt:-7deg;animation-delay:-0.54s"></i>
<i style="--a:168deg;top:49%;--tilt:84deg;animation-delay:-0.63s"></i>
<i style="--a:192deg;top:55%;--tilt:-7deg;animation-delay:-0.72s"></i>
<i style="--a:216deg;top:61%;--tilt:84deg;animation-delay:-0.81s"></i>
<i style="--a:240deg;top:67%;--tilt:-7deg;animation-delay:-0.9s"></i>
<i style="--a:264deg;top:73%;--tilt:84deg;animation-delay:-0.99s"></i>
<i style="--a:288deg;top:79%;--tilt:-7deg;animation-delay:-1.08s"></i>
<i style="--a:312deg;top:85%;--tilt:84deg;animation-delay:-1.17s"></i>
<i style="--a:336deg;top:91%;--tilt:-7deg;animation-delay:-1.26s"></i>
      </div>
      <div class="rake"></div>
    </div>
    <div class="pool"></div>
  </div>
  <p class="sr" role="status">A chain is coiling into a helix and turning; each link keeps its own orientation while a hard light rakes across the steel.</p>
</main>
</body>
</html>
