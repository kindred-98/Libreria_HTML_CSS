<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umbra Cross</title>
<meta name="description" content="The Earth shadow cone sweeps twice across a cratered full moon, its penumbra edge staying razor sharp as the eclipsed ground turns deep amber earthshine and the black core swallows whole craters on the way past.">
<meta name="description-es" content="El cono de sombra de la Tierra barre dos veces la cara de una luna llena craterizada, con el borde de su penumbra siempre nítido, mientras el eclipsado se vuelve un ámbar profundo y el núcleo negro se traga cráteres enteros al pasar.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="black" aria-busy="true">
  <div class="black__bg" aria-hidden="true"></div>
  <div class="black__stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <div class="moon" aria-hidden="true">
    <span class="moon__body"></span>
    <span class="moon__mare"></span>
    <span class="crater crater--a"></span>
    <span class="crater crater--b"></span>
    <span class="crater crater--c"></span>
    <span class="crater crater--d"></span>
    <span class="crater crater--e"></span>
    <span class="crater crater--f"></span>
    <span class="crater crater--g"></span>
    <span class="moon__limb"></span>
    <span class="moon__earthshine"></span>
  </div>

  <div class="shadow" aria-hidden="true">
    <span class="shadow__penumbra"></span>
    <span class="shadow__core"></span>
    <span class="shadow__edge"></span>
  </div>

  <p class="read" aria-hidden="true">Eclipsed<span class="read__v" id="ec">0 pct</span></p>

  <p class="sr" role="status">Lunar eclipse in progress: the Earth shadow cone sweeps twice across the cratered moon, its penumbra edge staying sharp as the eclipsed ground turns deep amber earthshine.</p>
</main>
</body>
</html>
