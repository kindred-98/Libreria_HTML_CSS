<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blink Reflex</title>
<meta name="description" content="A close eye in skin: the gaze drifts, the pupil tightens, a reflex blink slams the lids shut in a fraction of a second and the lid shadow sweeps down with them.">
<meta name="description-es" content="Un ojo de cerca sobre la piel: la mirada se desvía, la pupila se aprieta, un parpadeo reflejo cierra los párpados en una fracción de segundo y su sombra baja con ellos.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="face" aria-hidden="true">
    <span class="skin"></span>
    <div class="socket">
      <div class="ball">
        <span class="sclera"></span>
        <div class="gaze">
          <span class="iris"></span>
          <span class="pupil"></span>
          <span class="glint"></span>
        </div>
        <span class="lidshade"></span>
        <span class="lowshade"></span>
      </div>
      <span class="lidup"></span>
      <span class="liddn"></span>
      <span class="lash"></span>
      <span class="crease"></span>
      <span class="brow"></span>
    </div>
  </div>
  <p class="sr" role="status">Parpadeo reflejo: el párpado baja de golpe y vuelve a subir dejando pasar la mirada.</p>
</main>
</body>
</html>
