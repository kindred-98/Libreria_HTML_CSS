<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delta V Burn</title>
<meta name="description" content="A ribbed copper engine bell fires a chain of throttle pulses on a black field, each thump kicking the whole stage backwards as the flame snaps out and the remaining delta-v budget drains segment by segment toward zero.">
<meta name="description-es" content="Una campana de motor de cobre con nervios dispara una cadena de pulsos de potencia sobre fondo negro, cada golpe empujando la etapa hacia atrás mientras la llama sale disparada, y el presupuesto de delta-v restante se agota segmento a segmento hasta cero.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="void" aria-busy="true">
  <div class="void__bg" aria-hidden="true"></div>

  <div class="craft" aria-hidden="true">
    <span class="mantle"></span>
    <span class="vapour"></span>
    <span class="cone cone--a"></span>
    <span class="cone cone--b"></span>
    <span class="cone cone--c"></span>
    <span class="core"></span>

    <div class="stage">
      <span class="stage__hull"></span>
      <span class="stage__cap"></span>
      <span class="stage__tank"></span>
      <span class="stage__band"></span>
      <span class="stage__line"></span>
      <span class="stage__girth"></span>
    </div>

    <div class="bell">
      <span class="bell__skin"></span>
      <span class="bell__throat"></span>
      <span class="bell__ring bell__ring--a"></span>
      <span class="bell__ring bell__ring--b"></span>
      <span class="bell__lip"></span>
    </div>
  </div>

  <p class="read" aria-hidden="true">Delta v left<span class="read__v" id="dv">480 m/s</span><span class="meter"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></span></p>

  <p class="sr" role="status">Propulsion burn running: the copper engine fires a chain of throttle pulses, each kick shoving the stage backwards as the flame flares, and the remaining delta-v budget drains toward zero.</p>
</main>
</body>
</html>
