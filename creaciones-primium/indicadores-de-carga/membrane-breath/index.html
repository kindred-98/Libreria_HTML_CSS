<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Membrane Breath</title>
<meta name="description" content="A living membrane fills and empties: it swells until the radial folds smooth out completely, then folds them again as it sinks back, taking the light with it.">
<meta name="description-es" content="Una membrana viva se llena y se vacía: se hincha hasta que sus pliegues radiales se alisan por completo y vuelve a plegarlos mientras se hunde de nuevo, arrastrando la luz.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="lung" aria-hidden="true">
    <span class="halo"></span>
    <div class="film">
      <span class="folds"><i style="--a:8deg"></i><i style="--a:52deg"></i><i style="--a:96deg"></i><i style="--a:140deg"></i><i style="--a:184deg"></i><i style="--a:228deg"></i><i style="--a:272deg"></i><i style="--a:316deg"></i></span>
      <span class="capillary"></span>
      <span class="sheen"></span>
    </div>
    <span class="rim"></span>
    <span class="mote mote--a"></span>
    <span class="mote mote--b"></span>
    <span class="mote mote--c"></span>
    <span class="mote mote--d"></span>
  </div>
  <p class="sr" role="status">La membrana respirando: se hincha, los pliegues se alisan y vuelve a hundirse plegándose.</p>
</main>
</body>
</html>
