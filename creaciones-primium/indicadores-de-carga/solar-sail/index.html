<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar Sail</title>
<meta name="description" content="Four gold sail petals swing out from a deep space bus on their booms, sagging under their own weight until the cloth snaps taut with a travelling tension ripple, then fold back while solar wind streaks drift across a violet nebula.">
<meta name="description-es" content="Cuatro pétalos de vela dorados se despliegan desde un bus de espacio profundo sobre sus brazos, cediendo bajo su propio peso hasta que la tela se tensa de golpe con una onda de tensión que viaja, y vuelven a plegarse mientras trazos de viento solar atraviesan una nebulosa violeta.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="deep" aria-busy="true">
  <div class="deep__bg" aria-hidden="true"></div>
  <div class="deep__stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="wind" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <div class="rig" aria-hidden="true">
    <span class="boom boom--n"></span>
    <span class="boom boom--e"></span>
    <span class="boom boom--s"></span>
    <span class="boom boom--w"></span>

    <div class="petal petal--n">
      <span class="cloth"><i class="mesh"></i><i class="rib"></i><i class="rib rib--2"></i><i class="gloss"></i><i class="seam"></i></span>
      <span class="ripple"></span>
      <span class="edge"></span>
    </div>
    <div class="petal petal--e">
      <span class="cloth"><i class="mesh"></i><i class="rib"></i><i class="rib rib--2"></i><i class="gloss"></i><i class="seam"></i></span>
      <span class="ripple"></span>
      <span class="edge"></span>
    </div>
    <div class="petal petal--s">
      <span class="cloth"><i class="mesh"></i><i class="rib"></i><i class="rib rib--2"></i><i class="gloss"></i><i class="seam"></i></span>
      <span class="ripple"></span>
      <span class="edge"></span>
    </div>
    <div class="petal petal--w">
      <span class="cloth"><i class="mesh"></i><i class="rib"></i><i class="rib rib--2"></i><i class="gloss"></i><i class="seam"></i></span>
      <span class="ripple"></span>
      <span class="edge"></span>
    </div>

    <div class="bus">
      <span class="bus__hull"></span>
      <span class="bus__band"></span>
      <span class="bus__lens"></span>
    </div>
  </div>

  <p class="read" aria-hidden="true">Sail<span class="read__v" id="sf">0 percent</span></p>

  <p class="sr" role="status">Solar sail deploying: the four gold petals swing out on their booms, the cloth sags under its own weight, then snaps taut with a travelling tension ripple before folding back.</p>
</main>
</body>
</html>
