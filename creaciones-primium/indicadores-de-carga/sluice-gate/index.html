<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sluice Gate</title>
<meta name="description" content="A steel sluice gate lifts inside its mossy channel: the head of water dips, the gap opens and the jet below thickens from a thread into a full sheet before the gate drops back and slams shut.">
<meta name="description-es" content="Una compuerta de acero sube por su canal con musgo: la lámina de agua baja, la rendija se abre y el chorro engorda de hilo a cortina antes de que la compuerta vuelva a caer de golpe.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="bay" aria-busy="true">
  <div class="rig">
    <div class="lining"></div>
    <div class="sill"></div>
    <div class="head">
      <span class="head-top"></span>
      <span class="head-drip"></span>
    </div>
    <div class="jet">
      <span class="jet-core"></span>
      <span class="jet-foam"></span>
    </div>
    <div class="splash">
      <i class="s1"></i><i class="s2"></i><i class="s3"></i>
    </div>
    <div class="pool">
      <span class="pool-skin"></span>
      <span class="refl"></span>
      <span class="refl-gate"></span>
    </div>
    <div class="frame">
      <span class="rail rail-l"></span>
      <span class="rail rail-r"></span>
      <span class="beam"></span>
      <span class="brace"></span>
      <span class="moss moss-l"></span>
      <span class="moss moss-r"></span>
      <span class="moss moss-sill"></span>
    </div>
    <div class="gate">
      <span class="plate">
        <i class="rib rib-1"></i>
        <i class="rib rib-2"></i>
        <i class="rib rib-3"></i>
        <span class="hand">
          <i class="spoke sp-1"></i><i class="spoke sp-2"></i><i class="spoke sp-3"></i><i class="spoke sp-4"></i>
          <i class="knob"></i>
        </span>
      </span>
    </div>
  </div>
  <p class="sr" role="status">A steel sluice gate rises, the jet below it grows to a full sheet of water, and the gate falls back into its seat</p>
</main>
</body>
</html>
