<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus Stack</title>
<meta name="description" content="A microscope objective walks its focal plane down through a thick specimen and back up: the sharpness crosses from the upper cell layer to the middle and the lower one, blurring each plane it leaves behind.">
<meta name="description-es" content="Un objetivo de microscopio recorre su plano focal de arriba abajo y de vuelta a través de una muestra gruesa: la nitidez pasa de la capa celular superior a la intermedia y a la inferior, desenfocando cada plano que abandona.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Focus stack running, the sharp plane travelling through the specimen</p>
  <div class="obj" aria-hidden="true">
    <div class="head">
      <i class="barrel"></i>
      <i class="band"></i>
      <i class="nose"></i>
      <i class="lens"></i>
      <i class="halo"></i>
    </div>
    <i class="cone"></i>
    <div class="slide">
      <i class="glass"></i>
      <i class="mass"></i>
      <i class="layer l1"></i>
      <i class="layer l2"></i>
      <i class="layer l3"></i>
      <i class="specular"></i>
    </div>
    <div class="rail">
      <i class="ruler"></i>
      <i class="marker"></i>
      <p class="read"><span><b>000</b><b>012</b><b>024</b></span><em>µm</em></p>
    </div>
  </div>
</main>
</body>
</html>
