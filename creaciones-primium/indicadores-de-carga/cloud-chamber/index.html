<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Chamber</title>
<meta name="description" content="A cloud chamber breathes in supersaturated vapour: a source at the floor throws thin ionisation tracks that grow out of the fog, drift sideways as the gas expands, and dissolve back into the mist.">
<meta name="description-es" content="Una cámara de nubes respira en vapor sobresaturado: una fuente en el fondo lanza rastros finos de ionización que crecen desde la niebla, se desplazan de lado al expandirse el gas y se disuelven de nuevo en la bruma.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Cloud chamber tracking particles, thin vapour trails drifting through the fog</p>
  <div class="obj" aria-hidden="true">
    <div class="chamber">
      <i class="fog f1"></i>
      <i class="fog f2"></i>
      <i class="fog f3"></i>
      <div class="tracks">
        <i class="tr t1"><b></b></i>
        <i class="tr t2"><b></b></i>
        <i class="tr t3"><b></b></i>
        <i class="tr t4"><b></b></i>
        <i class="tr t5"><b></b></i>
      </div>
      <i class="source"></i>
      <i class="puff"></i>
      <i class="plate"></i>
      <i class="wall"></i>
    </div>
  </div>
</main>
</body>
</html>
