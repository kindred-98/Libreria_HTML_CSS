<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Potter Wheel Centering</title>
<meta name="description" content="A potter wheel throws a clay cylinder upward one pull per revolution: the wall rises a step at a time, a wet gloss sweeps across the form on every turn and water leaves the rim in flat parabolic arcs.">
<meta name="description-es" content="Un torno de alfarero levanta un cilindro de barro una pasada por vuelta: la pared sube a saltos, un brillo húmedo barre la pieza en cada giro y el agua sale del borde en parábolas tendidas.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="wheel" aria-hidden="true">
    <span class="pad"></span>
    <span class="head">
      <i class="disc"></i>
      <i class="spin"></i>
    </span>
    <span class="used"></span>
    <span class="clay">
      <i class="wet"></i>
    </span>
    <span class="spray" style="--d:-.14s"></span>
    <span class="spray" style="--d:-.62s"></span>
    <span class="spray" style="--d:-.33s"></span>
    <span class="spray" style="--d:-.81s"></span>
  </div>
  <p class="sr" role="status">Torno de alfarero: la pieza de barro sube una pasada en cada vuelta, el brillo húmedo barre la pared y el agua sale despedida del borde en parábolas.</p>
</main>
</body>
</html>
