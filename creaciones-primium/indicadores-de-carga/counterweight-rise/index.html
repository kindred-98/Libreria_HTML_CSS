<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counterweight Rise</title>
<meta name="description" content="A space elevator tether carries a climber car up one strand and a counterweight down the other, both cables sagging in a slow travelling wave until the drive engages and the two of them snap dead straight at the same instant.">
<meta name="description-es" content="Un ascensor espacial lleva un coche ascendente por una hebra y un contrapeso bajando por la otra, con los dos cables cediendo en una lenta onda viajera hasta que el motor arranca y ambos se tensan rectos en el mismo instante.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="sky" aria-busy="true">
  <div class="sky__bg" aria-hidden="true"></div>
  <div class="sky__stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="sky__glow" aria-hidden="true"></div>

  <div class="tether" aria-hidden="true">
    <span class="strand strand--l"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i><i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i><i style="--i:15"></i><i style="--i:16"></i><i style="--i:17"></i><i style="--i:18"></i><i style="--i:19"></i></span>
    <span class="strand strand--r"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i><i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i><i style="--i:15"></i><i style="--i:16"></i><i style="--i:17"></i><i style="--i:18"></i><i style="--i:19"></i></span>
    <span class="snap snap--l"></span>
    <span class="snap snap--r"></span>
  </div>

  <div class="station" aria-hidden="true">
    <span class="station__deck"></span>
    <span class="station__arm"></span>
    <span class="station__mast"></span>
  </div>

  <div class="car" aria-hidden="true">
    <div class="car__box">
      <span class="car__hull"></span>
      <span class="car__band"></span>
      <span class="car__grip"></span>
      <span class="car__lamp"></span>
    </div>
  </div>

  <div class="weight" aria-hidden="true">
    <div class="weight__box">
      <span class="weight__body"></span>
      <span class="weight__rib"></span>
      <span class="weight__ring"></span>
    </div>
  </div>

  <div class="anchor" aria-hidden="true">
    <span class="anchor__block"></span>
    <span class="anchor__taper"></span>
  </div>

  <p class="read" aria-hidden="true">Tension<span class="read__v" id="tn">0 kN</span></p>

  <p class="sr" role="status">Space elevator running: the climber car rises on one strand while the counterweight descends on the other, the two cables sagging in a travelling wave until the drive engages and both snap taut together.</p>
</main>
</body>
</html>
