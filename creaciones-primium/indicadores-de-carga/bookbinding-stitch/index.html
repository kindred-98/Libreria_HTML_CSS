<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookbinding Stitch</title>
<meta name="description" content="A bookbinder sews the spine of a book on a sewing frame: the needle pierces the folded signatures one at a time, the waxed linen thread follows in a French link chain that pulls the sections tight against each other, the knot is worked at the head band, and the whole spine squares up under an even pull.">
<meta name="description-es" content="Un encuadernador cose el lomo de un libro en un bastidor de costura: la aguja atraviesa los pliegos uno a uno, el hilo de lino encerado los sigue en una cadena de eslabones que los aprieta contra sí, el nudo se trabaja en la cabecera superior y todo el lomo se cuadra bajo un tirón parejo.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="frame" aria-hidden="true">
    <span class="bar top"></span>
    <span class="bar bot"></span>
    <div class="sections">
      <i style="--i:0"></i>
      <i style="--i:1"></i>
      <i style="--i:2"></i>
      <i style="--i:3"></i>
      <i style="--i:4"></i>
    </div>
    <div class="links">
      <i style="--i:0"></i>
      <i style="--i:1"></i>
      <i style="--i:2"></i>
      <i style="--i:3"></i>
      <i style="--i:4"></i>
    </div>
    <span class="thread"></span>
    <span class="needle"></span>
    <span class="knot"></span>
  </div>
  <p class="sr" role="status">Encuadernando: la aguja atraviesa los pliegos del lomo uno a uno y el hilo de lino forma la cadena que los aprieta, hasta cerrar el nudo en la cabecera.</p>
</main>
</body>
</html>
