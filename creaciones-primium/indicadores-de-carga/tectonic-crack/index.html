<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tectonic Crack</title>
<meta name="description" content="Two basalt plates drift apart and a fissure of magma opens between them: the torn edges move away carrying a thin rim of light, the molten seam brightens and flows upward, hairline fractures race into the rock and embers lift off the crack.">
<meta name="description-es" content="Dos placas de basalto se separan y entre ellas se abre una fisura de magma: los bordes rotos se alejan llevando un filo de luz, la costura fundida se enciende y sube, unas grietas finas corren por la roca y brasas se desprenden de la fractura.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="scene" aria-busy="true">
  <div class="ground" aria-hidden="true"></div>
  <div class="obj" aria-hidden="true">
    <div class="rift" aria-hidden="true">
      <span class="fissure"></span>
      <span class="heat"></span>
      <span class="seam"></span>
    </div>
    <div class="slab west" aria-hidden="true">
      <span class="face"></span>
      <span class="edge"></span>
      <span class="hair h1"></span>
      <span class="hair h2"></span>
      <span class="hair h3"></span>
      <span class="hair h4"></span>
    </div>
    <div class="slab east" aria-hidden="true">
      <span class="face"></span>
      <span class="edge"></span>
      <span class="hair j1"></span>
      <span class="hair j2"></span>
      <span class="hair j3"></span>
      <span class="hair j4"></span>
    </div>
    <div class="embers" aria-hidden="true">
      <i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i><i style="--k:3"></i>
      <i style="--k:4"></i><i style="--k:5"></i><i style="--k:6"></i><i style="--k:7"></i>
    </div>
  </div>
  <p class="sr" role="status">Two basalt plates pull apart: a glowing magma fissure widens between them, the torn edges carry a thin rim of light, fractures spread through the rock and embers rise out of the crack.</p>
</main>
</body>
</html>
