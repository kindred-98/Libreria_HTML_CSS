<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anvil Strike</title>
<meta name="description" content="A smith raises a white-hot bar over a steel anvil and brings it down: the bar flattens where it lands, the horn rings, a shock runs along the face and a spray of sparks leaves the contact point on real parabolic arcs before fading against the dark shop.">
<meta name="description-es" content="Un herrero levanta una barra al rojo vivo sobre un yunque de acero y la deja caer: la barra se aplana en el punto de impacto, el cuerno de la pieza suena, una vibración recorre la cara y una lluvia de chispas sale del contacto en arcos parabólicos reales antes de apagarse en el taller a oscuras.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="forge" aria-hidden="true">
    <span class="stump"></span>
    <div class="anvil">
      <span class="face"></span>
      <span class="step"></span>
      <span class="horn"></span>
      <span class="waist"></span>
      <span class="base"></span>
    </div>
    <div class="bar" data-stage="0"></div>
    <div class="bar" data-stage="1"></div>
    <div class="bar" data-stage="2"></div>
    <span class="flash"></span>
    <div class="sparks">
      <i style="--a:-1.9;--r:60"></i>
      <i style="--a:-1.3;--r:44"></i>
      <i style="--a:-0.7;--r:70"></i>
      <i style="--a:-0.2;--r:38"></i>
      <i style="--a:0.4;--r:66"></i>
      <i style="--a:1;--r:50"></i>
      <i style="--a:1.6;--r:74"></i>
      <i style="--a:2.2;--r:42"></i>
      <i style="--a:-2.6;--r:36"></i>
      <i style="--a:2.8;--r:58"></i>
      <i style="--a:-0.5;--r:30"></i>
      <i style="--a:1.3;--r:34"></i>
    </div>
    <span class="heat"></span>
  </div>
  <p class="sr" role="status">Yunque en martilleo: la barra al rojo cae sobre la cara de acero, se aplasta en el punto de impacto y salta una lluvia de chispas que salen despedidas en arcos.</p>
</main>
</body>
</html>
