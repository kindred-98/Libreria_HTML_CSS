<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Probe Deploy</title>
<meta name="description" content="A gold-foiled deep space probe unfolds its two three-segment solar wings, each hinge overshooting and settling with a damped bounce before the blue cells take the light and the array reaches full power.">
<meta name="description-es" content="Una sonda del espacio profundo con lámina de oro despliega sus dos alas solares de tres segmentos, con cada bisagra sobrepasando y asentándose con un rebote amortiguado antes de que las celdas azules reciban la luz y el conjunto alcance su potencia máxima.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="deep" aria-busy="true">
  <div class="deep__bg" aria-hidden="true"></div>
  <div class="deep__stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <div class="probe" aria-hidden="true">
    <div class="mast">
      <span class="dish"></span>
      <span class="feed"></span>
    </div>

    <div class="wing wing--l">
      <span class="seg seg--1"><span class="cell"><i class="glaze"></i></span></span>
      <span class="seg seg--2"><span class="cell"><i class="glaze"></i></span></span>
      <span class="seg seg--3"><span class="cell"><i class="glaze"></i></span></span>
    </div>
    <div class="wing wing--r">
      <span class="seg seg--1"><span class="cell"><i class="glaze"></i></span></span>
      <span class="seg seg--2"><span class="cell"><i class="glaze"></i></span></span>
      <span class="seg seg--3"><span class="cell"><i class="glaze"></i></span></span>
    </div>

    <div class="bus">
      <span class="mli"></span>
      <span class="band band--a"></span>
      <span class="band band--b"></span>
      <span class="slot"></span>
    </div>

    <div class="down">
      <span class="down__mast"></span>
      <span class="down__head"></span>
    </div>
    <span class="nozzle"></span>
  </div>

  <p class="read" aria-hidden="true">Array<span class="read__v" id="arr">0.0 kW</span></p>

  <p class="sr" role="status">Solar array deploying: the probe unfolds both three-segment wings, each hinge overshoots and settles with a damped bounce, the blue cells catch the light and the array output climbs to full power.</p>
</main>
</body>
</html>
