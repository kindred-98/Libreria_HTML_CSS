<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nest Weaving</title>
<meta name="description" content="A nest is woven strand by strand: the stakes are pushed into the ground, then each ring of straw is laid around them passing over one stake and under the next, and a last twig is tucked in.">
<meta name="description-es" content="Un nido se trenza rama a rama: se clavan los montantes, después cada vuelta de paja los rodea pasando por encima de uno y por debajo del siguiente, y al final se encaja una ramita.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="nest" aria-hidden="true">
    <div class="cup"><span class="lining"></span></div>
    <div class="wall">
      <span class="stake s0"></span>
      <span class="stake s1"></span>
      <span class="stake s2"></span>
      <span class="stake s3"></span>
      <span class="stake s4"></span>
      <span class="stake s5"></span>
      <span class="stake s6"></span>
      <span class="row r1"></span>
      <span class="row r2"></span>
      <span class="row r3"></span>
      <span class="row r4"></span>
      <span class="row r5"></span>
      <span class="over o0"></span>
      <span class="over o1"></span>
      <span class="over o2"></span>
      <span class="over o3"></span>
      <span class="over o4"></span>
      <span class="over o5"></span>
      <span class="over o6"></span>
      <span class="rim"></span>
    </div>
    <span class="twig"></span>
    <span class="dust"></span>
  </div>
  <p class="sr" role="status">Trenzando el nido: los montantes se clavan y cada vuelta de paja se pasa por encima y por debajo.</p>
</main>
</body>
</html>
