<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dust Devil</title>
<meta name="description" content="A dust devil spins up over a pale desert floor: the whole column leans and breathes, sand grains corkscrew upward around the core in a tightening spiral, the cone at the foot punches the ground and the column thins out as it climbs.">
<meta name="description-es" content="Un diablo de polvo gira sobre un suelo desértico pálido: toda la columna se inclina y respira, los granos de arena suben en espiral alrededor del núcleo, el cono de la base golpea el suelo y la columna se afina al subir.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="scene" aria-busy="true">
  <div class="sky" aria-hidden="true"></div>
  <div class="ground" aria-hidden="true"></div>
  <div class="horizon" aria-hidden="true"></div>
  <div class="obj" aria-hidden="true">
    <div class="column">
      <div class="vortex">
        <span class="core"></span>
        <span class="spin"></span>
        <span class="whirl2"></span>
        <div class="grains">
          <i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i><i style="--k:3"></i>
          <i style="--k:4"></i><i style="--k:5"></i><i style="--k:6"></i><i style="--k:7"></i>
          <i style="--k:8"></i><i style="--k:9"></i><i style="--k:10"></i><i style="--k:11"></i>
        </div>
      </div>
    </div>
    <div class="foot">
      <span class="ring"></span>
      <span class="ring r2"></span>
    </div>
  </div>
  <p class="sr" role="status">A dust devil spins: sand grains corkscrew upward in a twisted column, the foot of the vortex scours the ground and the whole column leans and breathes.</p>
</main>
</body>
</html>
