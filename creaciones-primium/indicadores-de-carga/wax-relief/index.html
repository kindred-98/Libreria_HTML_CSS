<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wax Relief</title>
<meta name="description" content="A wax relief cools on its mould: the disc loses volume while a bead gathers at the lower edge, stretches on a thread that narrows under surface tension, lets go and falls, and the wax slowly draws itself back together for the next pour.">
<meta name="description-es" content="Un relieve de cera se enfría sobre su molde: el disco pierde volumen mientras una gota se acumula en el borde inferior, se estira sobre un hilo que se afina por tensión superficial, se desprende y cae, y la cera se vuelve a juntar despacio para el próximo vertido.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Wax relief cooling, a drip forming and falling from the lower edge</p>
  <div class="obj" aria-hidden="true">
    <i class="mould"></i>
    <i class="recess"></i>
    <div class="wax">
      <i class="disc"></i>
      <i class="boss"></i>
      <i class="ridge"></i>
      <i class="sheen"></i>
      <div class="drip">
        <i class="thread"></i>
        <i class="bead"></i>
      </div>
      <i class="drop"></i>
    </div>
    <i class="shadow"></i>
  </div>
  <p class="phase" aria-hidden="true"><span class="t1">set</span><span class="t2">bead</span><span class="t3">let go</span><span class="t4">close</span></p>
</main>
</body>
</html>
