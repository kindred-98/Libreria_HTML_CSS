<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breathing Grid</title>
<meta name="description" content="An eight by eight grid of charcoal cells breathes in and out, and a cold light band travels row by row across it, lighting one whole row at a time so the grid reads as a single surface being scanned.">
<meta name="description-es" content="Una retícula de ocho por ocho celdas de carbón respira dentro y fuera, y una banda de luz fría viaja hilera a hilera por encima, iluminando una fila entera cada vez, de modo que la retícula se lee como una superficie que se escanea.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <p class="sr" role="status">A grid is breathing while a cold light band travels row by row, lighting one whole row at a time.</p>

</html>
