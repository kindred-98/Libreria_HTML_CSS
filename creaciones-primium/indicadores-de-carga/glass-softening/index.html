<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass Softening</title>
<meta name="description" content="A glass rod is held over a torch and its thickness keeps deforming: the even column necks down, swells into a gather and stretches thinner as the weight of the hot glass pulls it out of shape, then stiffens and straightens again as it cools.">
<meta name="description-es" content="Una varilla de vidrio se sostiene sobre el soplete y su grosor no deja de deformarse: la columna uniforme se estrangula, engorda en una gather y se estira mientras el peso del vidrio caliente la saca de forma, hasta que se enfría, se endurece y vuelve a la recta.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Glass rod softening over the torch, sagging under its own weight</p>
  <div class="obj" aria-hidden="true">
    <i class="bench"></i>
    <div class="rod">
      <i class="punty"></i>
      <i class="glass"></i>
      <i class="heat"></i>
      <i class="shine"></i>
      <i class="gather"></i>
    </div>
    <div class="torch">
      <i class="pencil"></i>
      <i class="nozzle"></i>
      <i class="flame f2"></i>
      <i class="flame f1"></i>
      <i class="core"></i>
    </div>
    <i class="bounce"></i>
  </div>
  <p class="phase" aria-hidden="true"><span class="t1">heat</span><span class="t2">yield</span><span class="t3">gather</span><span class="t4">stiffen</span></p>
</main>
</body>
</html>
