<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tessellation Drift</title>
<meta name="description" content="A square tessellation slides across a second copy of itself: the two layers drift in opposite diagonals while every tile breathes in a travelling wave, so the ochre joints between them open and close as bands of waves.">
<meta name="description-es" content="Un teselado cuadrado se desliza sobre una copia de sí mismo: las dos capas derivan en diagonales opuestas mientras cada baldosa respira en una ola que viaja, de modo que las juntas ocre se abren y se cierran en bandas de ondas.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="fig" aria-hidden="true">
    <div class="shade"></div>
    <div class="layer layer--under" aria-hidden="true">
        <i style="left:0%;top:0%;animation-delay:0s"></i><i style="left:20%;top:0%;animation-delay:-0.16s"></i><i style="left:40%;top:0%;animation-delay:-0.32s"></i><i style="left:60%;top:0%;animation-delay:-0.48s"></i><i style="left:80%;top:0%;animation-delay:-0.64s"></i>
        <i style="left:10%;top:20%;animation-delay:-0.32s"></i><i style="left:30%;top:20%;animation-delay:-0.48s"></i><i style="left:50%;top:20%;animation-delay:-0.64s"></i><i style="left:70%;top:20%;animation-delay:-0.8s"></i>
        <i style="left:0%;top:40%;animation-delay:-0.64s"></i><i style="left:20%;top:40%;animation-delay:-0.8s"></i><i style="left:40%;top:40%;animation-delay:-0.96s"></i><i style="left:60%;top:40%;animation-delay:-1.12s"></i><i style="left:80%;top:40%;animation-delay:-1.28s"></i>
        <i style="left:10%;top:60%;animation-delay:-0.96s"></i><i style="left:30%;top:60%;animation-delay:-1.12s"></i><i style="left:50%;top:60%;animation-delay:-1.28s"></i><i style="left:70%;top:60%;animation-delay:-1.44s"></i>
        <i style="left:0%;top:80%;animation-delay:-1.28s"></i><i style="left:20%;top:80%;animation-delay:-1.44s"></i><i style="left:40%;top:80%;animation-delay:-1.6s"></i><i style="left:60%;top:80%;animation-delay:-1.76s"></i><i style="left:80%;top:80%;animation-delay:-1.92s"></i>
    </div>
    <div class="layer layer--over" aria-hidden="true">
        <i style="left:0%;top:0%;animation-delay:-2s"></i><i style="left:20%;top:0%;animation-delay:-2.16s"></i><i style="left:40%;top:0%;animation-delay:-2.32s"></i><i style="left:60%;top:0%;animation-delay:-2.48s"></i><i style="left:80%;top:0%;animation-delay:-2.64s"></i>
        <i style="left:10%;top:20%;animation-delay:-2.32s"></i><i style="left:30%;top:20%;animation-delay:-2.48s"></i><i style="left:50%;top:20%;animation-delay:-2.64s"></i><i style="left:70%;top:20%;animation-delay:-2.8s"></i>
        <i style="left:0%;top:40%;animation-delay:-2.64s"></i><i style="left:20%;top:40%;animation-delay:-2.8s"></i><i style="left:40%;top:40%;animation-delay:-2.96s"></i><i style="left:60%;top:40%;animation-delay:-3.12s"></i><i style="left:80%;top:40%;animation-delay:-3.28s"></i>
        <i style="left:10%;top:60%;animation-delay:-2.96s"></i><i style="left:30%;top:60%;animation-delay:-3.12s"></i><i style="left:50%;top:60%;animation-delay:-3.28s"></i><i style="left:70%;top:60%;animation-delay:-3.44s"></i>
        <i style="left:0%;top:80%;animation-delay:-3.28s"></i><i style="left:20%;top:80%;animation-delay:-3.44s"></i><i style="left:40%;top:80%;animation-delay:-3.6s"></i><i style="left:60%;top:80%;animation-delay:-3.76s"></i><i style="left:80%;top:80%;animation-delay:-3.92s"></i>
    </div>
    <div class="glaze"></div>
  </div>
  <p class="sr" role="status">A tessellation is drifting over a copy of itself: the two layers slide apart and the joints between the tiles open and close as travelling waves.</p>
</main>
</body>
</html>
