<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiln Firing</title>
<meta name="description" content="A clay vessel sits inside a kiln and the glaze climbs as it fires: the body heats from dull terracotta to a deep red, light bleeds out through the throwing rings and the mouth, smoke threads up past the lid and the piece cools back to raw clay for the next firing.">
<meta name="description-es" content="Un recipiente de barro se cuece dentro de un horno y el esmalte sube de tono al cocerse: el cuerpo pasa del terracota mate a un rojo profundo, la luz sangra por los estrías del torno y por la boca, sale humo por la tapa y la pieza se enfría de nuevo para la siguiente cocción.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Clay piece firing in the kiln, glaze deepening as the heat climbs</p>
  <div class="obj" aria-hidden="true">
    <i class="kiln"></i>
    <i class="brick"></i>
    <div class="pot">
      <i class="body"></i>
      <i class="ring r1"></i>
      <i class="ring r2"></i>
      <i class="ring r3"></i>
      <i class="rim"></i>
      <i class="mouth"></i>
      <i class="glow"></i>
    </div>
    <i class="shade"></i>
    <i class="smoke s1"></i>
    <i class="smoke s2"></i>
  </div>
  <p class="phase" aria-hidden="true"><span class="t1">bisque</span><span class="t2">climb</span><span class="t3">soak</span><span class="t4">cool</span></p>
</main>
</body>
</html>
