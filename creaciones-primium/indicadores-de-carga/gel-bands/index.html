<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gel Bands</title>
<meta name="description" content="Fragments migrate down a polyacrylamide gel toward the electrode: the small ones run furthest, every band glowing a sharp turquoise line across the dark blue matrix while the reference ladder on the side stays put.">
<meta name="description-es" content="Los fragmentos migran por un gel de poliacrilamida hacia el electrodo: los pequeños llegan más lejos, cada banda brillando como una línea turquesa nítida sobre la matriz azul oscura mientras la escalera de referencia del lateral no se mueve.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Electrophoresis running, DNA bands migrating through the gel</p>
  <div class="obj" aria-hidden="true">
    <div class="slab">
      <i class="buffer"></i>
      <i class="wellbar"></i>
      <i class="wells">
        <b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b>
      </i>
      <div class="runs">
        <i class="run a"><b></b></i>
        <i class="run b"><b></b></i>
        <i class="run c"><b></b></i>
        <i class="run d"><b></b></i>
        <i class="run e"><b></b></i>
        <i class="run f"><b></b></i>
        <i class="run g"><b></b></i>
        <i class="run h"><b></b></i>
      </div>
      <div class="ladder">
        <i class="rung r1"></i>
        <i class="rung r2"></i>
        <i class="rung r3"></i>
        <i class="rung r4"></i>
        <p class="bp b1">5.0 kb</p>
        <p class="bp b2">2.5 kb</p>
        <p class="bp b3">1.0 kb</p>
        <p class="bp b4">0.25 kb</p>
      </div>
      <i class="charge"></i>
      <i class="edge"></i>
      <i class="sheen"></i>
    </div>
  </div>
</main>
</body>
</html>
