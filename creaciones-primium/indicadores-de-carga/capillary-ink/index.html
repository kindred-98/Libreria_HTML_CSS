<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capillary Ink</title>
<meta name="description" content="Ink climbs a paper strip by capillary action: fine threads wick ahead of the front, the advance keeps a glossy wet edge that darkens the paper, and once the sheet is soaked the ink runs back down the fibres and the strip is ready again.">
<meta name="description-es" content="La tinta sube por una tira de papel por acción capilar: hilos finos se adelantan al frente, el avance deja un borde húmedo y brillante que oscurece el papel y, ya empapada la hoja, la tinta baja de nuevo por las fibras dejando el papel listo otra vez.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Ink climbing the paper fibres, front rising with a wet edge</p>
  <div class="obj" aria-hidden="true">
    <i class="sheet"></i>
    <i class="fibre"></i>
    <i class="fleck f1"></i>
    <i class="fleck f2"></i>
    <i class="fleck f3"></i>
    <div class="threads">
      <i class="th" style="--x:9%;--h:9%;--d:-.02s"></i>
      <i class="th" style="--x:18%;--h:13%;--d:-.14s"></i>
      <i class="th" style="--x:27%;--h:8%;--d:-.26s"></i>
      <i class="th" style="--x:36%;--h:15%;--d:-.38s"></i>
      <i class="th" style="--x:45%;--h:10%;--d:-.5s"></i>
      <i class="th" style="--x:54%;--h:14%;--d:-.62s"></i>
      <i class="th" style="--x:63%;--h:9%;--d:-.74s"></i>
      <i class="th" style="--x:72%;--h:12%;--d:-.86s"></i>
      <i class="th" style="--x:81%;--h:8%;--d:-.98s"></i>
      <i class="th" style="--x:90%;--h:11%;--d:-1.1s"></i>
    </div>
    <i class="sat"></i>
    <i class="edge"></i>
    <i class="lip"></i>
  </div>
  <p class="phase" aria-hidden="true"><span class="t1">wick</span><span class="t2">creep</span><span class="t3">front</span><span class="t4">drain</span></p>
</main>
</body>
</html>
