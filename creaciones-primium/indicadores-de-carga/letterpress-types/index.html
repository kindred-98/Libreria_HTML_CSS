<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Letterpress Types</title>
<meta name="description" content="A composing stick fills with lead type and a platen press drives the forme onto the paper: each sort slides down the channel and locks shoulder to shoulder, the chase closes with a screw, the platen descends and pulls one crisp bite of ink out of the type before the sheet lifts away clean.">
<meta name="description-es" content="Una composing stick se llena de tipos de plomo y un Prensa de platina lleva la forma al papel: cada tipo baja por el canal y se encaja hombro con hombro, la forma se cierra con el tornillo, la platina baja y arranca un mordisco nítido de tinta a los tipos antes de que la hoja salga limpia.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="press" aria-hidden="true">
    <span class="frame top"></span>
    <span class="frame bot"></span>
    <span class="screw"></span>
    <div class="platen"></div>
    <div class="forme">
      <div class="sorts">
        <i style="--i:0"></i>
        <i style="--i:1"></i>
        <i style="--i:2"></i>
        <i style="--i:3"></i>
        <i style="--i:4"></i>
        <i style="--i:5"></i>
        <i style="--i:6"></i>
        <i style="--i:7"></i>
        <i style="--i:8"></i>
      </div>
      <span class="lock"></span>
    </div>
    <div class="inked">
      <i style="--i:0"></i>
      <i style="--i:1"></i>
      <i style="--i:2"></i>
      <i style="--i:3"></i>
      <i style="--i:4"></i>
      <i style="--i:5"></i>
      <i style="--i:6"></i>
      <i style="--i:7"></i>
      <i style="--i:8"></i>
    </div>
    <div class="sheet">
      <span class="bite"></span>
    </div>
    <span class="gloss"></span>
  </div>
  <p class="sr" role="status">Prensa de tipos móviles: los tipos bajan por el canal y se encajan, la platina desciende y la tinta se transfiere al papel con un mordisco nítido.</p>
</main>
</body>
</html>
