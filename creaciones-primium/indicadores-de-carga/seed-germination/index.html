<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seed Germination</title>
<meta name="description" content="A single ocre seed swells, splits its coat and drives a wet radicle down into the dark soil while a thread of light runs along the root as it drinks.">
<meta name="description-es" content="Una semilla ocre se hincha, abre la cubierta y empuja una radícula húmeda hacia la tierra oscura mientras un reguero de luz baja por la raíz al absorber.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="seed" aria-hidden="true">
    <div class="root">
      <div class="wet"></div>
      <div class="curl"></div>
    </div>
    <div class="fibers">
      <i></i><i></i><i></i>
      <span class="bead"></span>
    </div>
    <div class="pod">
      <div class="half half--l"></div>
      <div class="half half--r"></div>
      <div class="kernel"><i></i><i></i></div>
      <div class="shoot"></div>
    </div>
  </div>
  <p class="sr" role="status">Germinando: la semilla se hincha, abre la cubierta y su radícula desciende por el suelo.</p>
</main>
</body>
</html>
