<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ember Charge</title>
<meta name="description" content="A single coal breathes in the dark: it swells, throws a spark on the intake, burns at its hottest, then as the heat falls the glow drops and a drift of ash breaks loose and tumbles down past the hearth.">
<meta name="description-es" content="Un único carbón respira en la oscuridad: se hincha, lanza una chispa al tomar aire, arde en su punto más alto y, cuando el calor cae, la luz baja y una lluvia de ceniza se desprende y cae rodando junto al hogar.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Ember breathing, throwing a spark and shedding ash as it cools</p>
  <div class="obj" aria-hidden="true">
    <i class="bed"></i>
    <div class="coal">
      <i class="mass"></i>
      <i class="crack c1"></i>
      <i class="crack c2"></i>
      <i class="crack c3"></i>
      <i class="crack c4"></i>
      <i class="core"></i>
      <i class="halo"></i>
    </div>
    <i class="spark"></i>
    <i class="ash a1"></i>
    <i class="ash a2"></i>
    <i class="ash a3"></i>
    <i class="ash a4"></i>
    <i class="ash a5"></i>
    <i class="ash a6"></i>
    <i class="floor"></i>
  </div>
  <p class="phase" aria-hidden="true"><span class="t1">ember</span><span class="t2">swell</span><span class="t3">burn</span><span class="t4">ash</span></p>
</main>
</body>
</html>
