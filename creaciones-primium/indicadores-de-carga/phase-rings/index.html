<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase Rings</title>
<meta name="description" content="Three rings of different size and offset centre turn at three different rates, so their bright beads fall out of step; at the four places where the rings cross you can see the lag, and a small lens flares once per bead that passes.">
<meta name="description-es" content="Tres anillos de distinto tamaño y centro desplazado giran a tres velocidades distintas, así que sus cuentas brillantes se desfasan; en los cuatro puntos donde los anillos se cruzan se ve el retraso, y una pequeña lente destella una vez por cada cuenta que pasa.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="fig" aria-hidden="true">
    <div class="glow"></div>
    <div class="rings">
    <div class="ring ring--a" style="--r:45%;left:48%;top:48%;--dash:40px;animation-duration:4s">
      <div class="ring__rim"></div>
      <div class="ring__spin">
        <i style="--a:0deg"></i><i style="--a:30deg"></i><i style="--a:60deg"></i><i style="--a:90deg"></i><i style="--a:120deg"></i><i style="--a:150deg"></i><i style="--a:180deg"></i><i style="--a:210deg"></i><i style="--a:240deg"></i><i style="--a:270deg"></i><i style="--a:300deg"></i><i style="--a:330deg"></i>
      </div>
    </div>
    <div class="ring ring--b" style="--r:36%;left:60%;top:58%;--dash:24px;animation-duration:2s">
      <div class="ring__rim"></div>
      <div class="ring__spin">
        <i style="--a:0deg"></i><i style="--a:22.5deg"></i><i style="--a:45deg"></i><i style="--a:67.5deg"></i><i style="--a:90deg"></i><i style="--a:112.5deg"></i><i style="--a:135deg"></i><i style="--a:157.5deg"></i><i style="--a:180deg"></i><i style="--a:202.5deg"></i><i style="--a:225deg"></i><i style="--a:247.5deg"></i><i style="--a:270deg"></i><i style="--a:292.5deg"></i><i style="--a:315deg"></i><i style="--a:337.5deg"></i>
      </div>
    </div>
    <div class="ring ring--c" style="--r:27%;left:38%;top:66%;--dash:15px;animation-duration:4s">
      <div class="ring__rim"></div>
      <div class="ring__spin">
        <i style="--a:0deg"></i><i style="--a:18deg"></i><i style="--a:36deg"></i><i style="--a:54deg"></i><i style="--a:72deg"></i><i style="--a:90deg"></i><i style="--a:108deg"></i><i style="--a:126deg"></i><i style="--a:144deg"></i><i style="--a:162deg"></i><i style="--a:180deg"></i><i style="--a:198deg"></i><i style="--a:216deg"></i><i style="--a:234deg"></i><i style="--a:252deg"></i><i style="--a:270deg"></i><i style="--a:288deg"></i><i style="--a:306deg"></i><i style="--a:324deg"></i><i style="--a:342deg"></i>
      </div>
    </div>
    </div>
    <div class="lenses">
      <b class="lens" style="left:92.72%;top:42.986%;animation-delay:0s"></b>
      <b class="lens" style="left:51.133%;top:92.891%;animation-delay:-1s"></b>
      <b class="lens" style="left:46.845%;top:91.51%;animation-delay:-2s"></b>
      <b class="lens" style="left:28.393%;top:40.767%;animation-delay:-3s"></b>
    </div>
    <div class="seat"></div>
  </div>
  <p class="sr" role="status">Three rings are turning out of phase with each other; at their crossings the lag between the beads is visible.</p>
</main>
</body>
</html>
