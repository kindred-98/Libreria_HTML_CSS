<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reentry Plasma</title>
<meta name="description" content="A blunt reentry capsule ploughs through the upper atmosphere, its shock layer breathing orange and white while a bright shock band slides across the incandescent heat shield and a wake of sparks streams away behind it.">
<meta name="description-es" content="Una cápsula de reentrada de cara plana atraviesa la alta atmósfera, con su capa de choque respirando en naranja y blanco mientras una brillante franja de choque se desliza por el escudo térmico incandescente y una estela de chispas sale despedida por detrás.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="entry" aria-busy="true">
  <div class="entry__bg" aria-hidden="true"></div>
  <div class="entry__stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="entry__limb" aria-hidden="true"></div>

  <div class="field" aria-hidden="true">
    <span class="halo"></span>
    <span class="wake"><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <span class="sheath"></span>
    <span class="sheath2"></span>
    <span class="band"></span>
    <span class="band2"></span>

    <div class="capsule">
      <span class="cap__ring"></span>
      <span class="cap__cone"></span>
      <span class="cap__body"></span>
      <span class="cap__seam"></span>
      <span class="cap__window"></span>
      <span class="cap__guard"></span>
      <span class="cap__heat"></span>
      <span class="cap__shield"></span>
    </div>
  </div>

  <p class="peak" aria-hidden="true">Heat flux<span class="peak__v" id="hq">0 kW/m2</span></p>

  <p class="sr" role="status">Reentry in progress: the blunt capsule rides a breathing plasma sheath, a bright shock band slides across the incandescent heat shield as the angle of attack changes, and a wake of sparks streams away behind.</p>
</main>
</body>
</html>
