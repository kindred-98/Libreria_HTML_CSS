<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lightning Branch</title>
<meta name="description" content="A bolt of lightning branches across a storm: the charge gathers as a violet point in the cloud, the main channel is drawn downward, forks split off and grow outward, the whole sky flashes white and then the branches go out one after another until only the storm is left.">
<meta name="description-es" content="Un rayo se ramifica sobre una tormenta: la carga se reúne como un punto violeta en la nube, el canal principal se dibuja hacia abajo, salen bultos que crecen hacia fuera, todo el cielo se enciende en blanco y luego los ramales se apagan uno tras otro hasta dejar solo la tormenta.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="scene" aria-busy="true">
  <div class="storm" aria-hidden="true"></div>
  <div class="obj" aria-hidden="true">
    <div class="cloud">
      <span class="bulge b1"></span>
      <span class="bulge b2"></span>
      <span class="bulge b3"></span>
      <span class="seed"></span>
    </div>
    <div class="channel">
      <span class="halo"></span>
      <span class="line"></span>
    </div>
    <div class="forks">
      <span class="fork f1"><i></i></span>
      <span class="fork f2"><i></i></span>
      <span class="fork f3"><i></i></span>
      <span class="fork f4"><i></i></span>
      <span class="fork f5"><i></i></span>
    </div>
    <div class="ground">
      <span class="flash"></span>
    </div>
  </div>
  <p class="sr" role="status">Lightning branches across a storm: the main channel is drawn downward, forks split off and grow outward, the sky flashes and the branches go out one after another.</p>
</main>
</body>
</html>
