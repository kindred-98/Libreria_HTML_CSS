<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spectrometer Sweep</title>
<meta name="description" content="A grating spectrometer sweeps its source across the visible band: a phosphor trace climbs the absorption peaks one wavelength at a time, each one leaving a faint decaying trail behind the moving scan bar.">
<meta name="description-es" content="Un espectrómetro de rejilla barre su fuente sobre la banda visible: una traza fosforescente sube las absorciones paso a paso, dejando a su paso una estela tenue que se apaga detrás de la barra de barrido.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Spectrum sweep running, the trace crossing each absorption band</p>
  <div class="obj" aria-hidden="true">
    <div class="body">
      <div class="optics">
        <i class="lamp"></i>
        <i class="slit"></i>
        <i class="ray"></i>
        <i class="grating"></i>
        <i class="spread"></i>
      </div>
      <div class="disp">
        <i class="grid"></i>
        <i class="rainbow"></i>
        <div class="trace"><i class="curve"></i></div>
        <i class="sweep"><i class="bar"></i><i class="trail"></i></i>
        <i class="scale"></i>
        <p class="read"><span><b>400</b><b>500</b><b>600</b><b>700</b></span><em>nm</em></p>
      </div>
      <i class="base"></i>
    </div>
  </div>
</main>
</body>
</html>
