<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marching Dune</title>
<meta name="description" content="A file of wind blown dunes walks across the desert without end: ripple trains climb the windward face, the crest leans into the gale and a plume of sand hangs in suspension just behind the ridge before it settles.">
<meta name="description-es" content="Una fila de dunas movidas por el viento cruza el desierto sin fin: las ondas de arena suben por la cara de barlovento, la cresta se inclina contra el aire y una pluma de arena queda en suspensión detrás de la cresta antes de volver al suelo.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="scene" aria-busy="true">
  <div class="sky" aria-hidden="true">
    <span class="sun"></span>
    <span class="haze"></span>
  </div>
  <div class="floor" aria-hidden="true"></div>
  <div class="gust" aria-hidden="true">
    <i class="g1"></i><i class="g2"></i><i class="g3"></i><i class="g4"></i><i class="g5"></i>
  </div>
  <div class="obj" aria-hidden="true">
    <div class="field">
      <div class="ridge r1">
        <span class="body"></span>
        <span class="lee"></span>
        <span class="ripples"></span>
        <span class="crest"></span>
        <span class="slide"><i></i><i></i><i></i></span>
        <span class="plume">
          <i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i>
          <i style="--k:3"></i><i style="--k:4"></i>
        </span>
      </div>
      <div class="ridge r2">
        <span class="body"></span>
        <span class="lee"></span>
        <span class="ripples"></span>
        <span class="crest"></span>
        <span class="slide"><i></i><i></i><i></i></span>
        <span class="plume">
          <i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i>
          <i style="--k:3"></i><i style="--k:4"></i>
        </span>
      </div>
      <div class="ridge r3">
        <span class="body"></span>
        <span class="lee"></span>
        <span class="ripples"></span>
        <span class="crest"></span>
        <span class="slide"><i></i><i></i><i></i></span>
        <span class="plume">
          <i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i>
          <i style="--k:3"></i><i style="--k:4"></i>
        </span>
      </div>
    </div>
  </div>
  <p class="sr" role="status">A dune crest marches from left to right pushed by the wind, ripple lines climb the windward slope and loose sand lifts off the ridge and hangs in the air.</p>
</main>
</body>
</html>
