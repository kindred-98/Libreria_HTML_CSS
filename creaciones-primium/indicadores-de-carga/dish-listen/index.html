<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dish Listen</title>
<meta name="description" content="An aluminium radio dish sweeps across the night sky in azimuth and elevation, and the green gain meter climbs segment by segment as the beam settles on the source, peaking the instant the focus locks.">
<meta name="description-es" content="Una antena parabólica de aluminio barre el cielo nocturno en acimut y elevación, y el medidor de ganancia verde sube segmento a segmento según el haz se va-centrando sobre la fuente, con su máximo justo cuando el enfoque se bloquea.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="night" aria-busy="true">
  <div class="night__bg" aria-hidden="true"></div>
  <div class="night__stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <div class="lock" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <div class="scope" aria-hidden="true">
    <div class="rig">
      <div class="yoke">
        <span class="yoke__arm yoke__arm--l"></span>
        <span class="yoke__arm yoke__arm--r"></span>
        <span class="yoke__trunk"></span>
        <span class="yoke__base"></span>
        <span class="yoke__foot"></span>
      </div>
      <div class="dish">
        <span class="dish__back"></span>
        <span class="dish__bowl"></span>
        <span class="dish__ribs"></span>
        <span class="dish__rim"></span>
        <span class="dish__strut dish__strut--a"></span>
        <span class="dish__strut dish__strut--b"></span>
        <span class="dish__strut dish__strut--c"></span>
        <span class="dish__horn"></span>
        <span class="dish__lobe"></span>
      </div>
    </div>
  </div>

  <p class="gain" aria-hidden="true">Gain<span class="gain__v" id="gv">0.0 dB</span><span class="meter"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></span></p>

  <p class="sr" role="status">Radio dish scanning: the antenna sweeps in azimuth and elevation across the night sky and the green gain meter rises segment by segment until the beam locks on the source and reaches peak gain.</p>
</main>
</body>
</html>
