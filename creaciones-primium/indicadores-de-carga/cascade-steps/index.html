<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cascade Steps</title>
<meta name="description" content="A stepped stone cascade: three curtains of water fall from ledge to ledge, each one lands, bulges forward and jumps onto the next step before the foam settles and the next curtain drops.">
<meta name="description-es" content="Una cascada escalonada de piedra: tres cortinas de agua caen de repisa a repisa, cada una golpea, se hincha hacia delante y salta al siguiente escalón antes de que la espuma se asiente y caiga la siguiente cortina.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="fall" aria-busy="true">
  <div class="rig">
    <div class="wall">
      <span class="seam s1"></span>
      <span class="seam s2"></span>
      <span class="seam s3"></span>
    </div>
    <div class="ledge l1"><i class="run"></i></div>
    <div class="ledge l2"><i class="run"></i></div>
    <div class="ledge l3"><i class="run"></i></div>
    <div class="basin">
      <span class="pool">
        <i class="churn c1"></i><i class="churn c2"></i>
        <span class="foamline"></span>
      </span>
      <span class="stone-rim"></span>
    </div>
    <div class="source">
      <span class="feed"><i class="st"></i></span>
      <span class="land"><i class="sp"></i></span>
    </div>
    <div class="steps">
      <span class="sheet sh1">
        <i class="jump j1"></i>
        <i class="splash p1a"></i><i class="splash p1b"></i>
      </span>
      <span class="sheet sh2">
        <i class="jump j2"></i>
        <i class="splash p2a"></i><i class="splash p2b"></i>
      </span>
      <span class="sheet sh3">
        <i class="jump j3"></i>
        <i class="splash p3a"></i><i class="splash p3b"></i>
      </span>
    </div>
    <div class="lakes">
      <span class="sheet sh1"><i class="f1"></i></span>
      <span class="sheet sh2"><i class="f2"></i></span>
      <span class="sheet sh3"><i class="f3"></i></span>
    </div>
  </div>
  <p class="sr" role="status">Three curtains of water fall step by step and jump forward onto the stone</p>
</main>
</body>
</html>
