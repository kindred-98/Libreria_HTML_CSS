<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hoarfrost Bloom</title>
<meta name="description" content="Hoarfrost draws itself across a cold pane: six crystal arms reach out from a bright hub and each one fattens as it grows, throwing needles that get longer and thicker toward the tip before the whole bloom thins away and starts again.">
<meta name="description-es" content="La escarcha se dibuja sobre un cristal frío: seis brazos cristalinos salen de un núcleo brillante y cada uno engorda según crece, lanzando agujas más largas y gruesas hacia la punta antes de que todo el roseto adelgace y vuelva a empezar.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <p class="sr" role="status">Hoarfrost drawing itself across the cold pane</p>
  <div class="obj" aria-hidden="true">
    <i class="pane"></i>
    <i class="gleam g1"></i>
    <i class="gleam g2"></i>
    <div class="rosette">
      <i class="arm" style="--a:0deg;--d:0s"><i class="nd n1"></i><i class="nd n2"></i><i class="nd n3"></i><i class="nd n4"></i><i class="fk f1"></i><i class="fk f2"></i></i>
      <i class="arm" style="--a:60deg;--d:-.1s"><i class="nd n1"></i><i class="nd n2"></i><i class="nd n3"></i><i class="nd n4"></i><i class="fk f1"></i><i class="fk f2"></i></i>
      <i class="arm" style="--a:120deg;--d:-.2s"><i class="nd n1"></i><i class="nd n2"></i><i class="nd n3"></i><i class="nd n4"></i><i class="fk f1"></i><i class="fk f2"></i></i>
      <i class="arm" style="--a:180deg;--d:-.3s"><i class="nd n1"></i><i class="nd n2"></i><i class="nd n3"></i><i class="nd n4"></i><i class="fk f1"></i><i class="fk f2"></i></i>
      <i class="arm" style="--a:240deg;--d:-.4s"><i class="nd n1"></i><i class="nd n2"></i><i class="nd n3"></i><i class="nd n4"></i><i class="fk f1"></i><i class="fk f2"></i></i>
      <i class="arm" style="--a:300deg;--d:-.5s"><i class="nd n1"></i><i class="nd n2"></i><i class="nd n3"></i><i class="nd n4"></i><i class="fk f1"></i><i class="fk f2"></i></i>
      <i class="hub"></i>
      <i class="core"></i>
    </div>
    <i class="mist m1"></i>
    <i class="mist m2"></i>
  </div>
  <p class="phase" aria-hidden="true"><span class="t1">frost</span><span class="t2">reach</span><span class="t3">needle</span><span class="t4">thin</span></p>
</main>
</body>
</html>
