<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glacier Creep</title>
<meta name="description" content="A glacier tongue keeps pushing across grey moraine rock: the ice slides forward with a rounded snout, the crevasse field opens wider and wider as the pressure builds at the front, meltwater threads run off the foot of the ice and the whole mass strains forward.">
<meta name="description-es" content="Una lengua de glaciar sigue empujando sobre la morrena gris: el hielo avanza con un morro redondeado, el campo de grietas se abre cada vez más al acumularse la presión en el frente, el agua de deshielo baja por el pie del hielo y toda la masa se arrastra hacia delante.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="scene" aria-busy="true">
  <div class="sky" aria-hidden="true"></div>
  <div class="ground" aria-hidden="true">
    <span class="ridge g1"></span>
    <span class="ridge g2"></span>
    <span class="ridge g3"></span>
  </div>
  <div class="obj" aria-hidden="true">
    <div class="belt">
      <div class="ice">
        <span class="body"></span>
        <span class="flow"></span>
        <span class="crack k1"></span>
        <span class="crack k2"></span>
        <span class="crack k3"></span>
        <span class="crack k4"></span>
        <span class="crack k5"></span>
        <span class="crack k6"></span>
        <span class="berg"></span>
        <span class="snout"></span>
      </div>
      <div class="ice">
        <span class="body"></span>
        <span class="flow"></span>
        <span class="crack k1"></span>
        <span class="crack k2"></span>
        <span class="crack k3"></span>
        <span class="crack k4"></span>
        <span class="crack k5"></span>
        <span class="crack k6"></span>
        <span class="berg"></span>
        <span class="snout"></span>
      </div>
    </div>
    <div class="melt">
      <i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i><i style="--k:3"></i>
    </div>
    <div class="haze"><i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i></div>
  </div>
  <p class="sr" role="status">A glacier creeps forward over rock: the crevasse field opens as the ice is squeezed, the snout bulges ahead and meltwater drips from the foot of the ice.</p>
</main>
</body>
</html>
