<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avalanche Slide</title>
<meta name="description" content="A slab of snow breaks away high on a slate face and runs down without stopping: the fracture crown keeps opening at the top, chunks of snow tumble and grow as they fall, and a powder cloud is dragged up behind the moving mass.">
<meta name="description-es" content="Una losa de nieve se desprende arriba en una ladera de pizarra y baja sin parar: la corona de fractura se abre una y otra vez arriba, los bloques de nieve giran y crecen al caer y una nube de polvo sale arrastrada detrás de la masa.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="scene" aria-busy="true">
  <div class="sky" aria-hidden="true"></div>
  <div class="ground" aria-hidden="true"></div>
  <div class="obj" aria-hidden="true">
    <div class="slope">
      <span class="rib r1"></span>
      <span class="rib r2"></span>
      <span class="rib r3"></span>
      <span class="field"></span>
      <span class="rock k1"></span>
      <span class="rock k2"></span>
      <div class="flow">
        <span class="slab" style="--k:0"></span>
        <span class="slab" style="--k:1"></span>
        <span class="slab" style="--k:2"></span>
        <span class="slab" style="--k:3"></span>
        <span class="slab" style="--k:4"></span>
        <span class="slab" style="--k:5"></span>
        <span class="slab" style="--k:6"></span>
        <span class="slab" style="--k:7"></span>
        <span class="scour s1"></span>
        <span class="scour s2"></span>
        <span class="crown"></span>
      </div>
    </div>
    <div class="powder">
      <i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i><i style="--k:3"></i>
      <i style="--k:4"></i><i style="--k:5"></i><i style="--k:6"></i>
    </div>
  </div>
  <p class="sr" role="status">A slab of snow slides down a slate face, the fracture crown keeps opening at the top and a cloud of powder is dragged up behind the moving mass.</p>
</main>
</body>
</html>
