<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loom Weave</title>
<meta name="description" content="A wooden loom draws a linen weft through indigo warp threads pick by pick: the shed opens, the shuttle flies from side to side, a wet gloss runs along the warp, and the woven band grows row by row until it rolls off the beam.">
<meta name="description-es" content="Un telar de madera pasa el hilo de lino por las urdimbres índigo trama a trama: se abre la calada, la lanzadera vuela de lado a lado, un brillo húmedo recorre la urdimbre y la banda tejida crece fila a fila hasta que se enrolla en el rollo.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="loom" aria-hidden="true">
    <span class="rail top"></span>
    <span class="rail bot"></span>
    <span class="post l"></span>
    <span class="post r"></span>
    <div class="warp">
      <i style="--i:0"></i>
      <i style="--i:1"></i>
      <i style="--i:2"></i>
      <i style="--i:3"></i>
      <i style="--i:4"></i>
      <i style="--i:5"></i>
      <i style="--i:6"></i>
      <i style="--i:7"></i>
      <i style="--i:8"></i>
      <i style="--i:9"></i>
      <i style="--i:10"></i>
      <i style="--i:11"></i>
      <i style="--i:12"></i>
    </div>
    <div class="cloth">
      <i style="--i:0"></i>
      <i style="--i:1"></i>
      <i style="--i:2"></i>
      <i style="--i:3"></i>
      <i style="--i:4"></i>
      <i style="--i:5"></i>
    </div>
    <span class="sheen"></span>
    <span class="shuttle"></span>
    <span class="beater"></span>
  </div>
  <p class="sr" role="status">Telar tejiendo: la lanzadera lleva el hilo de lino a través de la calada, la urdimbre índigo brilla en cada trama y el paño crece fila a fila.</p>
</main>
</body>
</html>
