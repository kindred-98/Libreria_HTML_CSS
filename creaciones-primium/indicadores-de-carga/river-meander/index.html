<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>River Meander</title>
<meta name="description" content="Seen from above, a river works on its own course: the channel creeps sideways across the floodplain, the bend opens slowly as the outer bank is undercut, a pale bar of silt grows on the inside and the old loop is left dry and grey.">
<meta name="description-es" content="Vista desde arriba, un río trabaja su propio cauce: el canal se desplaza de lado a lado en la llanura de inundación, la curva se abre despacio mientras la orilla exterior se desgasta, crece una barra de limo clara en la interior y el meandro viejo queda seco y gris.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="scene" aria-busy="true">
  <div class="plain" aria-hidden="true"></div>
  <div class="obj" aria-hidden="true">
    <div class="reach">
      <div class="water">
        <span class="sheen"></span>
        <span class="thread th1"></span>
        <span class="thread th2"></span>
        <span class="thread th3"></span>
        <span class="thread th4"></span>
      </div>
      <div class="bar"></div>
      <div class="scour"></div>
    </div>
    <div class="oxbow"></div>
    <div class="turf">
      <i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i>
      <i class="c5"></i><i class="c6"></i><i class="c7"></i>
    </div>
  </div>
  <p class="sr" role="status">A river shifts sideways across a plain: the curve opens slowly, silt builds on the inner bank, the outer bank is undercut and the water keeps threading through the new bed.</p>
</main>
</body>
</html>
