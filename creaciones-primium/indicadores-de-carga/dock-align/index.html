<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dock Align</title>
<meta name="description" content="A docking module coasts head-on toward a lunar-grey station port, and the four guidance crosses for lateral, vertical, roll and rate axis go dark one by one as each axis locks, until the probe is softly captured and the latches close.">
<meta name="description-es" content="Un módulo de acoplamiento se acerca de frente al puerto de una estación gris lunar y las cuatro cruces de guiado de los ejes lateral, vertical, de balance y de giro se apagan una a una según se bloquea cada eje, hasta que la sonda queda capturada y los cierres se enclavan.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="void" aria-busy="true">
  <div class="void__bg" aria-hidden="true"></div>
  <div class="void__stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <div class="port" aria-hidden="true">
    <span class="port__ring"></span>
    <span class="port__ribs"></span>
    <span class="port__hub"></span>
    <span class="port__rim"></span>
    <span class="port__tunnel"></span>
    <span class="port__glow"></span>
    <span class="arm arm--a"><i></i></span>
    <span class="arm arm--b"><i></i></span>
    <span class="arm arm--c"><i></i></span>
    <span class="arm arm--d"><i></i></span>
  </div>

  <span class="cross cross--a"><i></i><b>Lateral</b></span>
  <span class="cross cross--b"><i></i><b>Vertical</b></span>
  <span class="cross cross--c"><i></i><b>Roll</b></span>
  <span class="cross cross--d"><i></i><b>Rate</b></span>

  <div class="craft" aria-hidden="true">
    <span class="craft__disc"></span>
    <span class="craft__ring"></span>
    <span class="craft__petal craft__petal--a"></span>
    <span class="craft__petal craft__petal--b"></span>
    <span class="craft__petal craft__petal--c"></span>
    <span class="craft__tip"></span>
    <span class="craft__lamp craft__lamp--a"></span>
    <span class="craft__lamp craft__lamp--b"></span>
    <span class="craft__lamp craft__lamp--c"></span>
    <span class="craft__lamp craft__lamp--d"></span>
  </div>

  <p class="range" aria-hidden="true">Range<span class="range__v" id="rng">184 m</span></p>

  <p class="sr" role="status">Docking run: the module closes on the station port, the lateral, vertical, roll and rate guidance crosses go dark one at a time as each axis locks, the probe is softly captured and the latches close.</p>
</main>
</body>
</html>
