<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mycelium Spread</title>
<meta name="description" content="A fungal network grows through a clod of forest floor: threads reach out from a knot, branch as they go, fatten while they drink and carry a travelling pulse of light to every tip.">
<meta name="description-es" content="Una red de micelio crece por un terrón de suelo forestal: los hilos salen de un nudo, se ramifican, engordan al absorber y llevan un pulso de luz hasta cada punta.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="bed" aria-hidden="true">
    <div class="clod">
      <span class="mottle"></span>
      <div class="web">
        <span class="thread" style="--a:12deg;--l:47%;--d:0s"><i class="br" style="--a:36deg;--l:42%;left:58%"></i><i class="br" style="--a:-44deg;--l:30%;left:70%"></i></span>
        <span class="thread" style="--a:73deg;--l:38%;--d:.09s"><i class="br" style="--a:40deg;--l:36%;left:62%"></i><i class="br" style="--a:-34deg;--l:44%;left:48%"></i></span>
        <span class="thread" style="--a:134deg;--l:44%;--d:.18s"><i class="br" style="--a:30deg;--l:46%;left:56%"></i><i class="br" style="--a:-48deg;--l:26%;left:74%"></i></span>
        <span class="thread" style="--a:197deg;--l:41%;--d:.27s"><i class="br" style="--a:44deg;--l:32%;left:64%"></i><i class="br" style="--a:-30deg;--l:40%;left:52%"></i></span>
        <span class="thread" style="--a:259deg;--l:46%;--d:.36s"><i class="br" style="--a:32deg;--l:44%;left:60%"></i><i class="br" style="--a:-42deg;--l:30%;left:72%"></i></span>
        <span class="thread" style="--a:317deg;--l:35%;--d:.45s"><i class="br" style="--a:46deg;--l:38%;left:58%"></i><i class="br" style="--a:-36deg;--l:34%;left:66%"></i></span>
        <span class="mote" style="--x:24%;--y:20%;--d:.4s"></span>
        <span class="mote" style="--x:74%;--y:15%;--d:1.3s"></span>
        <span class="mote" style="--x:66%;--y:76%;--d:2.1s"></span>
        <span class="mote" style="--x:28%;--y:70%;--d:2.9s"></span>
        <span class="mote" style="--x:82%;--y:46%;--d:3.5s"></span>
        <span class="knot"></span>
      </div>
    </div>
  </div>
  <p class="sr" role="status">Micelio extendiéndose: los hilos avanzan y se ramifican por el sustrato mientras engordan al absorber.</p>
</main>
</body>
</html>
