<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monsoon Front</title>
<meta name="description" content="A monsoon front crosses the land: a wall of slanted rain sweeps from one side to the other, the gust lip runs ahead of the curtain, the ground darkens as the rain arrives over it and the light comes back when the front has passed.">
<meta name="description-es" content="Un frente de lluvias cruza la tierra: una cortina de lluvia inclinada barre de un lado a otro, el borde del viento corre por delante, el suelo se oscurece al llegar la lluvia y la luz vuelve cuando el frente ya ha pasado.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="scene" aria-busy="true">
  <div class="sky" aria-hidden="true"></div>
  <div class="land" aria-hidden="true">
    <span class="green"></span>
    <span class="crop"></span>
    <span class="clump c1"></span>
    <span class="clump c2"></span>
    <span class="clump c3"></span>
    <span class="clump c4"></span>
  </div>
  <div class="dim" aria-hidden="true"></div>
  <div class="front" aria-hidden="true">
    <span class="lip"></span>
    <div class="curtain">
      <span class="slants"></span>
      <span class="haze"></span>
      <span class="wet"></span>
    </div>
  </div>
  <p class="sr" role="status">A rain front sweeps across the land from left to right: the curtain of slanted rain darkens the ground as it passes and the light returns behind it.</p>
</main>
</body>
</html>
