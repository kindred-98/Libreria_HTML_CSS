<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solder Bead</title>
<meta name="description" content="Two copper joints meet and a bead of tin is soldered between them: the iron touches the seam, the metal starts to wet and creep along the joint, the bead swells and brightens as it cools from a rough matte skin to a smooth silver mirror, and the iron lifts away leaving the seam solid.">
<meta name="description-es" content="Dos uniones de cobre se encuentran y entre ellas se solda una gota de estaño: el cautillo toca la costura, el metal empieza a mojar y trepar por la unión, la gota se hincha y aclara al enfriarse de una piel mate y rugosa a un espejo de plata liso, y el cautillo se retira dejando la costura sólida.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="joint" aria-hidden="true">
    <span class="pipe left"></span>
    <span class="pipe right"></span>
    <span class="heat"></span>
    <span class="seam"></span>
    <span class="bead"></span>
    <span class="gloss"></span>
    <span class="iron"></span>
    <span class="smoke"></span>
  </div>
  <p class="sr" role="status">Soldadura: el cautillo calienta la costura, el estaño moja y trepa por la unión, la gota se hincha y aclara hasta quedar lisa al enfriarse.</p>
</main>
</body>
</html>
