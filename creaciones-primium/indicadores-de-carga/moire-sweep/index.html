<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moire Sweep</title>
<meta name="description" content="Two ruled gratings of different pitch are wiped across one another: the beat between them throws wide moire fringes across the slab, and those bands pulse in time with the sweep while a hard highlight runs over the surface.">
<meta name="description-es" content="Dos redes rayadas de distinto paso se barren una sobre otra: el batido entre ellas lanza franjas de muaré anchas por la losa, y esas bandas laten al ritmo del barrido mientras un brillo duro recorre la superficie.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage" aria-busy="true">
  <div class="fig" aria-hidden="true">
    <div class="cast"></div>
    <div class="slab">
      <div class="grate grate--a"></div>
      <div class="grate grate--b"></div>
      <div class="beat"></div>
      <div class="gloss"></div>
      <div class="lip"></div>
    </div>
  </div>
  <p class="sr" role="status">Two ruled gratings are sweeping across each other: the beat between them throws moire fringes that pulse with the sweep.</p>
</main>
</body>
</html>
