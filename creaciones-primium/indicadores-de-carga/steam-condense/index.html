<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steam Condense</title>
<meta name="description" content="A cold surface takes the steam: the vapour climbs, fogs over into a white mist, beads of water gather on the cold glass, run down and leave a clear track through the fog before the mist forms again.">
<meta name="description-es" content="Una superficie fría se queda con el vapor: la columna sube, se convierte en una bruma blanca, se agrupan gotas en el vidrio frío, resbalan y dejan un rastro limpio en la niebla antes de que la bruma vuelva a formarse.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="cold" aria-busy="true">
  <div class="rig">
    <div class="chill"></div>
    <div class="fog">
      <span class="cloud c1"></span>
      <span class="cloud c2"></span>
      <span class="cloud c3"></span>
    </div>
    <div class="steam">
      <i class="wisp w1"></i><i class="wisp w2"></i><i class="wisp w3"></i><i class="wisp w4"></i>
    </div>
    <div class="runs">
      <span class="track" style="--x:17%;--y:11%;--d:0s"></span>
      <span class="track" style="--x:33%;--y:15%;--d:-.22s"></span>
      <span class="track" style="--x:48%;--y:9%;--d:-.44s"></span>
      <span class="track" style="--x:62%;--y:14%;--d:-.66s"></span>
      <span class="track" style="--x:78%;--y:10%;--d:-.88s"></span>
      <span class="runner" style="--x:17%;--y:11%;--d:0s"><i class="bead"></i></span>
      <span class="runner" style="--x:33%;--y:15%;--d:-.22s"><i class="bead"></i></span>
      <span class="runner" style="--x:48%;--y:9%;--d:-.44s"><i class="bead"></i></span>
      <span class="runner" style="--x:62%;--y:14%;--d:-.66s"><i class="bead"></i></span>
      <span class="runner" style="--x:78%;--y:10%;--d:-.88s"><i class="bead"></i></span>
    </div>
    <div class="film"></div>
  </div>
  <p class="sr" role="status">Steam fogs the cold surface, beads of water form on it and run down leaving clear tracks</p>
</main>
</body>
</html>
