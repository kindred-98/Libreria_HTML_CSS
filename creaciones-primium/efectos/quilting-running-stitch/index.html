<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quilting Running Stitch</title>
<meta name="description" content="The same running stitch sewn four times in wool, linen, satin and denim: the needle travels the seam in sequence, the thread tightens behind it and the padding rises along the way.">
<meta name="description-es" content="El mismo pespunte cosido cuatro veces en lana, lino, satén y vaquero: la aguja recorre la costura en secuencia, el hilo se tensa detrás y el acolchado se levanta a su paso.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="quilt">
  <div class="wall" aria-hidden="true"></div>

  <header class="head">
    <p class="kicker">Patchwork study / four cloths</p>
    <h1>Quilting Running Stitch</h1>
    <p class="lede">One seam, four materials. The needle never stops and the thread always follows the hole it just made.</p>
  </header>

  <section class="row">
    <article class="patch wool" style="--d:0s">
      <span class="shape">
        <span class="pad"></span>
        <span class="seam">
          <i style="--x:8%;--y:12%"></i><i style="--x:26%;--y:12%"></i>
          <i style="--x:44%;--y:12%"></i><i style="--x:62%;--y:12%"></i>
          <i style="--x:80%;--y:12%"></i><i style="--x:80%;--y:34%"></i>
          <i style="--x:80%;--y:56%"></i><i style="--x:80%;--y:78%"></i>
          <i style="--x:62%;--y:78%"></i><i style="--x:44%;--y:78%"></i>
          <i style="--x:26%;--y:78%"></i><i style="--x:8%;--y:78%"></i>
          <i style="--x:8%;--y:56%"></i><i style="--x:8%;--y:34%"></i>
        </span>
        <span class="needle"></span>
        <span class="thread"></span>
      </span>
      <span class="tag">wool &middot; hand stitch</span>
    </article>

    <article class="patch linen" style="--d:.6s">
      <span class="shape">
        <span class="pad"></span>
        <span class="seam">
          <i style="--x:8%;--y:12%"></i><i style="--x:26%;--y:12%"></i>
          <i style="--x:44%;--y:12%"></i><i style="--x:62%;--y:12%"></i>
          <i style="--x:80%;--y:12%"></i><i style="--x:80%;--y:34%"></i>
          <i style="--x:80%;--y:56%"></i><i style="--x:80%;--y:78%"></i>
          <i style="--x:62%;--y:78%"></i><i style="--x:44%;--y:78%"></i>
          <i style="--x:26%;--y:78%"></i><i style="--x:8%;--y:78%"></i>
          <i style="--x:8%;--y:56%"></i><i style="--x:8%;--y:34%"></i>
        </span>
        <span class="needle"></span>
        <span class="thread"></span>
      </span>
      <span class="tag">linen &middot; even basting</span>
    </article>

    <article class="patch satin" style="--d:1.2s">
      <span class="shape">
        <span class="pad"></span>
        <span class="seam">
          <i style="--x:8%;--y:12%"></i><i style="--x:26%;--y:12%"></i>
          <i style="--x:44%;--y:12%"></i><i style="--x:62%;--y:12%"></i>
          <i style="--x:80%;--y:12%"></i><i style="--x:80%;--y:34%"></i>
          <i style="--x:80%;--y:56%"></i><i style="--x:80%;--y:78%"></i>
          <i style="--x:62%;--y:78%"></i><i style="--x:44%;--y:78%"></i>
          <i style="--x:26%;--y:78%"></i><i style="--x:8%;--y:78%"></i>
          <i style="--x:8%;--y:56%"></i><i style="--x:8%;--y:34%"></i>
        </span>
        <span class="needle"></span>
        <span class="thread"></span>
      </span>
      <span class="tag">satin &middot; invisible seam</span>
    </article>

    <article class="patch denim" style="--d:1.8s">
      <span class="shape">
        <span class="pad"></span>
        <span class="seam">
          <i style="--x:8%;--y:12%"></i><i style="--x:26%;--y:12%"></i>
          <i style="--x:44%;--y:12%"></i><i style="--x:62%;--y:12%"></i>
          <i style="--x:80%;--y:12%"></i><i style="--x:80%;--y:34%"></i>
          <i style="--x:80%;--y:56%"></i><i style="--x:80%;--y:78%"></i>
          <i style="--x:62%;--y:78%"></i><i style="--x:44%;--y:78%"></i>
          <i style="--x:26%;--y:78%"></i><i style="--x:8%;--y:78%"></i>
          <i style="--x:8%;--y:56%"></i><i style="--x:8%;--y:34%"></i>
        </span>
        <span class="needle"></span>
        <span class="thread"></span>
      </span>
      <span class="tag">denim &middot; topstitch</span>
    </article>
  </section>

  <footer class="legend">
    <span class="key"><i class="sw sw-rose"></i>wool</span>
    <span class="key"><i class="sw sw-sage"></i>linen</span>
    <span class="key"><i class="sw sw-cream"></i>satin</span>
    <span class="key"><i class="sw sw-indigo"></i>denim</span>
    <span class="readout">14 stitches &middot; 6.4 s per seam</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
