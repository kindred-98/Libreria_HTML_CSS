<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starling Murmuration</title>
<meta name="description" content="A flock of starlings wheels over a dusk horizon while a targeting reticle tracks its centre of mass and telemetry reports speed, spread and cohesion.">
<meta name="description-es" content="Una bandada de estorninos gira sobre el horizonte del ocaso mientras un retículo sigue su centro de masa y la telemetría informa de velocidad, dispersión y cohesión.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="scene">
  <div class="sky" aria-hidden="true"></div>

  <div class="stars" aria-hidden="true">
    <s></s><s></s><s></s><s></s><s></s><s></s><s></s><s></s>
    <s></s><s></s><s></s><s></s><s></s><s></s><s></s><s></s>
  </div>

  <div class="moon" aria-hidden="true"></div>

  <div class="clouds" aria-hidden="true">
    <b class="c1"></b>
    <b class="c2"></b>
    <b class="c3"></b>
  </div>

  <div class="ridge" aria-hidden="true">
    <svg viewBox="0 0 1200 260" preserveAspectRatio="none" focusable="false">
      <path d="M0 176 L96 142 L168 168 L262 112 L338 150 L430 96 L512 138 L604 78 L688 132 L772 104 L856 148 L944 92 L1030 140 L1112 116 L1200 152 L1200 260 L0 260 Z"></path>
      <path class="far" d="M0 132 L110 96 L208 124 L318 70 L420 110 L540 54 L660 102 L780 66 L900 108 L1020 74 L1120 106 L1200 84 L1200 260 L0 260 Z"></path>
    </svg>
    <span class="tower"></span>
    <span class="lights"><i></i><i></i><i></i><i></i><i></i></span>
  </div>

  <div class="flock" id="flock" aria-hidden="true"></div>

  <div class="reticle" id="reticle" aria-hidden="true">
    <span class="ring"></span>
    <span class="tick t1"></span>
    <span class="tick t2"></span>
    <span class="tick t3"></span>
    <span class="tick t4"></span>
    <span class="dot"></span>
    <span class="lab">centroid</span>
  </div>

  <header class="top">
    <div class="brand">
      <span class="eyebrow">Field optics / station 07</span>
      <h1>Starling Murmuration</h1>
    </div>
    <div class="mode">
      <span class="led"></span>
      <span>tracking</span>
    </div>
  </header>

  <aside class="panel">
    <div class="row"><span class="k">Birds</span><span class="v" id="vCount">72</span></div>
    <div class="row"><span class="k">Mean speed</span><span class="v" id="vSpeed">0.0</span><span class="u">px/f</span></div>
    <div class="row"><span class="k">Spread</span><span class="v" id="vSpread">0</span><span class="u">px</span></div>
    <div class="row"><span class="k">Cohesion</span><span class="v" id="vCoh">0</span><span class="u">%</span></div>
    <div class="row"><span class="k">Heading</span><span class="v" id="vHead">000</span><span class="u">&deg;</span></div>
    <div class="bars" id="bars" aria-hidden="true"></div>
    <div class="scale"><span>density trace / 9 s window</span></div>
  </aside>

  <footer class="legend">
    <span class="key"><i class="sw sw-amber"></i>murmuration core</span>
    <span class="key"><i class="sw sw-cyan"></i>tracked centroid</span>
    <span class="key"><i class="sw sw-dim"></i>ridge line</span>
    <span class="readout">boids solve &middot; 72 agents &middot; 60 hz</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
  <span class="vignette" aria-hidden="true"></span>
</main>
</body>
</html>
