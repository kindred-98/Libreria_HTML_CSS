<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sun Dappled Leaves</title>
<meta name="description" content="Midday light filtered through a canopy crawls across a plaster wall: soft pools of sun drift, stretch and fade while the leaves that cast them sway at the edge of the frame.">
<meta name="description-es" content="La luz de mediodía filtrada por una bóveda vegetal recorre un muro de yeso: charcos de sol derivan, se estiran y desvanecen mientras las hojas que los proyectan se mecen en el borde del encuadre.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="frame">
  <div class="wall" aria-hidden="true">
    <div class="pools">
      <i style="--x:12%;--y:16%;--s:9%;--d:17s;--dl:-1s"></i>
      <i style="--x:31%;--y:9%;--s:6%;--d:21s;--dl:-4s"></i>
      <i style="--x:52%;--y:18%;--s:11%;--d:19s;--dl:-7s"></i>
      <i style="--x:74%;--y:11%;--s:7%;--d:23s;--dl:-2s"></i>
      <i style="--x:88%;--y:24%;--s:8%;--d:18s;--dl:-9s"></i>
      <i style="--x:20%;--y:38%;--s:7%;--d:22s;--dl:-5s"></i>
      <i style="--x:43%;--y:44%;--s:10%;--d:20s;--dl:-11s"></i>
      <i style="--x:66%;--y:36%;--s:6%;--d:24s;--dl:-3s"></i>
      <i style="--x:82%;--y:52%;--s:9%;--d:16s;--dl:-13s"></i>
      <i style="--x:8%;--y:60%;--s:6%;--d:25s;--dl:-6s"></i>
      <i style="--x:28%;--y:72%;--s:8%;--d:18s;--dl:-15s"></i>
      <i style="--x:57%;--y:66%;--s:7%;--d:21s;--dl:-8s"></i>
      <i style="--x:76%;--y:80%;--s:10%;--d:19s;--dl:-.5s"></i>
      <i style="--x:93%;--y:70%;--s:6%;--d:23s;--dl:-12s"></i>
      <i style="--x:38%;--y:88%;--s:7%;--d:20s;--dl:-16s"></i>
      <i style="--x:14%;--y:26%;--s:5%;--d:26s;--dl:-10s"></i>
      <i style="--x:61%;--y:92%;--s:5%;--d:22s;--dl:-17s"></i>
    </div>

    <div class="gobo" aria-hidden="true"></div>
    <div class="framebar" aria-hidden="true">
      <i></i><i></i><i></i>
    </div>
    <span class="halo" aria-hidden="true"></span>

    <div class="leaves" aria-hidden="true">
      <span class="leaf l1"><i></i><i></i><i></i></span>
      <span class="leaf l2"><i></i><i></i></span>
      <span class="leaf l3"><i></i><i></i><i></i></span>
      <span class="leaf l4"><i></i><i></i></span>
    </div>

    <span class="vign" aria-hidden="true"></span>
    <span class="grain" aria-hidden="true"></span>
  </div>

  <footer class="plate">
    <p class="cap"><span>Komorebi</span><i>plaster wall, 15:20</i></p>
    <p class="meta">24 mm &middot; f5.6 &middot; 1/500 &middot; iso 200</p>
  </footer>
</main>
</body>
</html>
