<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Of Fish Swarm</title>
<meta name="description" content="A school of silver fish swims as one body and opens like a shield when a hook crosses the screen, then closes back into a single shape while the current keeps pushing from the left.">
<meta name="description-es" content="Un banco de peces plateados nada rápido como un solo cuerpo y se abre como un escudo cuando un anzuelo cruza la pantalla, para cerrarse de nuevo mientras la corriente empuja desde la izquierda.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="reef">
  <div class="water" aria-hidden="true"></div>

  <div class="caustics" aria-hidden="true">
    <span class="b1"></span><span class="b2"></span><span class="b3"></span>
  </div>

  <div class="shafts" aria-hidden="true">
    <span class="sa1"></span><span class="sa2"></span><span class="sa3"></span>
  </div>

  <div class="school" id="school" aria-hidden="true"></div>

  <div class="hook" aria-hidden="true">
    <span class="line"></span>
    <span class="curve"></span>
    <span class="barb"></span>
  </div>

  <div class="coral" aria-hidden="true">
    <span class="rock r1"></span>
    <span class="rock r2"></span>
    <span class="weed w1"></span>
    <span class="weed w2"></span>
    <span class="weed w3"></span>
  </div>

  <header class="head">
    <p class="kicker">Level 3 / shield school</p>
    <h1>School Of Fish</h1>
    <p class="lede">One mind, forty bodies. When the lure arrives they tear open, and when it is gone they close again.</p>
  </header>

  <aside class="hud">
    <div class="row"><span class="k">School</span><span class="v" id="vCount">40</span></div>
    <div class="row"><span class="k">Cohesion</span><span class="v" id="vCoh">0.82</span></div>
    <div class="row"><span class="k">Formation</span><span class="v" id="vForm">ball</span></div>
    <div class="row"><span class="k">Threat</span><span class="v" id="vThreat">near</span></div>
  </aside>

  <footer class="legend">
    <span class="key"><i class="sw sw-silver"></i>silver</span>
    <span class="key"><i class="sw sw-coral"></i>coral</span>
    <span class="key"><i class="sw sw-deep"></i>deep water</span>
    <span class="readout">loop 13 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
