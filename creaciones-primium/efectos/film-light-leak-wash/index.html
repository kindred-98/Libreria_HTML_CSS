<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Film Light Leak Wash</title>
<meta name="description" content="A burnt orange, magenta and indigo light leak floods the right half of a dusk photograph along a slanted cut, pulsing and drifting while the left half stays untouched.">
<meta name="description-es" content="Una fuga de luz naranja quemado, magenta e índigo inunda la mitad derecha de una fotografía del ocaso a lo largo de un corte inclinado, pulsando y derivando, mientras la mitad izquierda se mantiene intacta.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="scene">
  <div class="table" aria-hidden="true"></div>

  <div class="print">
    <div class="sheet">
      <span class="sky"></span>
      <span class="sun"></span>
      <span class="haze"></span>
      <span class="ridge far"></span>
      <span class="ridge near"></span>
      <span class="ground"></span>
      <span class="scrim"></span>

      <div class="leak leak-screen" aria-hidden="true">
        <span class="tint"></span>
        <span class="halo"></span>
        <span class="flare"></span>
        <div class="streaks">
          <i style="--i:0;--x:22;--w:9;--h:22"></i>
          <i style="--i:1;--x:31;--w:5;--h:320"></i>
          <i style="--i:2;--x:38;--w:13;--h:26"></i>
          <i style="--i:3;--x:47;--w:6;--h:286"></i>
          <i style="--i:4;--x:53;--w:11;--h:18"></i>
          <i style="--i:5;--x:61;--w:4;--h:300"></i>
          <i style="--i:6;--x:66;--w:15;--h:32"></i>
          <i style="--i:7;--x:74;--w:7;--h:336"></i>
          <i style="--i:8;--x:79;--w:10;--h:24"></i>
          <i style="--i:9;--x:86;--w:5;--h:274"></i>
          <i style="--i:10;--x:90;--w:12;--h:30"></i>
          <i style="--i:11;--x:95;--w:6;--h:310"></i>
        </div>
      </div>

      <div class="leak leak-color" aria-hidden="true">
        <span class="tint2"></span>
      </div>

      <div class="motes" aria-hidden="true">
        <s></s><s></s><s></s><s></s><s></s>
        <s></s><s></s><s></s><s></s><s></s>
      </div>

      <div class="edge" aria-hidden="true">
        <b class="e1"></b>
        <b class="e2"></b>
      </div>

      <div class="copy">
        <span class="eyebrow">Roll 04 &middot; frame 12A &middot; 1/60 f2</span>
        <h1><span>Light</span><span>Leak</span></h1>
        <span class="caption">Expired stock &middot; 800 iso &middot; pushed two stops</span>
      </div>

      <span class="tag tag-a">Untouched</span>
      <span class="tag tag-b">Leaked</span>

      <svg class="cut" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <line x1="58" y1="0" x2="26" y2="100"></line>
      </svg>
    </div>
    <span class="reb reb-a">12A</span>
    <span class="reb reb-b">04 &middot; 12</span>
  </div>

  <footer class="hud">
    <span class="stat"><i>Leak</i>halation 4.2 mm</span>
    <span class="stat"><i>Grade</i>+18 magenta</span>
    <span class="stat"><i>Cut</i>17.5&deg; diagonal</span>
    <span class="stat"><i>Stock</i>expired 1998</span>
    <span class="mark">Loop 7.2 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
  <span class="vignette" aria-hidden="true"></span>
</main>
</body>
</html>
