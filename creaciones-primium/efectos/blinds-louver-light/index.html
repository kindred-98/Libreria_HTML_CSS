<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Louver Light</title>
<meta name="description" content="Afternoon sun cuts through a venetian louver and lays moving bands of shadow across a poster on a plaster wall, split by a diagonal seam between the plain half and the striped half.">
<meta name="description-es" content="El sol del mediodía atraviesa una cortina veneciana y deja bandas de sombra en movimiento sobre un cartel pegado a un muro de yeso, partido por una costura diagonal entre la mitad lisa y la mitad rayada.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="scene">
  <div class="backdrop" aria-hidden="true"></div>

  <div class="window" aria-hidden="true">
    <span class="glass"></span>
    <span class="mullion"></span>
    <span class="sill"></span>
    <div class="louvers">
      <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i>
      <i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i>
      <i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i>
      <i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i><i style="--i:15"></i>
    </div>
  </div>

  <div class="glow" aria-hidden="true"></div>

  <div class="poster">
    <span class="eyebrow">Interior study &mdash; no.12</span>
    <h1><span>Louver</span><span>Light</span></h1>
    <span class="caption">West wall &middot; 16:40 &middot; louver 26 mm</span>
  </div>

  <div class="shade" aria-hidden="true">
    <div class="tilt">
      <b style="--i:0"></b><b style="--i:1"></b><b style="--i:2"></b><b style="--i:3"></b>
      <b style="--i:4"></b><b style="--i:5"></b><b style="--i:6"></b><b style="--i:7"></b>
      <b style="--i:8"></b><b style="--i:9"></b><b style="--i:10"></b><b style="--i:11"></b>
      <b style="--i:12"></b><b style="--i:13"></b><b style="--i:14"></b><b style="--i:15"></b>
    </div>
  </div>

  <div class="motes" aria-hidden="true">
    <s></s><s></s><s></s><s></s><s></s><s></s><s></s><s></s><s></s><s></s>
  </div>

  <svg class="cut" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <line x1="56" y1="0" x2="24" y2="100"></line>
  </svg>

  <span class="tag tag-a">Plain wall</span>
  <span class="tag tag-b">Louvered</span>

  <footer class="hud">
    <span class="stat"><i>Preset</i>West wall</span>
    <span class="stat"><i>Slat</i>16 &times; 26 mm</span>
    <span class="stat"><i>Tilt</i>0&ndash;38&deg;</span>
    <span class="stat"><i>Sun</i>34&deg; elevation</span>
    <span class="mark">Loop 6.4 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
  <span class="vignette" aria-hidden="true"></span>
</main>
</body>
</html>
