<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wax Seal Stamp</title>
<meta name="description" content="A wax seal is pressed onto a floating letter: the blob flattens under the die, the crest presses into the surface, the metal lifts and the cooling wax settles back into its rim.">
<meta name="description-es" content="Un sello de lacre se estampa sobre una carta que levita: la gota se aplana bajo el troquel, el escudo se hunde en la superficie, el metal se levanta y la cera se enfría y vuelve a su borde.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="scene">
  <div class="back" aria-hidden="true"></div>
  <div class="pedestal" aria-hidden="true"></div>

  <section class="letter">
    <div class="paper" aria-hidden="true">
      <span class="rule r1"></span>
      <span class="rule r2"></span>
      <span class="rule r3"></span>
      <span class="rule r4"></span>
      <span class="rule r5"></span>
      <span class="flap"></span>
      <span class="crease"></span>
    </div>

    <div class="seal" aria-hidden="true">
      <span class="blob">
        <span class="rim"></span>
        <span class="crest">
          <i class="shield"></i>
          <i class="lions"></i>
          <i class="ribbon"></i>
        </span>
        <span class="gloss"></span>
      </span>
      <span class="shadow"></span>
    </div>

    <div class="die" aria-hidden="true">
      <span class="knob"></span>
      <span class="neck"></span>
      <span class="grip"></span>
      <span class="face"></span>
    </div>
  </section>

  <header class="head">
    <p class="kicker">Desk of the notary / seal no.3</p>
    <h1>Wax Seal Stamp</h1>
    <p class="lede">Wax is hot, wax is heavy, wax obeys. The die comes down, the crest takes the impression and the letter floats a little higher on every strike.</p>
  </header>

  <footer class="legend">
    <span class="key"><i class="sw sw-wax"></i>wax</span>
    <span class="key"><i class="sw sw-gold"></i>crest</span>
    <span class="key"><i class="sw sw-paper"></i>paper</span>
    <span class="readout">strike every 5.2 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
