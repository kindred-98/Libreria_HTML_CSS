<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hologram Sticker Peel</title>
<meta name="description" content="A holographic sticker is shown still stuck to its sheet on one side and peeling away on the other, the lifted corner bending back with a rainbow that travels along the film as it releases.">
<meta name="description-es" content="Una calcomanía holográfica aparece pegada en una mitad y despegándose en la otra: la esquina levantada se dobla hacia atrás con un arcoíris que recorre la película mientras se libera.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="desk">
  <div class="back" aria-hidden="true"></div>

  <header class="head">
    <p class="kicker">Vinyl shop / sample card</p>
    <h1>Hologram Sticker Peel</h1>
    <p class="lede">Left: still down, dead flat, no colour. Right: half lifted, and the whole spectrum crawls along the film as the angle changes.</p>
  </header>

  <section class="stage">
    <svg class="cut" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <line x1="52" y1="0" x2="44" y2="100"></line>
    </svg>

    <div class="half left">
      <div class="card">
        <span class="film">
          <span class="grid"></span>
          <span class="mark">NOIR</span>
          <span class="sheen"></span>
        </span>
      </div>
      <span class="tag">still down</span>
    </div>

    <div class="half right">
      <div class="card">
        <span class="base"></span>
        <span class="film peel">
          <span class="grid"></span>
          <span class="mark">NOIR</span>
          <span class="sheen"></span>
          <span class="edge"></span>
        </span>
      </div>
      <span class="tag">lifting</span>
    </div>
  </section>

  <aside class="panel">
    <div class="row"><span class="k">Film</span><span class="v">50 &micro;m</span></div>
    <div class="row"><span class="k">Angle</span><span class="v">62&deg;</span></div>
    <div class="row"><span class="k">Hologram</span><span class="v">rainbow</span></div>
    <div class="row"><span class="k">Adhesive</span><span class="v">static</span></div>
  </aside>

  <footer class="legend">
    <span class="key"><i class="sw sw-cy"></i>cyan</span>
    <span class="key"><i class="sw sw-mg"></i>magenta</span>
    <span class="key"><i class="sw sw-li"></i>lime</span>
    <span class="readout">peel 7 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
