<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blueprint Drafting Lines</title>
<meta name="description" content="A technical sheet draws itself on cyanotype paper: outlines extend, dimension lines snap in with arrowheads, section marks and annotations light up in sequence before the whole drawing is wiped and redrawn.">
<meta name="description-es" content="Una lámina técnica se dibuja sola sobre papel cianotipo: los contornos se extienden, las cotas encajan con sus flechas y las marcas de sección y anotaciones se encienden en orden antes de que el dibujo se borre y vuelva a empezar.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="sheet">
  <div class="field" aria-hidden="true"></div>

  <article class="plan" aria-hidden="true">
    <span class="ln s1"></span>
    <span class="ln s2"></span>
    <span class="ln s3"></span>
    <span class="ln s4"></span>
    <span class="ln s5"></span>
    <span class="ln s6"></span>
    <span class="ln s7"></span>
    <span class="ln s8"></span>
    <span class="ln s9"></span>
    <span class="ln s10"></span>
    <span class="ln s11"></span>
    <span class="ln s12"></span>
    <span class="ln s13"></span>
    <span class="ln s14"></span>
    <span class="ln s15"></span>
    <span class="ln s16"></span>

    <span class="arc a1"></span>
    <span class="arc a2"></span>
    <span class="arc a3"></span>

    <span class="dim d1"><i>4 200</i></span>
    <span class="dim d2"><i>2 850</i></span>
    <span class="dim d3"><i>1 100</i></span>
    <span class="dim d4"><i>640</i></span>

    <span class="sec q1">A</span>
    <span class="sec q2">B</span>
    <span class="sec q3">C</span>

    <span class="mark m1"></span>
    <span class="mark m2"></span>
    <span class="mark m3"></span>
  </article>

  <header class="head">
    <p class="kicker">Drawing no. 07 / scale 1:50</p>
    <h1>Blueprint Drafting Lines</h1>
    <p class="lede">The pen never lifts for long. Sixteen strokes, four dimensions and three section marks, laid down in order, then lifted off the sheet in the same order.</p>
  </header>

  <footer class="legend">
    <span class="key"><i class="sw sw-line"></i>object line</span>
    <span class="key"><i class="sw sw-dim"></i>dimension</span>
    <span class="key"><i class="sw sw-sec"></i>section mark</span>
    <span class="readout">draft 11 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
