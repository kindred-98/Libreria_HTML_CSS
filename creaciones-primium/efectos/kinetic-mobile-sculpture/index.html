<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kinetic Mobile Sculpture</title>
<meta name="description" content="A hanging mobile breathes in empty space: three arms turn at different rates, each plate swings on its own phase and the shadow on the floor drifts and softens beneath it.">
<meta name="description-es" content="Un móvil suspendido respira en el vacío: tres brazos giran a ritmos distintos, cada lámina se balancea con su propia fase y la sombra del suelo se desplaza y se difumina debajo.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="gallery">
  <div class="wall" aria-hidden="true"></div>

  <section class="mobile" aria-hidden="true">
    <span class="cable top"></span>

    <div class="arm arm1">
      <span class="wire"></span>
      <span class="plate big">
        <i class="disc"></i>
      </span>
    </div>

    <div class="arm arm2">
      <span class="wire"></span>
      <span class="plate mid">
        <i class="disc"></i>
      </span>
    </div>

    <div class="arm arm3">
      <span class="wire"></span>
      <span class="plate small">
        <i class="disc"></i>
      </span>
    </div>

    <span class="cable tail"></span>
  </section>

  <div class="ground" aria-hidden="true">
    <span class="shadow s1"></span>
    <span class="shadow s2"></span>
    <span class="shadow s3"></span>
  </div>

  <header class="head">
    <p class="kicker">Gallery one / piece 07</p>
    <h1>Kinetic Mobile</h1>
    <p class="lede">Nothing is anchored except the first arm. From there the motion is borrowed, and every plate spends its life slightly out of step with the one above.</p>
  </header>

  <footer class="legend">
    <span class="key"><i class="sw sw-black"></i>steel black</span>
    <span class="key"><i class="sw sw-red"></i>signal red</span>
    <span class="key"><i class="sw sw-white"></i>bone plate</span>
    <span class="readout">cycle 17 s &middot; three arms</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
