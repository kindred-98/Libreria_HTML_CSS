<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Darkroom Tray Develop</title>
<meta name="description" content="A contact print emerges from milkiness to a full tonal image inside a developing tray, shown beside the untouched frame, with a fixer wash resetting the cycle and bubbles rising through the chemistry.">
<meta name="description-es" content="Una copia de contacto emerge de la lechosa hasta una imagen tonal completa dentro de una bandeja de revelado, junto a la copia intacta, con un baño de fijador que reinicia el ciclo y burbujas que suben por la química.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="room">
  <div class="safelight" aria-hidden="true"></div>
  <div class="bench" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <p class="kicker">Darkroom / print 12</p>
      <h1>Tray Develop</h1>
    </div>
    <div class="lamp"><i class="led"></i><span>safelight on</span></div>
  </header>

  <div class="rig">
    <figure class="panel raw">
      <div class="sheet">
        <div class="photo ghost" aria-hidden="true">
          <span class="sky"></span>
          <span class="sun"></span>
          <span class="ridge r1"></span>
          <span class="ridge r2"></span>
          <span class="water"></span>
          <span class="glint"></span>
          <span class="bird"></span>
        </div>
        <span class="frame">12</span>
        <span class="state">not developed</span>
      </div>
      <figcaption>virgin frame</figcaption>
    </figure>

    <div class="divider" aria-hidden="true">
      <span class="bar"></span>
      <span class="grip g1"></span>
      <span class="grip g2"></span>
      <span class="grip g3"></span>
    </div>

    <figure class="panel tray">
      <div class="chem">
        <span class="fluid"></span>
        <span class="bub b1"></span>
        <span class="bub b2"></span>
        <span class="bub b3"></span>
        <span class="bub b4"></span>
        <span class="bub b5"></span>
        <span class="bub b6"></span>
      </div>
      <div class="printwrap">
        <div class="print">
          <div class="photo">
            <span class="sky"></span>
            <span class="sun"></span>
            <span class="ridge r1"></span>
            <span class="ridge r2"></span>
            <span class="water"></span>
            <span class="glint"></span>
            <span class="bird"></span>
          </div>
          <div class="emul" aria-hidden="true"></div>
          <div class="sheen" aria-hidden="true"></div>
          <div class="fixer" aria-hidden="true"></div>
        </div>
      </div>
      <figcaption>developer 1+9 / 20&deg;C</figcaption>
    </figure>
  </div>

  <aside class="notes" aria-hidden="true">
    <span class="line l1">frame 12 in tray</span>
    <span class="line l2">agitate 10 s</span>
    <span class="line l3">density rising</span>
    <span class="line l4">fix 4 min</span>
  </aside>

  <div class="tong" aria-hidden="true">
    <span class="arm a1"></span>
    <span class="arm a2"></span>
  </div>

  <footer class="legend">
    <span class="key"><i class="sw sw-milk"></i>milky base</span>
    <span class="key"><i class="sw sw-ink"></i>silver image</span>
    <span class="key"><i class="sw sw-safe"></i>safelight</span>
    <span class="readout">cycle 9 s &middot; continuous</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
