<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bungee Jelly Type</title>
<meta name="description" content="Six gelatinous display letters drop onto a printed poster one after another, stretching on impact, squashing on the rebound and settling while a vermilion spot marks every landing.">
<meta name="description-es" content="Seis letras de display gelatinosas caen una a una sobre un cartel impreso, estirándose al golpear, aplastándose en el rebote y asentándose mientras una mancha bermellón marca cada impacto.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wall">
  <div class="light" aria-hidden="true"></div>

  <section class="poster">
    <span class="tape t1" aria-hidden="true"></span>
    <span class="tape t2" aria-hidden="true"></span>

    <p class="kicker">Kinetic type specimen / plate 06</p>

    <div class="disc" aria-hidden="true"></div>

    <h1 class="word">
      <b style="--i:0"><s style="--i:0">W</s>W</b>
      <b style="--i:1"><s style="--i:1">O</s>O</b>
      <b style="--i:2"><s style="--i:2">B</s>B</b>
      <b style="--i:3"><s style="--i:3">B</s>B</b>
      <b style="--i:4"><s style="--i:4">L</s>L</b>
      <b style="--i:5"><s style="--i:5">E</s>E</b>
    </h1>

    <div class="splats" aria-hidden="true">
      <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i>
      <i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i>
    </div>

    <p class="meta">gelatinous display &middot; 6 letters &middot; bounce 1.94 s</p>

    <div class="rule" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </section>

  <div class="marks" aria-hidden="true">
    <i class="m1"></i><i class="m2"></i><i class="m3"></i><i class="m4"></i>
  </div>

  <footer class="hud">
    <span class="stat"><i>Material</i>gelatin 210 g</span>
    <span class="stat"><i>Drop</i>1.20 m</span>
    <span class="stat"><i>Rebound</i>0.74</span>
    <span class="mark">loop 5.4 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
