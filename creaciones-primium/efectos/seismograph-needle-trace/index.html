<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seismograph Needle Trace</title>
<meta name="description" content="A drum seismograph pulls milimetre paper under a swinging stylus, plotting a live tremor trace with time marks, amplitude calipers and a pen carriage that drifts along the drum.">
<meta name="description-es" content="Un sismógrafo de tambor hace avanzar papel milimetrado bajo un estilete que oscila, trazando una tremor en vivo con marcas de tiempo, calibres de amplitud y un carro que avanza por el tambor.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="lab">
  <div class="wall" aria-hidden="true"></div>

  <header class="top">
    <p class="kicker">Station 04 / drum recorder</p>
    <h1>Seismograph Needle Trace</h1>
    <p class="lede">The paper moves left to right at a fixed rate; the stylus is the only thing that talks. Amplitude is drawn to scale and the carriage creeps down as the writing continues.</p>
  </header>

  <section class="rig">
    <div class="drum">
      <span class="flange left"></span>
      <span class="flange right"></span>
      <div class="paper">
        <span class="grid gx"></span>
        <span class="grid gy"></span>
        <span class="trace">
          <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i>
          <i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i>
          <i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i>
          <i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i><i style="--i:15"></i>
          <i style="--i:16"></i><i style="--i:17"></i><i style="--i:18"></i><i style="--i:19"></i>
          <i style="--i:20"></i><i style="--i:21"></i><i style="--i:22"></i><i style="--i:23"></i>
          <i style="--i:24"></i><i style="--i:25"></i><i style="--i:26"></i><i style="--i:27"></i>
          <i style="--i:28"></i><i style="--i:29"></i>
        </span>
        <span class="pen"></span>
        <span class="marks">
          <b style="--i:0"></b><b style="--i:1"></b><b style="--i:2"></b><b style="--i:3"></b>
          <b style="--i:4"></b><b style="--i:5"></b><b style="--i:6"></b><b style="--i:7"></b>
        </span>
      </div>
    </div>

    <div class="caliper" aria-hidden="true">
      <span class="arm a1"></span>
      <span class="arm a2"></span>
      <span class="scale">
        <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i>
        <i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i>
        <i style="--i:6"></i><i style="--i:7"></i>
      </span>
    </div>
  </section>

  <div class="readout">
    <span class="stat"><i>Magnitude</i><span>2.9</span></span>
    <span class="stat"><i>Amplitude</i><span>4.2 mm</span></span>
    <span class="stat"><i>Paper speed</i><span>24 mm/min</span></span>
    <span class="stat"><i>Gain</i><span>x40</span></span>
    <span class="mark">continuous 10 s</span>
  </div>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
