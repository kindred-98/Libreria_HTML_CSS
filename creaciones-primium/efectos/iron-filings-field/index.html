<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iron Filings Field</title>
<meta name="description" content="Iron filings scattered on a steel bench snap into the lines of a magnetic field, re-sorting between four magnet configurations while the bar magnet turns on its mount.">
<meta name="description-es" content="Las limaduras de hierro esparcidas sobre una mesa de acero se ordenan en las líneas de un campo magnético, reordenándose entre cuatro configuraciones mientras el imán de barra gira sobre su soporte.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="bench">
  <div class="steel" aria-hidden="true"></div>

  <header class="top">
    <p class="kicker">Magnetics bench / powder test 3</p>
    <h1>Iron Filings Field</h1>
    <p class="lede">Four hundred filings, one magnet, and the field redraws itself each time the poles swap. Watch the pattern lock, hold and dissolve.</p>
  </header>

  <section class="stage">
    <div class="pad" aria-hidden="true">
      <div class="grainfill">
        <i style="--x:4%;--y:8%;--a:20deg"></i><i style="--x:9%;--y:14%;--a:78deg"></i>
        <i style="--x:13%;--y:6%;--a:44deg"></i><i style="--x:17%;--y:18%;--a:12deg"></i>
        <i style="--x:22%;--y:9%;--a:96deg"></i><i style="--x:26%;--y:21%;--a:32deg"></i>
        <i style="--x:30%;--y:5%;--a:66deg"></i><i style="--x:34%;--y:16%;--a:8deg"></i>
        <i style="--x:38%;--y:11%;--a:52deg"></i><i style="--x:42%;--y:24%;--a:86deg"></i>
        <i style="--x:46%;--y:7%;--a:24deg"></i><i style="--x:50%;--y:19%;--a:58deg"></i>
        <i style="--x:54%;--y:12%;--a:16deg"></i><i style="--x:58%;--y:26%;--a:74deg"></i>
        <i style="--x:62%;--y:4%;--a:38deg"></i><i style="--x:66%;--y:17%;--a:90deg"></i>
        <i style="--x:70%;--y:9%;--a:28deg"></i><i style="--x:74%;--y:22%;--a:64deg"></i>
        <i style="--x:78%;--y:13%;--a:6deg"></i><i style="--x:82%;--y:6%;--a:48deg"></i>
        <i style="--x:86%;--y:19%;--a:80deg"></i><i style="--x:90%;--y:10%;--a:34deg"></i>
        <i style="--x:94%;--y:15%;--a:70deg"></i><i style="--x:7%;--y:27%;--a:42deg"></i>
        <i style="--x:20%;--y:31%;--a:18deg"></i><i style="--x:36%;--y:33%;--a:84deg"></i>
        <i style="--x:52%;--y:30%;--a:26deg"></i><i style="--x:68%;--y:35%;--a:60deg"></i>
        <i style="--x:84%;--y:31%;--a:14deg"></i><i style="--x:15%;--y:40%;--a:76deg"></i>
        <i style="--x:44%;--y:41%;--a:36deg"></i><i style="--x:72%;--y:43%;--a:92deg"></i>
        <i style="--x:29%;--y:48%;--a:22deg"></i><i style="--x:88%;--y:49%;--a:68deg"></i>
        <i style="--x:58%;--y:46%;--a:8deg"></i><i style="--x:11%;--y:52%;--a:54deg"></i>
      </div>

      <div class="fieldlines">
        <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i>
        <i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i>
        <i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i>
      </div>

      <div class="magnet">
        <span class="pole north">N</span>
        <span class="bar"></span>
        <span class="pole south">S</span>
      </div>
    </div>

    <div class="rim" aria-hidden="true"></div>
  </section>

  <aside class="panel">
    <div class="row"><span class="k">Filings</span><span class="v">400</span></div>
    <div class="row"><span class="k">Pattern</span><span class="v" id="pat">dipole</span></div>
    <div class="row"><span class="k">Flux</span><span class="v">0.42 T</span></div>
    <div class="row"><span class="k">Lock</span><span class="v">steady</span></div>
  </aside>

  <footer class="legend">
    <span class="key"><i class="sw sw-n"></i>north pole</span>
    <span class="key"><i class="sw sw-s"></i>south pole</span>
    <span class="key"><i class="sw sw-f"></i>field line</span>
    <span class="readout">resort every 7.2 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
