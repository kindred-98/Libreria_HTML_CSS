<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Letterpress Deboss Type</title>
<meta name="description" content="A word is pressed into cotton paper by a platen that comes down on every beat: the bite deepens, ink coverage thickens and a light bar rakes across the impression while the side panel tracks the press settings.">
<meta name="description-es" content="Una palabra se imprime en papel de algodón con un platén que baja en cada golpe: la mordida se hunde, la tinta se espesa y una barra de luz barre la impresión mientras el panel lateral marca los ajustes de la prensa.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="press">
  <div class="shop" aria-hidden="true"></div>

  <section class="paper">
    <span class="platen" aria-hidden="true"></span>

    <p class="head">Press proof / no.14</p>

    <h1 class="word">
      <b style="--i:0">I</b><b style="--i:1">M</b><b style="--i:2">P</b><b style="--i:3">R</b>
      <b style="--i:4">E</b><b style="--i:5">S</b><b style="--i:6">S</b><b style="--i:7">I</b>
      <b style="--i:8">O</b><b style="--i:9">N</b>
    </h1>

    <p class="sub">deep impression &middot; cotton rag 300 g &middot; one hit</p>

    <span class="raking" aria-hidden="true"></span>
    <span class="fibre" aria-hidden="true"></span>
    <span class="plate" aria-hidden="true"></span>
  </section>

  <aside class="panel">
    <div class="gauge">
      <span class="g-label">Pressure</span>
      <span class="g-bar"><i style="--v:.78"></i></span>
      <span class="g-val">78 %</span>
    </div>
    <div class="gauge">
      <span class="g-label">Bite depth</span>
      <span class="g-bar"><i style="--v:.62"></i></span>
      <span class="g-val">0.62 pt</span>
    </div>
    <div class="gauge">
      <span class="g-label">Ink film</span>
      <span class="g-bar"><i style="--v:.84"></i></span>
      <span class="g-val">2.1 &micro;m</span>
    </div>
    <div class="gauge">
      <span class="g-label">Drying</span>
      <span class="g-bar"><i style="--v:.35"></i></span>
      <span class="g-val">0.35</span>
    </div>

    <div class="counter">
      <span class="k">Impressions</span>
      <span class="v">1 4 2 7</span>
    </div>

    <p class="note">the platen never rests, the paper never moves</p>
  </aside>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
