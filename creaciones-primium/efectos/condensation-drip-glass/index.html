<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Condensation Drip Glass</title>
<meta name="description" content="A cold glass sweats on a warm afternoon: beads gather, swell, break loose and run down leaving a clean track through the fog, over a blurred table of fruit and cloth.">
<meta name="description-es" content="Un vaso frío transpira en una tarde cálida: las gotas se juntan, engordan, se despegan y resbalan dejando un rastro limpio en la niebla, sobre una mesa desenfocada de fruta y tela.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="photo">
  <div class="scene" aria-hidden="true">
    <span class="warm"></span>
    <span class="cloth"></span>
    <span class="fruit f1"></span>
    <span class="fruit f2"></span>
    <span class="fruit f3"></span>
    <span class="bokeh b1"></span>
    <span class="bokeh b2"></span>
    <span class="bokeh b3"></span>
    <span class="bokeh b4"></span>
    <span class="bokeh b5"></span>
    <span class="bokeh b6"></span>
  </div>

  <div class="glass" aria-hidden="true">
    <span class="body">
      <span class="water"></span>
      <span class="fog"></span>

      <span class="beads">
        <i style="--x:14%;--y:12%;--s:7px"></i><i style="--x:32%;--y:20%;--s:5px"></i>
        <i style="--x:52%;--y:9%;--s:8px"></i><i style="--x:70%;--y:24%;--s:6px"></i>
        <i style="--x:24%;--y:34%;--s:9px"></i><i style="--x:44%;--y:40%;--s:5px"></i>
        <i style="--x:64%;--y:46%;--s:7px"></i><i style="--x:82%;--y:38%;--s:6px"></i>
        <i style="--x:18%;--y:58%;--s:6px"></i><i style="--x:38%;--y:66%;--s:8px"></i>
        <i style="--x:60%;--y:72%;--s:5px"></i><i style="--x:80%;--y:66%;--s:7px"></i>
        <i style="--x:28%;--y:84%;--s:6px"></i><i style="--x:50%;--y:88%;--s:9px"></i>
        <i style="--x:72%;--y:90%;--s:5px"></i><i style="--x:88%;--y:80%;--s:6px"></i>
      </span>

      <span class="runs">
        <i style="--x:22%;--dl:-1s;--d:6.4s"></i>
        <i style="--x:46%;--dl:-3.4s;--d:7.6s"></i>
        <i style="--x:68%;--dl:-5.2s;--d:8.4s"></i>
        <i style="--x:84%;--dl:-2.2s;--d:6.9s"></i>
      </span>

      <span class="trails">
        <i style="--x:22%"></i><i style="--x:46%"></i><i style="--x:68%"></i><i style="--x:84%"></i>
      </span>

      <span class="shine"></span>
      <span class="lip"></span>
    </span>
  </div>

  <header class="head">
    <p class="kicker">Table study / 26&deg;C air, 6&deg;C glass</p>
    <h1>Condensation Drip Glass</h1>
  </header>

  <footer class="plate">
    <span class="cap">Cold glass, warm room</span>
    <span class="meta">85 mm &middot; f2.8 &middot; 1/125 &middot; iso 400</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
  <span class="vign" aria-hidden="true"></span>
</main>
</body>
</html>
