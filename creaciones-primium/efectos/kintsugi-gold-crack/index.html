<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kintsugi Gold Crack</title>
<meta name="description" content="Three broken ceramics mend themselves seam by seam: the crack runs across the glaze and gold floods the line, then the metal cools and dims while the next piece takes its turn.">
<meta name="description-es" content="Tres cerámicas rotas se reparan costura a costura: la grieta recorre el esmalte y el oro inunda la línea, luego el metal se enfría y se apaga mientras la siguiente pieza empieza su turno.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shelf">
  <div class="room" aria-hidden="true"></div>
  <div class="spot" aria-hidden="true"></div>

  <header class="top">
    <p class="kicker">Repair study / gold lacquer</p>
    <h1>Kintsugi Gold Crack</h1>
    <p class="lede">A break is not a defect, it is a joint. Each piece is re-stitched by the same hand and the metal is still warm when it settles.</p>
  </header>

  <section class="row">
    <article class="piece bowl" style="--d:0s">
      <span class="body">
        <span class="glaze"></span>
        <span class="crack">
          <i style="--a:24deg;--x:12%;--y:34%;--w:52%;--n:0"></i>
          <i style="--a:58deg;--x:38%;--y:20%;--w:44%;--n:1"></i>
          <i style="--a:-14deg;--x:26%;--y:58%;--w:58%;--n:2"></i>
          <i style="--a:76deg;--x:52%;--y:44%;--w:34%;--n:3"></i>
          <i style="--a:8deg;--x:8%;--y:66%;--w:40%;--n:4"></i>
        </span>
        <span class="shard s1"></span>
        <span class="shard s2"></span>
      </span>
      <span class="base"></span>
      <span class="label"><i>01</i>bowl</span>
    </article>

    <article class="piece plate" style="--d:1.2s">
      <span class="body">
        <span class="glaze"></span>
        <span class="crack">
          <i style="--a:36deg;--x:10%;--y:28%;--w:46%;--n:0"></i>
          <i style="--a:64deg;--x:44%;--y:34%;--w:40%;--n:1"></i>
          <i style="--a:-8deg;--x:24%;--y:52%;--w:52%;--n:2"></i>
          <i style="--a:82deg;--x:56%;--y:20%;--w:32%;--n:3"></i>
          <i style="--a:12deg;--x:30%;--y:70%;--w:44%;--n:4"></i>
        </span>
        <span class="shard s1"></span>
        <span class="shard s2"></span>
      </span>
      <span class="base"></span>
      <span class="label"><i>02</i>plate</span>
    </article>

    <article class="piece cup" style="--d:2.4s">
      <span class="body">
        <span class="glaze"></span>
        <span class="crack">
          <i style="--a:18deg;--x:16%;--y:24%;--w:48%;--n:0"></i>
          <i style="--a:70deg;--x:42%;--y:40%;--w:36%;--n:1"></i>
          <i style="--a:-20deg;--x:22%;--y:62%;--w:54%;--n:2"></i>
          <i style="--a:48deg;--x:58%;--y:30%;--w:30%;--n:3"></i>
          <i style="--a:6deg;--x:6%;--y:52%;--w:38%;--n:4"></i>
        </span>
        <span class="shard s1"></span>
        <span class="shard s2"></span>
      </span>
      <span class="base"></span>
      <span class="label"><i>03</i>cup</span>
    </article>
  </section>

  <footer class="legend">
    <span class="key"><i class="sw sw-glaze"></i>celadon glaze</span>
    <span class="key"><i class="sw sw-gold"></i>gold seam</span>
    <span class="key"><i class="sw sw-break"></i>break</span>
    <span class="readout">mend cycle 6.4 s &middot; staggered 1.2 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
