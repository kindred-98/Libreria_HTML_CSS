<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinyl Groove Sheen</title>
<meta name="description" content="A record turns on a felt mat while a light bar sweeps the grooves, the label text rotates past the lamp and the tonearm creeps inward as the stylus reaches the run-out groove.">
<meta name="description-es" content="Un disco gira sobre un fieltro mientras una barra de luz recorre los surcos, el texto de la etiqueta pasa bajo la lámpara y el brazo se desplaza hacia dentro cuando el estilete llega al surco de salida.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="deck">
  <div class="room" aria-hidden="true"></div>

  <header class="top">
    <p class="kicker">Deck 02 / direct drive</p>
    <h1>Vinyl Groove Sheen</h1>
  </header>

  <section class="stage">
    <div class="plinth" aria-hidden="true"></div>

    <div class="platter">
      <div class="disc">
        <span class="grooves"></span>
        <span class="land l1"></span>
        <span class="land l2"></span>
        <span class="land l3"></span>
        <span class="label">
          <span class="t1">SIDE A</span>
          <span class="t2">NIGHT</span>
          <span class="t3">33 rpm</span>
          <span class="ring"></span>
        </span>
        <span class="spindle"></span>
        <span class="sheen"></span>
      </div>
      <span class="mat"></span>
    </div>

    <div class="tonearm" aria-hidden="true">
      <span class="pivot"></span>
      <span class="tube"></span>
      <span class="headshell"></span>
      <span class="stylus"></span>
      <span class="counter"></span>
    </div>

    <div class="lamp" aria-hidden="true">
      <span class="bar"></span>
    </div>

    <div class="motes" aria-hidden="true">
      <i style="--x:12%;--y:24%"></i><i style="--x:26%;--y:62%"></i>
      <i style="--x:41%;--y:18%"></i><i style="--x:58%;--y:70%"></i>
      <i style="--x:72%;--y:32%"></i><i style="--x:86%;--y:58%"></i>
    </div>
  </section>

  <aside class="panel">
    <div class="row"><span class="k">Speed</span><span class="v">33 1/3</span></div>
    <div class="row"><span class="k">Radius</span><span class="v">150 mm</span></div>
    <div class="row"><span class="k">Arm</span><span class="v">tracking</span></div>
    <div class="row"><span class="k">Side</span><span class="v">A</span></div>
  </aside>

  <footer class="legend">
    <span class="key"><i class="sw sw-sheen"></i>specular sweep</span>
    <span class="key"><i class="sw sw-gold"></i>label</span>
    <span class="key"><i class="sw sw-arm"></i>tonearm</span>
    <span class="readout">platter 1.8 s per turn</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
