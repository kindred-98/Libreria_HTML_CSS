<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rain Slick Asphalt</title>
<meta name="description" content="A night street under rain: headlights and signals stretch into long smears on the wet asphalt, puddles ring with concentric ripples and cold mist rolls over the kerb.">
<meta name="description-es" content="Una calle nocturna bajo la lluvia: los faros y los semáforos se estiran en manchas largas sobre el asfalto mojado, los charcos suenan con ondas concéntricas y la niebla fría pasa por la acera.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="street">
  <div class="sky" aria-hidden="true"></div>

  <div class="buildings" aria-hidden="true">
    <span class="b b1"></span><span class="b b2"></span><span class="b b3"></span>
    <span class="b b4"></span><span class="b b5"></span><span class="b b6"></span>
    <span class="windows">
      <i style="--x:6%;--y:12%"></i><i style="--x:18%;--y:26%"></i><i style="--x:30%;--y:9%"></i>
      <i style="--x:44%;--y:20%"></i><i style="--x:56%;--y:13%"></i><i style="--x:70%;--y:28%"></i>
      <i style="--x:84%;--y:10%"></i><i style="--x:12%;--y:38%"></i><i style="--x:38%;--y:34%"></i>
      <i style="--x:64%;--y:40%"></i><i style="--x:90%;--y:32%"></i>
    </span>
  </div>

  <div class="signals" aria-hidden="true">
    <span class="lamp pole1"><i></i></span>
    <span class="lamp pole2"><i></i></span>
    <span class="traffic"><b></b><b></b><b></b></span>
  </div>

  <div class="road" aria-hidden="true">
    <span class="kerb"></span>
    <span class="wet"></span>

    <div class="pools">
      <span class="pool p1"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i></span>
      <span class="pool p2"><i style="--n:0"></i><i style="--n:1"></i></span>
      <span class="pool p3"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i></span>
      <span class="pool p4"><i style="--n:0"></i></span>
    </div>

    <div class="smears">
      <span class="smear m1"></span>
      <span class="smear m2"></span>
      <span class="smear m3"></span>
      <span class="smear m4"></span>
      <span class="smear m5"></span>
    </div>

    <span class="dashes" aria-hidden="true"></span>
  </div>

  <div class="mist" aria-hidden="true">
    <span class="m1"></span><span class="m2"></span><span class="m3"></span>
  </div>

  <header class="head">
    <p class="kicker">22:40 / wet tarmac</p>
    <h1>Rain Slick Asphalt</h1>
  </header>

  <footer class="legend">
    <span class="key"><i class="sw sw-amber"></i>sodium lamp</span>
    <span class="key"><i class="sw sw-red"></i>signal</span>
    <span class="key"><i class="sw sw-white"></i>headlight</span>
    <span class="readout">rain 8 mm/h &middot; 7 s loop</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
