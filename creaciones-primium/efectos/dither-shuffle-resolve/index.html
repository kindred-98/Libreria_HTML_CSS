<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dither Shuffle Resolve</title>
<meta name="description" content="An ordered dither pattern shuffles in a ring of reflections around the subject: pixels trade places until a figure resolves in the middle, then the whole ring spins and starts over.">
<meta name="description-es" content="Un tramado ordenado baraja los píxeles en un anillo de reflejos alrededor del sujeto: las casillas se intercambian hasta que una figura aparece en el centro, y el anillo gira y vuelve a empezar.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="lab">
  <div class="back" aria-hidden="true"></div>

  <section class="kaleido">
    <div class="ring" aria-hidden="true">
      <span class="wedge w1"></span>
      <span class="wedge w2"></span>
      <span class="wedge w3"></span>
      <span class="wedge w4"></span>
      <span class="wedge w5"></span>
      <span class="wedge w6"></span>
      <span class="wedge w7"></span>
      <span class="wedge w8"></span>
    </div>

    <div class="shards" aria-hidden="true">
      <b style="--a:0deg;--d:0s"></b>
      <b style="--a:30deg;--d:.24s"></b>
      <b style="--a:60deg;--d:.48s"></b>
      <b style="--a:90deg;--d:.72s"></b>
      <b style="--a:120deg;--d:.96s"></b>
      <b style="--a:150deg;--d:1.2s"></b>
      <b style="--a:180deg;--d:1.44s"></b>
      <b style="--a:210deg;--d:1.68s"></b>
      <b style="--a:240deg;--d:1.92s"></b>
      <b style="--a:270deg;--d:2.16s"></b>
      <b style="--a:300deg;--d:2.4s"></b>
      <b style="--a:330deg;--d:2.64s"></b>
    </div>

    <div class="core" aria-hidden="true">
      <span class="px p1"></span>
      <span class="px p2"></span>
      <span class="px p3"></span>
      <span class="px p4"></span>
      <span class="px p5"></span>
      <span class="px p6"></span>
      <span class="px p7"></span>
      <span class="px p8"></span>
      <span class="px p9"></span>
      <span class="px p10"></span>
      <span class="px p11"></span>
      <span class="px p12"></span>
      <span class="px p13"></span>
      <span class="px p14"></span>
      <span class="px p15"></span>
      <span class="px p16"></span>
    </div>
  </section>

  <header class="head">
    <p class="kicker">Ordered dither / 4 x 4 Bayer</p>
    <h1>Dither Shuffle Resolve</h1>
    <p class="lede">Sixteen thresholds, no greys. The ring feeds the centre one column at a time until the subject holds together, then loses it again.</p>
  </header>

  <aside class="panel">
    <div class="row"><span class="k">Matrix</span><span class="v">4 x 4</span></div>
    <div class="row"><span class="k">Shards</span><span class="v">12</span></div>
    <div class="row"><span class="k">Core</span><span class="v">4 x 4</span></div>
    <div class="row"><span class="k">Pass</span><span class="v">3.2 s</span></div>
  </aside>

  <footer class="legend">
    <span class="key"><i class="sw sw-bone"></i>on</span>
    <span class="key"><i class="sw sw-black"></i>off</span>
    <span class="key"><i class="sw sw-green"></i>resolve</span>
    <span class="readout">ring 9 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
