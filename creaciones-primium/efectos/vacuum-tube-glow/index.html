<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vacuum Tube Glow</title>
<meta name="description" content="Four amplifier valves sit in a chrome chassis under a showcase light: each cathode lights in turn, the grid brightens with the signal and the glass throws its orange bloom across the metal.">
<meta name="description-es" content="Cuatro válvulas de un amplificador descansan en un chasis cromado bajo la luz de una vitrina: cada cátodo se enciende por turnos, la rejilla brilla con la señal y el vidrio proyecta su halo naranja sobre el metal.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="case">
  <div class="room" aria-hidden="true"></div>
  <div class="spot" aria-hidden="true"></div>

  <header class="head">
    <p class="kicker">Showcase / valve unit 2</p>
    <h1>Vacuum Tube Glow</h1>
  </header>

  <section class="amp">
    <div class="chassis" aria-hidden="true">
      <span class="vent v1"></span><span class="vent v2"></span><span class="vent v3"></span>
      <span class="rail"></span>
      <span class="badge">VALVE AMP &middot; 4 x EL84</span>
    </div>

    <div class="tubes">
      <div class="tube t1" style="--d:0s">
        <span class="glass">
          <span class="plate"></span>
          <span class="grid"></span>
          <span class="filament"></span>
          <span class="cathode"></span>
          <span class="crown"></span>
          <span class="spec"></span>
        </span>
        <span class="socket"></span>
        <span class="pin"></span>
        <span class="bloom"></span>
      </div>

      <div class="tube t2" style="--d:.9s">
        <span class="glass">
          <span class="plate"></span>
          <span class="grid"></span>
          <span class="filament"></span>
          <span class="cathode"></span>
          <span class="crown"></span>
          <span class="spec"></span>
        </span>
        <span class="socket"></span>
        <span class="pin"></span>
        <span class="bloom"></span>
      </div>

      <div class="tube t3" style="--d:1.8s">
        <span class="glass">
          <span class="plate"></span>
          <span class="grid"></span>
          <span class="filament"></span>
          <span class="cathode"></span>
          <span class="crown"></span>
          <span class="spec"></span>
        </span>
        <span class="socket"></span>
        <span class="pin"></span>
        <span class="bloom"></span>
      </div>

      <div class="tube t4" style="--d:2.7s">
        <span class="glass">
          <span class="plate"></span>
          <span class="grid"></span>
          <span class="filament"></span>
          <span class="cathode"></span>
          <span class="crown"></span>
          <span class="spec"></span>
        </span>
        <span class="socket"></span>
        <span class="pin"></span>
        <span class="bloom"></span>
      </div>
    </div>

    <span class="reflection" aria-hidden="true"></span>
  </section>

  <aside class="panel">
    <div class="row"><span class="k">Heater</span><span class="v">6.3 V</span></div>
    <div class="row"><span class="k">Plate</span><span class="v">280 V</span></div>
    <div class="row"><span class="k">Anode</span><span class="v">18 mA</span></div>
    <div class="row"><span class="k">Warm up</span><span class="v">40 s</span></div>
  </aside>

  <footer class="legend">
    <span class="key"><i class="sw sw-hot"></i>cathode</span>
    <span class="key"><i class="sw sw-chrome"></i>chassis</span>
    <span class="key"><i class="sw sw-green"></i>panel</span>
    <span class="readout">heater cycle 9 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
