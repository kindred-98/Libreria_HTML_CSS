<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subway Window Streaks</title>
<meta name="description" content="Tunnel lights drag into long horizontal smears across a train window while the reflection of the carriage stays still behind the glass, with the handrail and the seat backs holding their place.">
<meta name="description-es" content="Las luces del túnel se estiran en manchas horizontales sobre la ventana del vagón mientras el reflejo del interior permanece quieto tras el cristal, con la barandilla y los respaldos en su sitio.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="car">
  <div class="tunnel" aria-hidden="true">
    <span class="band b1"></span>
    <span class="band b2"></span>
    <span class="band b3"></span>
    <span class="lamp l1"></span>
    <span class="lamp l2"></span>
    <span class="lamp l3"></span>
    <span class="lamp l4"></span>
    <span class="lamp l5"></span>
    <span class="lamp l6"></span>
  </div>

  <div class="window">
    <span class="glass" aria-hidden="true"></span>

    <div class="streaks" aria-hidden="true">
      <i style="--y:12%;--w:38%;--d:1.9s;--dl:-.1s"></i>
      <i style="--y:24%;--w:26%;--d:1.4s;--dl:-.5s"></i>
      <i style="--y:37%;--w:44%;--d:2.3s;--dl:-.9s"></i>
      <i style="--y:52%;--w:30%;--d:1.6s;--dl:-1.3s"></i>
      <i style="--y:66%;--w:42%;--d:2.1s;--dl:-.2s"></i>
      <i style="--y:79%;--w:24%;--d:1.5s;--dl:-.7s"></i>
      <i style="--y:90%;--w:36%;--d:2.5s;--dl:-1.1s"></i>
    </div>

    <div class="reflection" aria-hidden="true">
      <span class="rbar"></span>
      <span class="seat s1"></span>
      <span class="seat s2"></span>
      <span class="seat s3"></span>
      <span class="handle h1"></span>
      <span class="handle h2"></span>
      <span class="hand"></span>
      <span class="lampback"></span>
    </div>

    <span class="squeal" aria-hidden="true"></span>
  </div>

  <div class="frame" aria-hidden="true">
    <span class="toprail"></span>
    <span class="bottrail"></span>
    <span class="post left"></span>
    <span class="post right"></span>
  </div>

  <header class="head">
    <p class="kicker">Line 4 / between stations</p>
    <h1>Subway Window Streaks</h1>
  </header>

  <aside class="panel">
    <div class="row"><span class="k">Speed</span><span class="v">58 km/h</span></div>
    <div class="row"><span class="k">Line</span><span class="v">4</span></div>
    <div class="row"><span class="k">Tunnel</span><span class="v">wet</span></div>
    <div class="row"><span class="k">Window</span><span class="v">tempered</span></div>
  </aside>

  <footer class="legend">
    <span class="key"><i class="sw sw-lamp"></i>tunnel lamp</span>
    <span class="key"><i class="sw sw-refl"></i>carriage reflection</span>
    <span class="key"><i class="sw sw-steel"></i>steel</span>
    <span class="readout">run 4.6 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
