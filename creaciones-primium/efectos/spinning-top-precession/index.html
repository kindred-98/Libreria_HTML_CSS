<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spinning Top Precession</title>
<meta name="description" content="A brass top spins on a laboratory bench: its stem leans while the whole body traces a slow cone, the contact shadow tightens and stretches with the tilt and the point tracks a worn circle in the wood.">
<meta name="description-es" content="Una peonza de latón gira sobre una mesa de laboratorio: el vástago se inclina mientras el cuerpo traza un cono lento, la sombra de contacto se estira con la inclinación y la punta dibuja un círculo desgastado en la madera.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="bench">
  <div class="room" aria-hidden="true"></div>
  <div class="table" aria-hidden="true"></div>

  <section class="stage">
    <span class="worn" aria-hidden="true"></span>

    <div class="top">
      <span class="cone" aria-hidden="true"></span>
      <span class="shadow" aria-hidden="true"></span>
      <span class="stem" aria-hidden="true"></span>
      <span class="body" aria-hidden="true">
        <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i>
        <i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i>
        <i style="--i:6"></i><i style="--i:7"></i>
      </span>
      <span class="handle" aria-hidden="true"></span>
      <span class="glint" aria-hidden="true"></span>
    </div>

    <span class="ring" aria-hidden="true"></span>
  </section>

  <header class="head">
    <p class="kicker">Gyroscope bench / brass 41 g</p>
    <h1>Spinning Top Precession</h1>
  </header>

  <aside class="panel">
    <div class="row"><span class="k">Spin</span><span class="v">6.4 rev/s</span></div>
    <div class="row"><span class="k">Precession</span><span class="v">0.42 s</span></div>
    <div class="row"><span class="k">Tilt</span><span class="v">14&deg;</span></div>
    <div class="row"><span class="k">Contact</span><span class="v">steady</span></div>
  </aside>

  <footer class="legend">
    <span class="key"><i class="sw sw-brass"></i>brass</span>
    <span class="key"><i class="sw sw-green"></i>bottle green</span>
    <span class="key"><i class="sw sw-wood"></i>bench top</span>
    <span class="readout">loop 3.2 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
