<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirrorball Caustic Dance</title>
<meta name="description" content="A mirrored ball turns under a single spotlight in a dark showcase room, throwing cold blue and gold shards that sweep the walls while mirrored caustics crawl across the floor.">
<meta name="description-es" content="Una bola de espejos gira bajo un único foco en una sala de vitrina oscura, lanzando esquirlas azul frío y doradas que barren las paredes mientras las cáusticas se arrastran por el suelo.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="room">
  <div class="walls" aria-hidden="true"></div>

  <div class="cone" aria-hidden="true">
    <span class="beam"></span>
    <span class="bulb"></span>
  </div>

  <div class="ballwrap" aria-hidden="true">
    <div class="ball">
      <span class="cap"></span>
      <div class="facets">
        <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i>
        <i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i>
        <i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i>
        <i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i><i style="--i:15"></i>
        <i style="--i:16"></i><i style="--i:17"></i><i style="--i:18"></i><i style="--i:19"></i>
        <i style="--i:20"></i><i style="--i:21"></i><i style="--i:22"></i><i style="--i:23"></i>
        <i style="--i:24"></i><i style="--i:25"></i><i style="--i:26"></i><i style="--i:27"></i>
        <i style="--i:28"></i><i style="--i:29"></i><i style="--i:30"></i><i style="--i:31"></i>
      </div>
      <span class="sweep"></span>
    </div>
    <span class="stem"></span>
  </div>

  <div class="shards" aria-hidden="true">
    <b style="--x:8%;--y:14%;--d:4.6s;--dl:-.4s"></b>
    <b style="--x:18%;--y:52%;--d:5.4s;--dl:-2.2s"></b>
    <b style="--x:26%;--y:26%;--d:4.2s;--dl:-1.1s"></b>
    <b style="--x:34%;--y:64%;--d:6.1s;--dl:-3.4s"></b>
    <b style="--x:44%;--y:20%;--d:4.9s;--dl:-.8s"></b>
    <b style="--x:52%;--y:58%;--d:5.8s;--dl:-2.7s"></b>
    <b style="--x:60%;--y:32%;--d:4.4s;--dl:-1.6s"></b>
    <b style="--x:68%;--y:70%;--d:6.4s;--dl:-4s"></b>
    <b style="--x:76%;--y:18%;--d:4.7s;--dl:-.2s"></b>
    <b style="--x:84%;--y:48%;--d:5.6s;--dl:-3.1s"></b>
    <b style="--x:92%;--y:30%;--d:5.1s;--dl:-1.9s"></b>
    <b style="--x:14%;--y:78%;--d:6.2s;--dl:-4.4s"></b>
    <b style="--x:38%;--y:8%;--d:4.8s;--dl:-2.5s"></b>
    <b style="--x:64%;--y:82%;--d:5.9s;--dl:-.6s"></b>
    <b style="--x:88%;--y:66%;--d:4.3s;--dl:-3.6s"></b>
  </div>

  <div class="floor" aria-hidden="true">
    <div class="caustics">
      <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i>
      <i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i>
      <i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i>
      <i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i><i style="--i:15"></i>
    </div>
    <span class="pool"></span>
    <span class="contact"></span>
  </div>

  <header class="top">
    <p class="kicker">Showcase / ballroom test</p>
    <h1>Mirrorball Caustic Dance</h1>
  </header>

  <aside class="panel">
    <div class="row"><span class="k">Ball</span><span class="v">32 in</span></div>
    <div class="row"><span class="k">Facets</span><span class="v">32 mirror</span></div>
    <div class="row"><span class="k">Speed</span><span class="v">12 rpm</span></div>
    <div class="row"><span class="k">Shards live</span><span class="v">16</span></div>
  </aside>

  <footer class="legend">
    <span class="key"><i class="sw sw-gold"></i>gold flash</span>
    <span class="key"><i class="sw sw-cold"></i>cold flash</span>
    <span class="key"><i class="sw sw-caustic"></i>floor caustic</span>
    <span class="readout">turn 7 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
