<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadow Puppet Theatre</title>
<meta name="description" content="Behind a lit parchment screen a hand shadows perform: a bird crosses the stage, becomes a fish, and resolves into an open palm, while the lamp behind it breathes and dust hangs in the beam.">
<meta name="description-es" content="Tras una pantalla de pergamino iluminada, sombras de mano representan: un pájaro cruza el escenario, se convierte en un pez y se resuelve en una palma abierta, mientras la lámpara respira y el polvo flota en el haz.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="theatre">
  <div class="house" aria-hidden="true"></div>

  <div class="proscenium">
    <span class="arch"></span>
    <span class="curtain left"></span>
    <span class="curtain right"></span>
    <span class="valance"></span>

    <div class="screen">
      <div class="beam" aria-hidden="true"></div>

      <div class="puppets">
        <span class="figure bird" aria-hidden="true">
          <i style="--x:8%"></i><i style="--x:34%"></i><i style="--x:60%"></i>
        </span>
        <span class="figure fish" aria-hidden="true">
          <i style="--x:6%"></i><i style="--x:36%"></i><i style="--x:66%"></i>
        </span>
        <span class="figure hand" aria-hidden="true">
          <i style="--a:-18deg"></i><i style="--a:-6deg"></i><i style="--a:6deg"></i>
          <i style="--a:18deg"></i><i style="--a:-26deg"></i>
        </span>
      </div>

      <span class="lampglow" aria-hidden="true"></span>
      <span class="motes" aria-hidden="true"></span>
      <span class="weave" aria-hidden="true"></span>
      <span class="vign" aria-hidden="true"></span>
    </div>

    <span class="rail" aria-hidden="true"></span>
  </div>

  <footer class="legend">
    <span class="key"><i class="sw sw-bird"></i>bird</span>
    <span class="key"><i class="sw sw-fish"></i>fish</span>
    <span class="key"><i class="sw sw-hand"></i>hand</span>
    <span class="readout">three acts &middot; 12 s loop</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
