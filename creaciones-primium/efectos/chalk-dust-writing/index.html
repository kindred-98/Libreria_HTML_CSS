<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chalk Dust Writing</title>
<meta name="description" content="Chalk rebuilds a phrase on a slate board letter by letter, dropping dust that drifts down the board, before an eraser sweep wipes the line and the phrase starts again.">
<meta name="description-es" content="La tiza recompone una frase en una pizarra letra a letra, dejando caer polvo que se desliza por la tabla, hasta que una pasada de goma borra la línea y la frase vuelve a empezar.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="slate">
  <div class="wood" aria-hidden="true"></div>

  <section class="board">
    <div class="ghost" aria-hidden="true">
      <span style="--i:0">C</span><span style="--i:1">H</span><span style="--i:2">A</span>
      <span style="--i:3">L</span><span style="--i:4">K</span><span style="--i:5">&nbsp;</span>
      <span style="--i:6">D</span><span style="--i:7">U</span><span style="--i:8">S</span>
      <span style="--i:9">T</span>
    </div>

    <h1 class="line">
      <b style="--i:0">C</b><b style="--i:1">H</b><b style="--i:2">A</b>
      <b style="--i:3">L</b><b style="--i:4">K</b><b style="--i:5" class="sp"></b>
      <b style="--i:6">D</b><b style="--i:7">U</b><b style="--i:8">S</b>
      <b style="--i:9">T</b>
    </h1>

    <span class="smear" aria-hidden="true"></span>

    <div class="dust" aria-hidden="true">
      <i style="--x:16%;--d:4.2s;--dl:-.4s"></i>
      <i style="--x:23%;--d:5.4s;--dl:-1.8s"></i>
      <i style="--x:31%;--d:3.8s;--dl:-3s"></i>
      <i style="--x:38%;--d:6.1s;--dl:-.9s"></i>
      <i style="--x:47%;--d:4.7s;--dl:-2.2s"></i>
      <i style="--x:55%;--d:5.8s;--dl:-4.1s"></i>
      <i style="--x:63%;--d:4.1s;--dl:-.6s"></i>
      <i style="--x:71%;--d:5.2s;--dl:-2.7s"></i>
      <i style="--x:79%;--d:3.6s;--dl:-1.3s"></i>
      <i style="--x:86%;--d:6.4s;--dl:-3.6s"></i>
    </div>

    <div class="hud">
      <span class="stat"><i>Board</i>900 &times; 1200</span>
      <span class="stat"><i>Chalk</i>white, soft</span>
      <span class="stat"><i>Stroke</i>0.4 s per letter</span>
      <span class="mark">cycle 8 s</span>
    </div>
  </section>

  <div class="tray" aria-hidden="true">
    <span class="piece p1"></span>
    <span class="piece p2"></span>
    <span class="felt"></span>
    <span class="eraser"></span>
  </div>

  <p class="note">the sentence is written, wiped and written again</p>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
