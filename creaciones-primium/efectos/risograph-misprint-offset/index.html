<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Risograph Misprint Offset</title>
<meta name="description" content="The same riso print at three scales: fluorescent pink, blue and green ink layers drift out of register by a pixel or three, overprint multiply and a visible halftone screen.">
<meta name="description-es" content="La misma impresión riso a tres escalas: las tintas rosa flúor, azul y verde se descuadran uno o tres píxeles, con sobreimpresión multiplicativa y un tramado visible.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="press">
  <div class="back" aria-hidden="true"></div>

  <header class="head">
    <p class="kicker">Riso 2 colour / proof sheet</p>
    <h1>Misprint Offset</h1>
    <p class="lede">Two drums, two inks, and a registration that is never quite right. The error is drawn three times: tiny, true size, and far too big.</p>
  </header>

  <section class="scales">
    <figure class="size tiny" aria-hidden="true">
      <div class="sheet">
        <span class="ink pink p"></span>
        <span class="ink blue b"></span>
        <span class="art">
          <i class="a1"></i><i class="a2"></i><i class="a3"></i>
        </span>
      </div>
      <figcaption>1:6 &middot; 18 mm</figcaption>
    </figure>

    <figure class="size mid" aria-hidden="true">
      <div class="sheet">
        <span class="ink pink p"></span>
        <span class="ink blue b"></span>
        <span class="art">
          <i class="a1"></i><i class="a2"></i><i class="a3"></i>
        </span>
      </div>
      <figcaption>1:1 &middot; 110 mm</figcaption>
    </figure>

    <figure class="size big" aria-hidden="true">
      <div class="sheet">
        <span class="ink pink p"></span>
        <span class="ink blue b"></span>
        <span class="art">
          <i class="a1"></i><i class="a2"></i><i class="a3"></i>
        </span>
      </div>
      <figcaption>4:1 &middot; 440 mm</figcaption>
    </figure>

    <div class="loupe" aria-hidden="true">
      <span class="glass"></span>
      <span class="cross"></span>
      <span class="trace"></span>
    </div>
  </section>

  <aside class="panel">
    <div class="row"><span class="k">Pink</span><span class="v">+1.4 px</span></div>
    <div class="row"><span class="k">Blue</span><span class="v">-0.6 px</span></div>
    <div class="row"><span class="k">Screen</span><span class="v">65 lpi</span></div>
    <div class="row"><span class="k">Blend</span><span class="v">multiply</span></div>
  </aside>

  <footer class="legend">
    <span class="key"><i class="sw sw-pink"></i>fluorescent pink</span>
    <span class="key"><i class="sw sw-blue"></i>riso blue</span>
    <span class="key"><i class="sw sw-paper"></i>paper</span>
    <span class="readout">drift 6.8 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
