<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Double Exposure Portrait</title>
<meta name="description" content="A portrait silhouette and a forest canopy are exposed on the same sheet, screen blended and rebalanced back and forth so the face dissolves into the trees and returns.">
<meta name="description-es" content="La silueta de un retrato y una bóveda forestal se exponen en la misma hoja, superpuestas y reequilibrándose para que el rostro se disuelva entre los árboles y vuelva.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="dark">
  <div class="wall" aria-hidden="true"></div>

  <section class="sheet">
    <div class="print">
      <div class="layer forest">
        <span class="canopy a"></span>
        <span class="canopy b"></span>
        <span class="canopy c"></span>
        <span class="trunk t1"></span>
        <span class="trunk t2"></span>
        <span class="trunk t3"></span>
        <span class="trunk t4"></span>
        <span class="haze"></span>
      </div>

      <div class="layer sitter">
        <span class="head"></span>
        <span class="hair"></span>
        <span class="shoulders"></span>
        <span class="rim"></span>
      </div>

      <div class="layer second" aria-hidden="true">
        <span class="ghosthead"></span>
        <span class="ghostline"></span>
      </div>

      <span class="dust" aria-hidden="true"></span>
      <span class="edge" aria-hidden="true"></span>
      <span class="flash" aria-hidden="true"></span>
    </div>

    <div class="caption">
      <p class="kicker">Double exposure / 35 mm</p>
      <p class="title">Two Exposures, One Sheet</p>
      <p class="sub">portrait at 1/60 &middot; woodland at 1/250 &middot; f8</p>
    </div>
  </section>

  <aside class="dial">
    <div class="row"><span class="k">Mix A</span><span class="v">50 %</span></div>
    <div class="row"><span class="k">Mix B</span><span class="v">50 %</span></div>
    <div class="row"><span class="k">Frames</span><span class="v">2</span></div>
    <div class="row"><span class="k">Contact</span><span class="v">soft</span></div>
  </aside>

  <footer class="legend">
    <span class="key"><i class="sw sw-forest"></i>woodland</span>
    <span class="key"><i class="sw sw-portrait"></i>portrait</span>
    <span class="key"><i class="sw sw-paper"></i>paper base</span>
    <span class="readout">cross fade 11 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
