<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gobo Pattern Light</title>
<meta name="description" content="A stage gobo turns slowly on a lamp: cut leaves and a broken window throw a moving lace of light across a wall and two figures, with dust hanging in the beam and long shadows stretching behind them.">
<meta name="description-es" content="Un gobo de escenario gira despacio en la lámpara: hojas recortadas y una ventana rota proyectan un encaje de luz que se mueve sobre el muro y dos figuras, con polvo suspendido en el haz y sombras largas detrás.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage">
  <div class="backwall" aria-hidden="true"></div>

  <div class="beam" aria-hidden="true"></div>

  <div class="gobo" aria-hidden="true">
    <span class="leafy"></span>
    <span class="panes"></span>
    <span class="frame"></span>
  </div>

  <div class="wash" aria-hidden="true">
    <span class="p1"></span><span class="p2"></span><span class="p3"></span>
    <span class="p4"></span><span class="p5"></span><span class="p6"></span>
    <span class="p7"></span><span class="p8"></span>
  </div>

  <div class="dust" aria-hidden="true">
    <i style="--x:14%;--y:30%"></i><i style="--x:24%;--y:64%"></i>
    <i style="--x:34%;--y:22%"></i><i style="--x:46%;--y:52%"></i>
    <i style="--x:56%;--y:36%"></i><i style="--x:66%;--y:70%"></i>
    <i style="--x:76%;--y:26%"></i><i style="--x:88%;--y:58%"></i>
    <i style="--x:20%;--y:44%"></i><i style="--x:60%;--y:16%"></i>
  </div>

  <div class="figures" aria-hidden="true">
    <span class="fig f1">
      <i class="head"></i><i class="torso"></i><i class="legs"></i><i class="shadow"></i>
    </span>
    <span class="fig f2">
      <i class="head"></i><i class="torso"></i><i class="legs"></i><i class="shadow"></i>
    </span>
  </div>

  <span class="floor" aria-hidden="true"></span>

  <header class="head">
    <p class="kicker">Gobo 03 / leaves and window</p>
    <h1>Gobo Pattern Light</h1>
  </header>

  <aside class="panel">
    <div class="row"><span class="k">Wheel</span><span class="v">turning</span></div>
    <div class="row"><span class="k">Cut</span><span class="v">2 layers</span></div>
    <div class="row"><span class="k">Throw</span><span class="v">6.2 m</span></div>
    <div class="row"><span class="k">Focus</span><span class="v">soft edge</span></div>
  </aside>

  <footer class="legend">
    <span class="key"><i class="sw sw-warm"></i>key light</span>
    <span class="key"><i class="sw sw-cool"></i>ambient</span>
    <span class="key"><i class="sw sw-shadow"></i>cast shadow</span>
    <span class="readout">turn 14 s</span>
  </footer>

  <span class="grain" aria-hidden="true"></span>
</main>
</body>
</html>
