<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Treasure Map Hunt Card</title>
<meta name="description" content="A treasure hunt game card with a route that draws itself across a burnt parchment chart, an X that pops on the cache, rarity frame, stat bars and a wax sealed ability.">
<meta name="description-es" content="Una carta de tesoro con la ruta que se dibuja sobre un pergamino quemado, la X que aparece en el alijo, marco de rareza, barras de estadísticas y una habilidad sellada en cera.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="stage">
  <article class="tmap" id="tmap">
    <span class="tmap__grain" aria-hidden="true"></span>
    <span class="tmap__light" aria-hidden="true"></span>
    <span class="tmap__sweep" aria-hidden="true"></span>

    <header class="tmap__top">
      <p class="tmap__set">Vault 07 &middot; sector Mallow</p>
      <p class="tmap__rarity"><i aria-hidden="true"></i>Legendary</p>
    </header>

    <h1 class="tmap__title">The Amber Compass</h1>
    <p class="tmap__sub">Cache sealed beneath the third cairn &middot; party of 2 to 4</p>

    <div class="chart">
      <svg class="chart__svg" viewBox="0 0 320 176" aria-hidden="true" focusable="false">
        <path class="chart__land" d="M0 128 L34 112 62 118 96 96 128 104 162 84 196 92 232 66 268 74 300 54 320 60 L320 176 0 176Z"></path>
        <path class="chart__shore" d="M0 128 L34 112 62 118 96 96 128 104 162 84 196 92 232 66 268 74 300 54 320 60"></path>
        <g class="chart__grid">
          <path d="M0 44h320M0 88h320M0 132h320M64 0v176M128 0v176M192 0v176M256 0v176"></path>
        </g>
        <g class="chart__contours">
          <path d="M12 150c40-16 66 6 104-8s58-4 96-18 66-2 96-16"></path>
          <path d="M20 162c44-14 62 4 100-10s62-2 100-16 62 0 88-12"></path>
        </g>
        <g class="rose" transform="translate(40 42)">
          <circle class="rose__ring" r="17"></circle>
          <path class="rose__ray" d="M0-16 4-2 0 0-4-2Z"></path>
          <path class="rose__ray rose__ray--b" d="M16 0 2 4 0 0 2-4Z"></path>
          <path class="rose__ray rose__ray--c" d="M0 16-4 2 0 0 4 2Z"></path>
          <path class="rose__ray rose__ray--d" d="M-16 0-2-4 0 0-2 4Z"></path>
        </g>
        <path class="route" d="M26 146C56 138 76 104 110 100S166 114 194 92 238 56 264 46"></path>
        <g class="waypoint">
          <circle cx="110" cy="100" r="4"></circle>
          <circle cx="194" cy="92" r="4"></circle>
        </g>
        <circle class="digzone" cx="264" cy="46" r="17"></circle>
        <g class="xmark" transform="translate(264 46)">
          <path d="M-9-9 9 9M9-9-9 9"></path>
        </g>
      </svg>
      <p class="chart__cap">Grid ref 41.7 N &middot; soundings in fathoms</p>
    </div>

    <section class="stats" aria-label="Chart statistics">
      <div class="stat">
        <p class="stat__name">Insight</p>
        <p class="stat__val"><span data-count="78">78</span></p>
        <span class="stat__track" aria-hidden="true"><i style="--w:.78"></i></span>
      </div>
      <div class="stat">
        <p class="stat__name">Nerve</p>
        <p class="stat__val"><span data-count="64">64</span></p>
        <span class="stat__track" aria-hidden="true"><i style="--w:.64"></i></span>
      </div>
      <div class="stat">
        <p class="stat__name">Fortune</p>
        <p class="stat__val"><span data-count="52">52</span></p>
        <span class="stat__track" aria-hidden="true"><i style="--w:.52"></i></span>
      </div>
      <div class="stat">
        <p class="stat__name">Ward</p>
        <p class="stat__val"><span data-count="91">91</span></p>
        <span class="stat__track" aria-hidden="true"><i style="--w:.91 is-gold"></i></span>
      </div>
    </section>

    <footer class="tmap__foot">
      <button class="cast" type="button" id="castBtn" aria-pressed="false">
        <span class="cast__ico" aria-hidden="true">
          <svg viewBox="0 0 20 20" focusable="false"><path d="M10 2.5l2.2 4.8 5.3 2.2-5.3 2.2L10 16.5l-2.2-4.8L2.5 9.5l5.3-2.2z"></path></svg>
        </span>
        <span class="cast__text">Unseal the vault</span>
      </button>
      <p class="tmap__log">Last opened 12 Mar by party Vale</p>
      <span class="seal" aria-hidden="true"><b>Sealed</b></span>
    </footer>
  </article>

  <p class="hint">Follow the route &middot; unseal at the cairn</p>
</main>
</body>
</html>
