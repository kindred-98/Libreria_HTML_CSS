<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lisbon Boarding Pass</title>
<meta name="description" content="A Lisbon boarding pass card with an azulejo tile backdrop, a perforated stub, a barcode swept by a scanning beam and gate data that blinks.">
<meta name="description-es" content="Un pase de embarque de Lisboa con fondo de azulejos, talón troquelado, codigo de barras barrido por un haz de escaneo y datos de puerta que parpadean.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="stage">
  <article class="pass" id="pass">
    <span class="pass__sheen" aria-hidden="true"></span>

    <div class="pass__main">
      <header class="pass__head">
        <p class="brand"><span class="brand__mark" aria-hidden="true"></span>Atl&acirc;ntico Air</p>
        <p class="flight"><span>FLIGHT</span>TP 284</p>
      </header>

      <div class="route">
        <div class="port">
          <b>LIS</b>
          <span>Lisbon</span>
          <em>07:35</em>
        </div>
        <div class="route__lane" aria-hidden="true">
          <span class="route__line"><span class="route__track"><svg class="route__plane" viewBox="0 0 24 24" focusable="false"><path d="M2.5 13.2l19-6.4-3.4 6.1 3.4 6.1-19-6.4z"></path><path d="M8.4 12.3l-3.2-4.6 2.2-.6 4.4 3.7"></path><path d="M8.4 13.7l-3.2 4.6 2.2.6 4.4-3.7"></path></svg></span></span>
          <span class="route__time">2 h 45 min</span>
        </div>
        <div class="port port--end">
          <b>OPO</b>
          <span>Porto</span>
          <em>10:20</em>
        </div>
      </div>

      <div class="fields">
        <div class="field">
          <span>GATE</span>
          <strong class="blink" id="gate">B7</strong>
        </div>
        <div class="field">
          <span>SEAT</span>
          <strong class="blink" id="seat">12A</strong>
        </div>
        <div class="field">
          <span>BOARDS</span>
          <strong>06:55</strong>
        </div>
        <div class="field">
          <span>ZONE</span>
          <strong>3</strong>
        </div>
      </div>

      <div class="barcode" id="barcode" aria-hidden="true">
        <span class="barcode__scan"></span>
      </div>
      <p class="barcode__code">M1MARQUES/A &nbsp; LISOP0482 &nbsp; 284 112</p>

      <footer class="pass__foot">
        <span>PASSENGER &middot; A. MARQUES &middot; <span id="stamp">SCANNED 06:41</span></span>
        <button class="scanbtn" type="button" id="scan" aria-label="Scan the boarding pass again">Scan again</button>
      </footer>
    </div>

    <div class="pass__stub">
      <p class="stub__kicker">Boarding</p>
      <p class="stub__seat" id="stubSeat">12A</p>
      <p class="stub__gate">GATE <b id="stubGate">B7</b></p>
      <div class="stub__bars" aria-hidden="true"></div>
      <p class="stub__seq">SEQ 048</p>
    </div>

    <span class="pass__perf" aria-hidden="true"></span>
    <span class="pass__notch pass__notch--top" aria-hidden="true"></span>
    <span class="pass__notch pass__notch--bottom" aria-hidden="true"></span>
  </article>
</main>
</body>
</html>
