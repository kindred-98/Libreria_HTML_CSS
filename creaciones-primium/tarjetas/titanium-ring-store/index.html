<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Titanium Ring Store</title>
<meta name="description" content="A titanium ring product card with a draggable 360 degree view, angle thumbnails, a technical spec sheet and a finish selector that morphs the metal.">
<meta name="description-es" content="Ficha de producto de anillo de titanio con vista 360 girable por arrastre, miniaturas de ángulo, ficha técnica y selector de acabado que transforma el metal.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="stage">
  <article class="product" id="product">
    <span class="product__sweep" aria-hidden="true"></span>

    <header class="product__top">
      <p class="brand"><span class="brand__mark">OF</span>Orbit Forge</p>
      <p class="sku">ALLOY TI-6AL-4V</p>
    </header>

    <div class="viewer" id="viewer" tabindex="0" role="img" aria-label="Titanium ring preview, drag or use the arrow keys to rotate">
      <span class="viewer__halo" aria-hidden="true"></span>
      <span class="viewer__grid" aria-hidden="true"></span>
      <span class="viewer__floor" aria-hidden="true"></span>
      <span class="ring" id="ring" data-finish="brushed" aria-hidden="true"></span>
      <span class="ring__shade" aria-hidden="true"></span>
      <span class="viewer__tag" aria-hidden="true">DRAG 360</span>
      <span class="viewer__deg" id="deg" aria-hidden="true">342&deg;</span>
    </div>

    <div class="rail">
      <ul class="thumbs">
        <li>
          <button class="thumb is-on" type="button" data-angle="342" aria-pressed="true" aria-label="Front angle view">
            <span class="thumb__ring" aria-hidden="true"></span>
          </button>
        </li>
        <li>
          <button class="thumb" type="button" data-angle="120" aria-pressed="false" aria-label="Three quarter angle view">
            <span class="thumb__ring thumb__ring--b" aria-hidden="true"></span>
          </button>
        </li>
        <li>
          <button class="thumb" type="button" data-angle="205" aria-pressed="false" aria-label="Side angle view">
            <span class="thumb__ring thumb__ring--c" aria-hidden="true"></span>
          </button>
        </li>
      </ul>

      <div class="finish">
        <p class="finish__label">Finish</p>
        <div class="finish__set" role="group" aria-label="Ring finish">
          <button class="swatch is-on" type="button" data-finish="brushed" aria-pressed="true" style="--sw:#d5dee6"><span class="swatch__dot" aria-hidden="true"></span>Brushed</button>
          <button class="swatch" type="button" data-finish="graphite" aria-pressed="false" style="--sw:#4d5560"><span class="swatch__dot" aria-hidden="true"></span>Graphite</button>
          <button class="swatch" type="button" data-finish="ion" aria-pressed="false" style="--sw:#e0b25c"><span class="swatch__dot" aria-hidden="true"></span>Ion gold</button>
        </div>
      </div>
    </div>

    <dl class="specs">
      <div class="spec">
        <dt>Grade</dt>
        <dd>Ti-6Al-4V, aerospace</dd>
      </div>
      <div class="spec">
        <dt>Band</dt>
        <dd>8 mm &times; 2 mm</dd>
      </div>
      <div class="spec">
        <dt>Weight</dt>
        <dd>6.4 g at size 9</dd>
      </div>
      <div class="spec">
        <dt>Comfort</dt>
        <dd>Domed inner curve</dd>
      </div>
    </dl>

    <div class="buy">
      <p class="price"><span class="price__amount">$248</span><span class="price__note">free resizing, 10 yr warranty</span></p>
      <div class="buy__row">
        <button class="btn btn--solid" type="button" id="add" aria-pressed="false">Add to bag</button>
        <button class="btn btn--icon" type="button" id="save" aria-pressed="false" aria-label="Save this ring to your wishlist">
          <svg class="btn__glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 20.2S3.6 14.9 3.6 9.4A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8.4 2.8c0 5.5-8.4 10.8-8.4 10.8z"></path>
          </svg>
        </button>
      </div>
    </div>
  </article>
</main>
</body>
</html>
