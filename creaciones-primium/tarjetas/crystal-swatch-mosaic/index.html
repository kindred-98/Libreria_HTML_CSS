<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Swatch Mosaic</title>
<meta name="description" content="A crystal swatch sampler where every glass chip floats on its own parallax drift and the family filters reorganise the mosaic with a flip while a spec sheet for the held sample fills in.">
<meta name="description-es" content="Un muestrario de cristal donde cada ficha de vidrio flota con su propio paralaje y los filtros de familia reorganizan el mosaico con un flip mientras se completa la ficha técnica de la muestra elegida.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="stage">
  <article class="csm">
    <span class="csm__halo" aria-hidden="true"></span>
    <span class="csm__sheen" aria-hidden="true"></span>

    <header class="csm__bar">
      <p class="csm__brand"><span class="csm__mark" aria-hidden="true"></span>Prisma Works <em>glass library</em></p>
      <p class="csm__edition">Edition 07 / 24</p>
    </header>

    <div class="csm__intro">
      <h1 class="csm__title">Cathedral glass sampler</h1>
      <p class="csm__sub">Nine hand drawn melts, cooled for 96 h and indexed by crystal family</p>
    </div>

    <nav class="filters" role="group" aria-label="Crystal families">
      <button class="chip-btn is-on" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="chip-btn" type="button" data-filter="cathedral" aria-pressed="false">Cathedral</button>
      <button class="chip-btn" type="button" data-filter="sea" aria-pressed="false">Sea</button>
      <button class="chip-btn" type="button" data-filter="ember" aria-pressed="false">Ember</button>
      <button class="chip-btn" type="button" data-filter="frost" aria-pressed="false">Frost</button>
    </nav>

    <section class="mosaic" id="csmMosaic" aria-label="Glass swatches">
      <button class="sw sw--wide" type="button" data-cat="cathedral" data-name="Aurora Prism" data-finish="flashed core" data-trans="0.62" aria-pressed="true">
        <span class="sw__chip sw__chip--aurora" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="sw__body">
          <span class="sw__name">Aurora Prism</span>
          <span class="sw__fin">flashed core &middot; 14 mm</span>
        </span>
      </button>

      <button class="sw" type="button" data-cat="sea" data-name="Tidepool Teal" data-finish="hand pulled" data-trans="0.74" aria-pressed="false">
        <span class="sw__chip sw__chip--tide" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="sw__body">
          <span class="sw__name">Tidepool Teal</span>
          <span class="sw__fin">hand pulled &middot; 11 mm</span>
        </span>
      </button>

      <button class="sw" type="button" data-cat="ember" data-name="Kiln Amber" data-finish="full anneal" data-trans="0.55" aria-pressed="false">
        <span class="sw__chip sw__chip--ember" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="sw__body">
          <span class="sw__name">Kiln Amber</span>
          <span class="sw__fin">full anneal &middot; 9 mm</span>
        </span>
      </button>

      <button class="sw sw--tall" type="button" data-cat="frost" data-name="Frost Cathedral" data-finish="acid etched" data-trans="0.38" aria-pressed="false">
        <span class="sw__chip sw__chip--frost" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="sw__body">
          <span class="sw__name">Frost Cathedral</span>
          <span class="sw__fin">acid etched &middot; 16 mm</span>
        </span>
      </button>

      <button class="sw" type="button" data-cat="cathedral" data-name="Verdigris Bell" data-finish="cased pair" data-trans="0.68" aria-pressed="false">
        <span class="sw__chip sw__chip--verd" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="sw__body">
          <span class="sw__name">Verdigris Bell</span>
          <span class="sw__fin">cased pair &middot; 12 mm</span>
        </span>
      </button>

      <button class="sw" type="button" data-cat="sea" data-name="Cobalt Shelf" data-finish="recycled cullet" data-trans="0.8" aria-pressed="false">
        <span class="sw__chip sw__chip--cobalt" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="sw__body">
          <span class="sw__name">Cobalt Shelf</span>
          <span class="sw__fin">recycled cullet &middot; 10 mm</span>
        </span>
      </button>

      <button class="sw sw--wide" type="button" data-cat="frost" data-name="Opal Veil" data-finish="layered opal" data-trans="0.44" aria-pressed="false">
        <span class="sw__chip sw__chip--opal" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="sw__body">
          <span class="sw__name">Opal Veil</span>
          <span class="sw__fin">layered opal &middot; 13 mm</span>
        </span>
      </button>

      <button class="sw" type="button" data-cat="ember" data-name="Ember Vein" data-finish="striated rod" data-trans="0.7" aria-pressed="false">
        <span class="sw__chip sw__chip--vein" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="sw__body">
          <span class="sw__name">Ember Vein</span>
          <span class="sw__fin">striated rod &middot; 8 mm</span>
        </span>
      </button>

      <button class="sw" type="button" data-cat="sea" data-name="Seafoam Loam" data-finish="sea glass" data-trans="0.66" aria-pressed="false">
        <span class="sw__chip sw__chip--foam" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="sw__body">
          <span class="sw__name">Seafoam Loam</span>
          <span class="sw__fin">sea glass &middot; 15 mm</span>
        </span>
      </button>
    </section>

    <section class="spec">
      <p class="spec__label">Held sample</p>
      <p class="spec__name" id="csmName">Aurora Prism</p>
      <p class="spec__row"><span>Finish</span><b id="csmFin">flashed core</b></p>
      <p class="spec__row"><span>Transmission</span><b id="csmTrans">62 %</b></p>
      <span class="spec__gauge" aria-hidden="true"><i id="csmBar" style="--w:.62"></i></span>
    </section>

    <footer class="csm__foot">
      <p class="csm__note">Catalog PWS&#8209;07 &middot; 9 of 9 melts archived</p>
      <button class="cbtn cbtn--main" type="button" id="csmReserve" aria-pressed="false">Reserve sample set</button>
    </footer>
  </article>
</main>
</body>
</html>
