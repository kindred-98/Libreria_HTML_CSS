<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ceramic Mug Detail</title>
<meta name="description" content="A stoneware mug product card with a draggable 360 degree view painted by a rotating conic glaze gradient, a contact shadow that swings with the turn, angle thumbnails, a technical sheet and three glazes that morph the surface.">
<meta name="description-es" content="Ficha de producto de una taza de gres con vista 360 arrastrable pintada por un degradado cónico del esmalte que gira, sombra de contacto que se mueve con el giro, miniaturas de ángulo, ficha técnica y tres esmaltes que transforman la superficie.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="stage">
  <article class="mug" id="mug">
    <span class="mug__halo" aria-hidden="true"></span>
    <span class="mug__grain" aria-hidden="true"></span>

    <header class="mug__bar">
      <p class="mug__brand"><span class="mug__mark" aria-hidden="true"></span>Kiln Nine Studio</p>
      <p class="mug__stock"><i aria-hidden="true"></i>Fired 3 of 40</p>
    </header>

    <h1 class="mug__name">Ridgeline Mug <span>340 ml</span></h1>

    <div class="viewer" id="viewer" tabindex="0" role="img" aria-label="Stoneware mug preview, drag sideways or use the arrow keys to rotate it">
      <span class="viewer__backdrop" aria-hidden="true"></span>
      <span class="viewer__seam" aria-hidden="true"></span>
      <span class="viewer__floor" aria-hidden="true"></span>
      <span class="cup__bounce" aria-hidden="true"></span>
      <span class="cup__shadow" aria-hidden="true"></span>
      <span class="cup" aria-hidden="true">
        <span class="cup__handle" id="cupHandle"></span>
        <span class="cup__body"></span>
        <span class="cup__glaze"></span>
        <span class="cup__bead" id="cupBead"></span>
        <span class="cup__spec" id="cupSpec"></span>
        <span class="cup__rim"></span>
        <span class="cup__well"></span>
      </span>
      <span class="viewer__deg" id="deg" aria-hidden="true">28&deg;</span>
      <span class="viewer__hint" aria-hidden="true">drag 360</span>
    </div>

    <div class="rail">
      <ul class="thumbs">
        <li>
          <button class="thumb is-on" type="button" data-angle="28" aria-pressed="true" aria-label="Front three quarter view">
            <span class="thumb__cup" aria-hidden="true"></span><span class="thumb__deg">28&deg;</span>
          </button>
        </li>
        <li>
          <button class="thumb" type="button" data-angle="118" aria-pressed="false" aria-label="Right side view">
            <span class="thumb__cup thumb__cup--b" aria-hidden="true"></span><span class="thumb__deg">118&deg;</span>
          </button>
        </li>
        <li>
          <button class="thumb" type="button" data-angle="205" aria-pressed="false" aria-label="Back view">
            <span class="thumb__cup thumb__cup--c" aria-hidden="true"></span><span class="thumb__deg">205&deg;</span>
          </button>
        </li>
        <li>
          <button class="thumb" type="button" data-angle="298" aria-pressed="false" aria-label="Left side view">
            <span class="thumb__cup thumb__cup--d" aria-hidden="true"></span><span class="thumb__deg">298&deg;</span>
          </button>
        </li>
      </ul>

      <div class="glaze">
        <p class="glaze__label">Glaze</p>
        <div class="glaze__set" role="group" aria-label="Glaze variant">
          <button class="chip is-on" type="button" data-glaze="oat" aria-pressed="true" style="--sw:#e6d3b4">Oat ash</button>
          <button class="chip" type="button" data-glaze="iron" aria-pressed="false" style="--sw:#7d3b28">Iron saturate</button>
          <button class="chip" type="button" data-glaze="celadon" aria-pressed="false" style="--sw:#87b8a4">Celadon</button>
        </div>
      </div>
    </div>

    <dl class="specs">
      <div class="spec">
        <dt>Body</dt>
        <dd>Speckled stoneware</dd>
      </div>
      <div class="spec">
        <dt>Wall</dt>
        <dd>6 mm at the rim</dd>
      </div>
      <div class="spec">
        <dt>Firing</dt>
        <dd>1280 &deg;C, cone 10</dd>
      </div>
      <div class="spec">
        <dt>Care</dt>
        <dd>Dishwasher safe</dd>
      </div>
    </dl>

    <p class="mug__score">
      <span class="mug__stars" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M12 3.4l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.7l6-.8z"></path></svg>
      </span>
      <span class="mug__rate">4.8</span>
      <span class="mug__count">from <b data-count="214">214</b> potters</span>
    </p>

    <div class="buy">
      <p class="buy__price"><span class="buy__amount">$38</span><span class="buy__note">ships in 3 days &middot; free returns</span></p>
      <div class="buy__row">
        <button class="btn btn--solid" type="button" id="add" aria-pressed="false">Add to basket</button>
        <button class="btn btn--icon" type="button" id="save" aria-pressed="false" aria-label="Save this mug to your wishlist">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20.1S3.7 14.8 3.7 9.3A4.6 4.6 0 0 1 12 6.5a4.6 4.6 0 0 1 8.3 2.8c0 5.5-8.3 10.8-8.3 10.8z"></path></svg>
        </button>
      </div>
    </div>
  </article>
</main>
</body>
</html>
