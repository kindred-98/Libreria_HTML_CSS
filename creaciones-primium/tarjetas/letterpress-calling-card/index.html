<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Letterpress Calling Card</title>
<meta name="description" content="A letterpress calling card on cotton stock with a die-cut deckle edge, ink that soaks into the paper, a relief impression that deepens under the pointer and a blind proof stamp that takes ink on press.">
<meta name="description-es" content="Una tarjeta de visita impresa en letterpress sobre papel de algodón con borde troquelado, tinta que penetra el papel, relieve que se marca al pasar el puntero y un sello ciego que se entinta al imprimir.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="stage">
  <article class="prs" id="prs">
    <span class="prs__crop prs__crop--tl" aria-hidden="true"></span>
    <span class="prs__crop prs__crop--tr" aria-hidden="true"></span>
    <span class="prs__crop prs__crop--bl" aria-hidden="true"></span>
    <span class="prs__crop prs__crop--br" aria-hidden="true"></span>

    <span class="prs__grain" aria-hidden="true"></span>

    <div class="prs__top">
      <span class="prs__mark" aria-hidden="true">
        <svg viewBox="0 0 48 24" focusable="false">
          <path d="M24 4.6L29.4 12 24 19.4 18.6 12z"></path>
          <path d="M4 12h9"></path>
          <path d="M35 12h9"></path>
          <circle cx="15.6" cy="12" r="1.7"></circle>
          <circle cx="32.4" cy="12" r="1.7"></circle>
        </svg>
      </span>
      <span class="prs__seal">
        <span class="prs__seal-in">Est.<br>2009</span>
      </span>
    </div>

    <h1 class="prs__name prs__rel" data-ink="Ottoline Bregant">Ottoline Bregant</h1>
    <p class="prs__role prs__rel">Letterpress and identity &middot; Master printer</p>

    <span class="prs__rule" aria-hidden="true"></span>

    <dl class="prs__grid">
      <div class="prs__item">
        <dt>Studio</dt>
        <dd>Breve &amp; Co.</dd>
      </div>
      <div class="prs__item">
        <dt>Post</dt>
        <dd>Unit 12, Ropewalk Yard, Bristol BS1</dd>
      </div>
      <div class="prs__item">
        <dt>Mail</dt>
        <dd>studio@breveandco.uk</dd>
      </div>
      <div class="prs__item">
        <dt>Voice</dt>
        <dd>+44 117 496 0142</dd>
      </div>
    </dl>

    <div class="prs__foot">
      <p class="prs__stock">600 lb cotton &middot; two hits &middot; deckle trim 0.8 mm</p>
      <p class="prs__stamp" id="prsStamp">Proof pending</p>
    </div>

    <div class="prs__acts">
      <button class="prs__btn" type="button" id="prsPress" aria-pressed="false">Ink the proof</button>
      <button class="prs__btn prs__btn--go" type="button" id="prsOrder" aria-pressed="false">Order 200 cards</button>
    </div>

    <p class="prs__note" id="prsNote" role="status">Two plates loaded &middot; impression 0.42 mm</p>
  </article>
</main>
</body>
</html>
