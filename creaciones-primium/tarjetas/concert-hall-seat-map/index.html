<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sala Lumen Concert Hall Seat Map</title>
<meta name="description" content="A concert hall seat map for Sala Lumen with an arc of pickable seats, a wave ripple on every hold, a live occupancy recount and two sessions that swap the house palette.">
<meta name="description-es" content="Un mapa de butacas de la Sala Lumen con un arco de asientos seleccionables, onda en cada reserva, recuento de aforo en vivo y dos sesiones que cambian la paleta de la sala.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="stage">
  <article class="hall" id="hall" data-session="matinee">
    <span class="hall__beam" aria-hidden="true"></span>
    <span class="hall__grain" aria-hidden="true"></span>

    <header class="hall__head">
      <div class="hall__house">
        <p class="hall__label">Sala Lumen · Platea A–E</p>
        <h1 class="hall__title">Choeur de la Nuit</h1>
        <p class="hall__meta">Grand Choeur &amp; Chamber Orchestra · 62 min</p>
      </div>
      <div class="hall__seg" role="group" aria-label="Session">
        <button class="hall__seg-btn is-on" type="button" data-ses="matinee" aria-pressed="true">Matine 16:00</button>
        <button class="hall__seg-btn" type="button" data-ses="nocturne" aria-pressed="false">Nocturne 20:30</button>
      </div>
    </header>

    <section class="hall__stage" aria-label="Stage">
      <span class="hall__curtain" aria-hidden="true"></span>
      <p class="hall__stage-cap">Stage</p>
      <span class="hall__wash" aria-hidden="true"></span>
    </section>

    <div class="hall__rows" role="group" aria-label="Seat map, rows A to E">
      <div class="hall__row" style="--i:4">
        <span class="hall__rowlab" aria-hidden="true">A</span>
        <span class="hall__seats">
          <button class="hall__seat" type="button" data-r="A" data-n="1" aria-label="Row A seat 1" aria-pressed="false"></button>
          <button class="hall__seat is-taken" type="button" data-r="A" data-n="2" aria-label="Row A seat 2" aria-pressed="false" disabled></button>
          <button class="hall__seat is-taken" type="button" data-r="A" data-n="3" aria-label="Row A seat 3" aria-pressed="false" disabled></button>
          <button class="hall__seat" type="button" data-r="A" data-n="4" aria-label="Row A seat 4" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="A" data-n="5" aria-label="Row A seat 5" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="A" data-n="6" aria-label="Row A seat 6" aria-pressed="false"></button>
          <span class="hall__aisle" aria-hidden="true"></span>
          <button class="hall__seat" type="button" data-r="A" data-n="7" aria-label="Row A seat 7" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="A" data-n="8" aria-label="Row A seat 8" aria-pressed="false"></button>
          <button class="hall__seat is-taken" type="button" data-r="A" data-n="9" aria-label="Row A seat 9" aria-pressed="false" disabled></button>
          <button class="hall__seat is-taken" type="button" data-r="A" data-n="10" aria-label="Row A seat 10" aria-pressed="false" disabled></button>
        </span>
      </div>

      <div class="hall__row" style="--i:3">
        <span class="hall__rowlab" aria-hidden="true">B</span>
        <span class="hall__seats">
          <button class="hall__seat" type="button" data-r="B" data-n="1" aria-label="Row B seat 1" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="B" data-n="2" aria-label="Row B seat 2" aria-pressed="false"></button>
          <button class="hall__seat is-held is-picked" type="button" data-r="B" data-n="3" aria-label="Row B seat 3" aria-pressed="true"></button>
          <button class="hall__seat is-held is-picked" type="button" data-r="B" data-n="4" aria-label="Row B seat 4" aria-pressed="true"></button>
          <button class="hall__seat" type="button" data-r="B" data-n="5" aria-label="Row B seat 5" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="B" data-n="6" aria-label="Row B seat 6" aria-pressed="false"></button>
          <span class="hall__aisle" aria-hidden="true"></span>
          <button class="hall__seat is-taken" type="button" data-r="B" data-n="7" aria-label="Row B seat 7" aria-pressed="false" disabled></button>
          <button class="hall__seat is-taken" type="button" data-r="B" data-n="8" aria-label="Row B seat 8" aria-pressed="false" disabled></button>
          <button class="hall__seat" type="button" data-r="B" data-n="9" aria-label="Row B seat 9" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="B" data-n="10" aria-label="Row B seat 10" aria-pressed="false"></button>
        </span>
      </div>

      <div class="hall__row" style="--i:2">
        <span class="hall__rowlab" aria-hidden="true">C</span>
        <span class="hall__seats">
          <button class="hall__seat" type="button" data-r="C" data-n="1" aria-label="Row C seat 1" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="C" data-n="2" aria-label="Row C seat 2" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="C" data-n="3" aria-label="Row C seat 3" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="C" data-n="4" aria-label="Row C seat 4" aria-pressed="false"></button>
          <button class="hall__seat is-taken" type="button" data-r="C" data-n="5" aria-label="Row C seat 5" aria-pressed="false" disabled></button>
          <button class="hall__seat" type="button" data-r="C" data-n="6" aria-label="Row C seat 6" aria-pressed="false"></button>
          <span class="hall__aisle" aria-hidden="true"></span>
          <button class="hall__seat" type="button" data-r="C" data-n="7" aria-label="Row C seat 7" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="C" data-n="8" aria-label="Row C seat 8" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="C" data-n="9" aria-label="Row C seat 9" aria-pressed="false"></button>
          <button class="hall__seat is-held" type="button" data-r="C" data-n="10" aria-label="Row C seat 10" aria-pressed="false"></button>
        </span>
      </div>

      <div class="hall__row" style="--i:1">
        <span class="hall__rowlab" aria-hidden="true">D</span>
        <span class="hall__seats">
          <button class="hall__seat" type="button" data-r="D" data-n="1" aria-label="Row D seat 1" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="D" data-n="2" aria-label="Row D seat 2" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="D" data-n="3" aria-label="Row D seat 3" aria-pressed="false"></button>
          <button class="hall__seat is-taken" type="button" data-r="D" data-n="4" aria-label="Row D seat 4" aria-pressed="false" disabled></button>
          <button class="hall__seat" type="button" data-r="D" data-n="5" aria-label="Row D seat 5" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="D" data-n="6" aria-label="Row D seat 6" aria-pressed="false"></button>
          <span class="hall__aisle" aria-hidden="true"></span>
          <button class="hall__seat" type="button" data-r="D" data-n="7" aria-label="Row D seat 7" aria-pressed="false"></button>
          <button class="hall__seat is-taken" type="button" data-r="D" data-n="8" aria-label="Row D seat 8" aria-pressed="false" disabled></button>
          <button class="hall__seat" type="button" data-r="D" data-n="9" aria-label="Row D seat 9" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="D" data-n="10" aria-label="Row D seat 10" aria-pressed="false"></button>
        </span>
      </div>

      <div class="hall__row" style="--i:0">
        <span class="hall__rowlab" aria-hidden="true">E</span>
        <span class="hall__seats">
          <button class="hall__seat" type="button" data-r="E" data-n="1" aria-label="Row E seat 1" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="E" data-n="2" aria-label="Row E seat 2" aria-pressed="false"></button>
          <button class="hall__seat is-taken" type="button" data-r="E" data-n="3" aria-label="Row E seat 3" aria-pressed="false" disabled></button>
          <button class="hall__seat" type="button" data-r="E" data-n="4" aria-label="Row E seat 4" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="E" data-n="5" aria-label="Row E seat 5" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="E" data-n="6" aria-label="Row E seat 6" aria-pressed="false"></button>
          <span class="hall__aisle" aria-hidden="true"></span>
          <button class="hall__seat" type="button" data-r="E" data-n="7" aria-label="Row E seat 7" aria-pressed="false"></button>
          <button class="hall__seat" type="button" data-r="E" data-n="8" aria-label="Row E seat 8" aria-pressed="false"></button>
          <button class="hall__seat is-taken" type="button" data-r="E" data-n="9" aria-label="Row E seat 9" aria-pressed="false" disabled></button>
          <button class="hall__seat" type="button" data-r="E" data-n="10" aria-label="Row E seat 10" aria-pressed="false"></button>
        </span>
      </div>
    </div>

    <p class="hall__legend">
      <span class="hall__key hall__key--free">Free</span>
      <span class="hall__key hall__key--held">Held</span>
      <span class="hall__key hall__key--taken">Sold</span>
      <span class="hall__key hall__key--you">Your pick</span>
    </p>

    <section class="hall__sum">
      <div class="hall__num">
        <p class="hall__num-lab">Seats held</p>
        <p class="hall__num-val"><span data-seats>2</span><small>/6</small></p>
      </div>
      <div class="hall__num">
        <p class="hall__num-lab">Row load</p>
        <span class="hall__gauge" aria-hidden="true"><i id="hallGauge"></i></span>
        <p class="hall__num-cap" id="hallFree">8 of 50 free</p>
      </div>
      <div class="hall__num">
        <p class="hall__num-lab">Basket</p>
        <p class="hall__num-val hall__num-val--gold"><span data-total>216</span><small>EUR</small></p>
      </div>
    </section>

    <footer class="hall__foot">
      <p class="hall__msg" id="hallMsg" role="status">Holds expire in 08:40</p>
      <div class="hall__acts">
        <button class="hall__btn" type="button" id="hallClear">Release picks</button>
        <button class="hall__btn hall__btn--go" type="button" id="hallBook" aria-pressed="false">Book the block</button>
      </div>
    </footer>
  </article>
</main>
</body>
</html>
