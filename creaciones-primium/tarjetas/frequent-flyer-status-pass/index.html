<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian Atlantic Frequent Flyer Pass</title>
<meta name="description" content="A metal laminate frequent flyer status pass with an unfolding gold status band, a duotone crew portrait, a reflective sheen that tracks the pointer and live qualification meters.">
<meta name="description-es" content="Un pase de cliente frecuente de laminado metálico con franja de estado dorada que se despliega, retrato de tripulación en duotono, brillo especular que sigue el puntero y medidores de cualificación en vivo.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="stage">
  <div class="fly__tilt">
    <article class="fly" id="flyCard">
      <span class="fly__sheen" aria-hidden="true"></span>
      <span class="fly__grain" aria-hidden="true"></span>

      <div class="fly__photo">
        <span class="fly__flare" aria-hidden="true"></span>
        <span class="fly__figure" aria-hidden="true">
          <i class="fly__head"></i>
          <i class="fly__torso"></i>
        </span>
        <span class="fly__scan" aria-hidden="true"></span>
        <p class="fly__photo-tag">Crew portrait · ID 4471-B</p>
        <p class="fly__photo-corner" aria-hidden="true">MRD</p>
      </div>

      <div class="fly__body">
        <p class="fly__band" id="flyBand">
          <span class="fly__band-star" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><path d="M12 3.5l2.4 6.1 6.1 2.4-6.1 2.4-2.4 6.1-2.4-6.1L3.5 12l6.1-2.4z"></path></svg>
          </span>
          <span class="fly__band-txt">Gold · Skyline tier</span>
        </p>

        <p class="fly__air">Meridian Atlantic</p>
        <h1 class="fly__name">Adaeze&nbsp;Nwosu-Ruiz</h1>
        <p class="fly__sub">Frequent flyer · MAD-LHR 4471</p>

        <dl class="fly__stats">
          <div class="fly__stat">
            <dt>Qualified</dt>
            <dd><span data-count="84">84</span><small>/100</small></dd>
          </div>
          <div class="fly__stat">
            <dt>Miles</dt>
            <dd><span data-count="126480" data-sep="1">126 480</span></dd>
          </div>
          <div class="fly__stat">
            <dt>Flights</dt>
            <dd><span data-count="212">212</span></dd>
          </div>
        </dl>

        <span class="fly__meter" aria-hidden="true"><i id="flyMeter"></i></span>
        <p class="fly__meter-cap"><span>16 segments to Platinum</span><span>Renews 03/2029</span></p>

        <p class="fly__contact">
          <span class="fly__mail">adaeze.nwosu@meridianatlantic.eu</span>
          <span class="fly__tel">+44 20 7946 0231</span>
        </p>

        <div class="fly__acts">
          <button class="fly__btn" type="button" id="flyWallet" aria-pressed="false">
            <span class="fly__btn-glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M4 8.5h16v10H4z"></path><path d="M8.5 8.5V6.8A2.3 2.3 0 0 1 10.8 4.5h2.4a2.3 2.3 0 0 1 2.3 2.3v1.7"></path><path d="M4 12.6h16"></path></svg>
            </span>
            <span id="flyWalletTxt">Add to wallet</span>
          </button>
          <button class="fly__btn fly__btn--gold" type="button" id="flyLounge" aria-pressed="false">
            <span class="fly__btn-glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M7 4.5v7.5a2.5 2.5 0 0 0 5 0V4.5"></path><path d="M7 9.5h5"></path><path d="M12 12v7.5"></path><path d="M6.5 19.5h11"></path><path d="M12 12h3.2a2.2 2.2 0 0 1 0 4.4H12"></path></svg>
            </span>
            <span id="flyLoungeTxt">Request lounge key</span>
          </button>
        </div>

        <p class="fly__state" id="flyState" role="status">Pass verified at check-in desk 24</p>

        <span class="fly__mrz" aria-hidden="true">
          <i style="--w:2px"></i><i style="--w:1px"></i><i style="--w:3px"></i><i style="--w:1px"></i><i style="--w:1px"></i><i style="--w:2px"></i><i style="--w:3px"></i><i style="--w:1px"></i><i style="--w:2px"></i><i style="--w:1px"></i><i style="--w:3px"></i><i style="--w:1px"></i><i style="--w:2px"></i><i style="--w:1px"></i><i style="--w:3px"></i><i style="--w:1px"></i><i style="--w:2px"></i><i style="--w:1px"></i><i style="--w:1px"></i><i style="--w:3px"></i><i style="--w:2px"></i><i style="--w:1px"></i><i style="--w:3px"></i><i style="--w:1px"></i><i style="--w:2px"></i><i style="--w:1px"></i><i style="--w:1px"></i><i style="--w:3px"></i>
        </span>
      </div>
    </article>
  </div>
</main>
</body>
</html>
