<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Festival Wristband Pass</title>
<meta name="description" content="A festival wristband pass with a band that keeps turning in the light, a barcode under a sweeping gate scanner, and holder data that resolves row by row as the beam travels.">
<meta name="description-es" content="Un pase de pulsera de festival con la pulsera girando bajo la luz, un código de barras bajo el escáner de acceso y los datos del titular que se revelan fila a fila según avanza el haz.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="stage">
  <article class="fwp" id="fwp">
    <span class="fwp__flare" aria-hidden="true"></span>

    <header class="fwp__head">
      <div class="fwp__id">
        <p class="fwp__fest">Solstice Field &middot; edition XI</p>
        <h1 class="fwp__title">Wristband pass</h1>
      </div>
      <span class="fwp__valid"><i aria-hidden="true"></i>Valid</span>
    </header>

    <div class="fwp__stagewrap">
      <span class="fwp__glowbar" aria-hidden="true"></span>
      <div class="fwp__wrist" id="fwpWrist">
        <svg class="fwp__band" viewBox="0 0 320 132" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="fwpTape" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#ff4fa3"></stop>
              <stop offset=".5" stop-color="#a356ff"></stop>
              <stop offset="1" stop-color="#45e6ff"></stop>
            </linearGradient>
            <linearGradient id="fwpTapeBack" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#7a2f5f"></stop>
              <stop offset="1" stop-color="#1f5566"></stop>
            </linearGradient>
          </defs>
          <path d="M44 66C44 24 122 6 168 10c46 4 108 18 108 44 0 22-40 34-72 40-40 8-96 4-124-8-20-8-36-14-36-20z" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="20"></path>
          <path d="M44 66C44 24 122 6 168 10c46 4 108 18 108 44 0 22-40 34-72 40-40 8-96 4-124-8-20-8-36-14-36-20z" fill="none" stroke="url(#fwpTapeBack)" stroke-width="17"></path>
          <path d="M44 66C44 24 122 6 168 10c46 4 108 18 108 44 0 22-40 34-72 40-40 8-96 4-124-8-20-8-36-14-36-20z" fill="none" stroke="url(#fwpTape)" stroke-width="6" opacity=".85"></path>
          <g fill="#0d0a1c" opacity=".65">
            <circle cx="76" cy="34" r="2.4"></circle>
            <circle cx="88" cy="26" r="2.4"></circle>
            <circle cx="100" cy="21" r="2.4"></circle>
            <circle cx="112" cy="17" r="2.4"></circle>
            <circle cx="124" cy="15" r="2.4"></circle>
          </g>
          <rect x="196" y="18" width="34" height="20" rx="5" fill="#d8d2e8" opacity=".9"></rect>
          <rect x="201" y="23" width="24" height="10" rx="3" fill="#241c3a"></rect>
          <rect x="40" y="52" width="14" height="26" rx="3" fill="#e9e2f5" opacity=".85"></rect>
        </svg>

        <div class="fwp__pass">
          <span class="fwp__pass-edge" aria-hidden="true"></span>
          <p class="fwp__pass-kicker">Solstice Field XI</p>
          <p class="fwp__pass-tier">Weekend &middot; GA+</p>
          <p class="fwp__pass-name">Ines Kalder</p>
          <span class="fwp__pass-chip">3 days</span>
        </div>
      </div>
    </div>

    <section class="fwp__scan">
      <div class="fwp__scan-head">
        <p class="fwp__scan-title">Gate scan</p>
        <p class="fwp__scan-state" id="fwpState">Reading holder</p>
      </div>

      <div class="fwp__code">
        <svg class="fwp__bars" viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <rect x="1" y="0" width="2.5" height="40"></rect>
          <rect x="5.5" y="0" width="5" height="40"></rect>
          <rect x="12.5" y="0" width="2" height="40"></rect>
          <rect x="16.5" y="0" width="1.5" height="40"></rect>
          <rect x="20" y="0" width="6" height="40"></rect>
          <rect x="28" y="0" width="2.5" height="40"></rect>
          <rect x="33" y="0" width="4" height="40"></rect>
          <rect x="39" y="0" width="1.5" height="40"></rect>
          <rect x="42.5" y="0" width="5.5" height="40"></rect>
          <rect x="50" y="0" width="2" height="40"></rect>
          <rect x="54" y="0" width="3.5" height="40"></rect>
          <rect x="59.5" y="0" width="1.5" height="40"></rect>
          <rect x="63" y="0" width="5" height="40"></rect>
          <rect x="70" y="0" width="2.5" height="40"></rect>
          <rect x="74.5" y="0" width="6" height="40"></rect>
          <rect x="82.5" y="0" width="1.5" height="40"></rect>
          <rect x="86" y="0" width="4" height="40"></rect>
          <rect x="92" y="0" width="2" height="40"></rect>
          <rect x="96" y="0" width="5.5" height="40"></rect>
          <rect x="103.5" y="0" width="2.5" height="40"></rect>
          <rect x="108" y="0" width="1.5" height="40"></rect>
          <rect x="111.5" y="0" width="5" height="40"></rect>
          <rect x="118.5" y="0" width="3.5" height="40"></rect>
          <rect x="124" y="0" width="2" height="40"></rect>
          <rect x="128" y="0" width="6" height="40"></rect>
          <rect x="136" y="0" width="2.5" height="40"></rect>
          <rect x="140.5" y="0" width="1.5" height="40"></rect>
          <rect x="144" y="0" width="4.5" height="40"></rect>
          <rect x="150.5" y="0" width="2" height="40"></rect>
          <rect x="154.5" y="0" width="5.5" height="40"></rect>
          <rect x="162" y="0" width="2" height="40"></rect>
          <rect x="166" y="0" width="3.5" height="40"></rect>
          <rect x="171.5" y="0" width="1.5" height="40"></rect>
          <rect x="175" y="0" width="6" height="40"></rect>
          <rect x="183" y="0" width="2.5" height="40"></rect>
          <rect x="187.5" y="0" width="4.5" height="40"></rect>
          <rect x="194" y="0" width="3" height="40"></rect>
        </svg>
        <span class="fwp__beam" aria-hidden="true"></span>
      </div>

      <ul class="fwp__rows" id="fwpRows">
        <li class="fwp__row" data-row="0" style="--i:0"><span class="fwp__row-label">Holder</span><b class="fwp__row-val">Ines Kalder</b></li>
        <li class="fwp__row" data-row="1" style="--i:1"><span class="fwp__row-label">Tier</span><b class="fwp__row-val">Weekend GA+</b></li>
        <li class="fwp__row" data-row="2" style="--i:2"><span class="fwp__row-label">Wristband</span><b class="fwp__row-val" id="fwpCode">SF24-08812</b></li>
        <li class="fwp__row" data-row="3" style="--i:3"><span class="fwp__row-label">Entry</span><b class="fwp__row-val" id="fwpEntry">Gate B / 14:20</b></li>
      </ul>

      <span class="fwp__progress" aria-hidden="true"><i id="fwpProgress"></i></span>
    </section>

    <footer class="fwp__foot">
      <p class="fwp__foot-note">On site <b id="fwpClock">01:24:07</b> &middot; RFID 13.56 MHz &middot; no resale</p>
      <div class="fwp__acts">
        <button class="fwp__act" type="button" id="fwpTurn" aria-label="Turn the wristband">Turn band</button>
        <button class="fwp__act fwp__act--hot" type="button" id="fwpReprint" aria-label="Reprint the wristband code">Reprint</button>
      </div>
    </footer>
  </article>
</main>
</body>
</html>
