<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delivery Alert Sticky Note</title>
<meta name="description" content="A sticky delivery alert note pinned to a desk, with a checklist that strikes through, a steel clip that sways and a note that deforms while you drag it.">
<meta name="description-es" content="Una nota adhesiva de aviso de entrega sujeta sobre un escritorio, con lista de verificación que se tacha, pinza metálica que se balancea y una nota que se deforma al arrastrarla.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="stage">
  <article class="sticky" id="sticky">
    <div class="clip" id="clip" aria-hidden="true">
      <span class="clip__jaws">
        <span class="clip__hinge"></span>
        <span class="clip__glint"></span>
      </span>
    </div>

    <div class="paper">
      <span class="paper__grain" aria-hidden="true"></span>
      <span class="paper__fold" aria-hidden="true"></span>

      <header class="paper__head">
        <p class="paper__courier">Swiftpanda Courier · Van 12</p>
        <h1 class="paper__title">Delivery window</h1>
        <p class="paper__time">Today 14:00 – 18:00 · Bay 3, dock north</p>
      </header>

      <ul class="checks">
        <li class="check">
          <button class="check__btn" type="button" aria-pressed="true">
            <span class="check__box" aria-hidden="true">
              <svg viewBox="0 0 16 16" focusable="false"><path d="M3 8.4l3.3 3.3L13 5"></path></svg>
            </span>
            <span class="check__text">Leave with the front desk</span>
          </button>
        </li>
        <li class="check">
          <button class="check__btn" type="button" aria-pressed="true">
            <span class="check__box" aria-hidden="true">
              <svg viewBox="0 0 16 16" focusable="false"><path d="M3 8.4l3.3 3.3L13 5"></path></svg>
            </span>
            <span class="check__text">Photograph the doorstep</span>
          </button>
        </li>
        <li class="check">
          <button class="check__btn" type="button" aria-pressed="false">
            <span class="check__box" aria-hidden="true">
              <svg viewBox="0 0 16 16" focusable="false"><path d="M3 8.4l3.3 3.3L13 5"></path></svg>
            </span>
            <span class="check__text">Ring unit 4B twice</span>
          </button>
        </li>
        <li class="check">
          <button class="check__btn" type="button" aria-pressed="false">
            <span class="check__box" aria-hidden="true">
              <svg viewBox="0 0 16 16" focusable="false"><path d="M3 8.4l3.3 3.3L13 5"></path></svg>
            </span>
            <span class="check__text">Signature from the resident</span>
          </button>
        </li>
      </ul>

      <footer class="paper__foot">
        <span class="paper__code">SWP-8842-QK</span>
        <span class="paper__driver">Driver: M. Ortega</span>
      </footer>

      <span class="paper__stamp" aria-hidden="true">Priority</span>
    </div>
  </article>

  <p class="hint">Drag the note &middot; tick the steps</p>
</main>
</body>
</html>
