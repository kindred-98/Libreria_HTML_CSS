<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indie Film Screening Seats</title>
<meta name="description" content="An indie screening seat map card with a sweeping projector beam, rows of seats that light up when held, a recalculated occupancy gauge and switchable sessions.">
<meta name="description-es" content="Una tarjeta de butacas de cine independiente con haz de proyector que barre la sala, filas que se encienden al reservar, aforo que se recalcula y sesiones conmutables.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="stage">
  <article class="hall" id="hall">
    <span class="hall__sheen" aria-hidden="true"></span>

    <header class="hall__head">
      <div class="hall__id">
        <p class="hall__kicker">Rialto micro-cinema &middot; Reel 4</p>
        <h1 class="hall__title">The Salt Harbour</h1>
        <p class="hall__meta">2024 &middot; 96 min &middot; Drama &middot; 15</p>
      </div>
      <p class="hall__badge"><b>4K</b><span>DCP</span></p>
    </header>

    <div class="screen" aria-hidden="true">
      <span class="screen__glow"></span>
      <span class="screen__label">SCREEN</span>
      <span class="screen__line"></span>
    </div>

    <div class="sessions" role="group" aria-label="Choose a screening">
      <button class="session" type="button" data-session="0" aria-pressed="false">
        <b>18:30</b><span>Subtitled</span>
      </button>
      <button class="session is-on" type="button" data-session="1" aria-pressed="true">
        <b>21:00</b><span>Q&amp;A after</span>
      </button>
      <button class="session" type="button" data-session="2" aria-pressed="false">
        <b>23:15</b><span>Late show</span>
      </button>
    </div>
    <p class="session-note" id="sessionNote">Doors at 20:30 &middot; director talk after the credits</p>

    <div class="seats" id="seats">
      <div class="row" style="--r:0">
        <span class="row__label">A</span>
        <button class="seat is-taken" type="button" disabled aria-label="Row A seat 1, taken"></button>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row A seat 2"></button>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row A seat 3"></button>
        <span class="row__aisle" aria-hidden="true"></span>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row A seat 4"></button>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row A seat 5"></button>
        <button class="seat is-taken" type="button" disabled aria-label="Row A seat 6, taken"></button>
      </div>
      <div class="row" style="--r:1">
        <span class="row__label">B</span>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row B seat 1"></button>
        <button class="seat is-held" type="button" aria-pressed="true" aria-label="Row B seat 2, held"></button>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row B seat 3"></button>
        <span class="row__aisle" aria-hidden="true"></span>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row B seat 4"></button>
        <button class="seat is-held" type="button" aria-pressed="true" aria-label="Row B seat 5, held"></button>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row B seat 6"></button>
      </div>
      <div class="row" style="--r:2">
        <span class="row__label">C</span>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row C seat 1"></button>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row C seat 2"></button>
        <button class="seat is-taken" type="button" disabled aria-label="Row C seat 3, taken"></button>
        <span class="row__aisle" aria-hidden="true"></span>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row C seat 4"></button>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row C seat 5"></button>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row C seat 6"></button>
      </div>
      <div class="row" style="--r:3">
        <span class="row__label">D</span>
        <button class="seat is-held" type="button" aria-pressed="true" aria-label="Row D seat 1, held"></button>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row D seat 2"></button>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row D seat 3"></button>
        <span class="row__aisle" aria-hidden="true"></span>
        <button class="seat is-taken" type="button" disabled aria-label="Row D seat 4, taken"></button>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row D seat 5"></button>
        <button class="seat is-held" type="button" aria-pressed="true" aria-label="Row D seat 6, held"></button>
      </div>
      <div class="row" style="--r:4">
        <span class="row__label">E</span>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row E seat 1"></button>
        <button class="seat is-taken" type="button" disabled aria-label="Row E seat 2, taken"></button>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row E seat 3"></button>
        <span class="row__aisle" aria-hidden="true"></span>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row E seat 4"></button>
        <button class="seat" type="button" aria-pressed="false" aria-label="Row E seat 5"></button>
        <button class="seat is-taken" type="button" disabled aria-label="Row E seat 6, taken"></button>
      </div>
    </div>

    <ul class="legend">
      <li><i class="swatch swatch--free"></i>Free</li>
      <li><i class="swatch swatch--held"></i>Held</li>
      <li><i class="swatch swatch--taken"></i>Taken</li>
      <li class="legend__price">12.50 each</li>
    </ul>

    <footer class="hall__foot">
      <div class="gauge">
        <p class="gauge__text"><b id="free">20</b> of 30 seats free</p>
        <span class="gauge__track" aria-hidden="true"><i class="gauge__fill" style="--w:.67"></i></span>
      </div>
      <p class="hall__total"><span id="held">4</span> held &middot; <b id="total">&euro;50.00</b></p>
      <button class="reserve" type="button" id="reserve" aria-pressed="false">Hold seats</button>
    </footer>
  </article>
</main>
</body>
</html>
