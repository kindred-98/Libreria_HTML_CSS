# Configuracion de SonarCloud para el repositorio.
#
# Este fichero lo lee el auto-analisis de SonarCloud desde la raiz del repo.
# Las exclusiones de duplicacion (cpd) son necesarias porque la mayoria
# de los demos siguen la regla 6 de CONTRIBUTING (componentes
# independientes) y comparten bloques estructurales que se repiten a
# proposito: el bloque `prefers-reduced-motion` (Fase 6.3, 171 demos),
# las clases `aria-label` recurrentes, los resets de estilo de los
# botones, etc. Esos bloques son deliberadamente repetidos, no son
# duplicacion accidental.
#
# Las exclusiones de `sonar.cpd.exclusions` y `sonar.cpd.exclusions.minimumLines`
# bajan la cuenta de duplicacion en "new code" sin tocar el codigo.
#
# Ver: https://docs.sonarsource.com/sonarqube-server/latest/analyzing-source-code/duplication/

# Bloque de Fase 6.3, repetido a proposito en 171 demos (regla 6 de
# CONTRIBUTING: cada componente es independiente y no puede depender
# de un CSS compartido). El patron `**/prefers-reduced-motion**` se declara
# mas abajo, junto al resto: en un .properties la ultima asignacion de una
# clave gana, asi que tener dos `sonar.cpd.exclusions` dejaba la primera
# como configuracion muerta.

# Subimos el umbral de duplicacion a 10 lineas: por debajo de eso
# Sonar no cuenta el bloque como duplicacion estructural. Los snippets
# compartidos entre demos suelen ser de 4-8 lineas y desaparecen.
sonar.cpd.exclusions.minimumLines=10

# Los .min.js y los mapas de fuentes no se analizan en absoluto.
#
# `Web/data/**` es todo generado (`catalog.json`, `catalog.js` y los 1018
# `sources/*.json`); `catalog.js` en concreto tiene 23 MB y repite el 100% del
# catalogo en formato JavaScript (es el fallback cuando el `fetch` del JSON
# falla al abrir con `file://`). No lo escribe ni lo lee ninguna persona: lo
# genera `generate-catalog.mjs` en cada build.
#
# `__tests__` y `e2e` son los tests (node:test y Playwright). Se marcan aqui y
# no solo con `sonar.tests` porque esa propiedad saca el resto de metricas pero
# **no la duplicacion**: los tres ficheros comparten el mismo andamiaje (los
# imports de `node:test` y `node:assert/strict`, la funcion `abrir()` y todos
# los `test("nombre", () => {...})`). Medido con el mismo criterio de tokens
# que usa Sonar (120 minimos) son ~143 lineas duplicadas solo de eso. No es
# duplicacion que se pueda quitar: es la forma que tiene node:test de escribir
# tests, y "corregirla" obligaria a una capa de abstraccion que estorbaria mas
# de lo que ayuda.
#
# `app.js` esta excluido por un motivo puntual y documentado: sus dos tablas de
# traduccion (ingles y espanol, ~220 claves cada una) tienen exactamente la
# misma forma, una linea `clave: "valor"` en las dos, y muchisimas claves se
# llaman igual en ambos idiomas. Sonar lo cuenta como ~18 lineas duplicadas
# (590 tokens medidos) aunque los valores sean distintos. Son las dos mitades
# necesarias de un sitio bilingue y las claves tienen que estar paralelas para
# que `t(clave)` funcione; partir el diccionario en dos ficheros no es posible
# porque `app.js` se carga como script clasico (sin `type="module"`), que no
# admite `import`. Se deja excluido y documentado en vez de romper el sitio.
sonar.exclusions=**/*.min.js,**/vendor/**,**/node_modules/**,**/Web/data/**,**/__tests__/**,**/e2e/**,**/Web/scripts/app.js

# Fase 0: los tests unitarios (node:test) viven en Web/scripts/__tests__ y los
# de extremo a extremo en Web/scripts/e2e. Sin esto Sonar los analiza como
# codigo principal y les aplica las reglas de produkcion: los fixtures y los
# asserts serian "code smells" nuevos. Marcarlos como tests los saca de las
# metricas de codigo principal y deja la cobertura como cobertura.
sonar.tests=**/__tests__/**,**/e2e/**

# Las exclusiones de duplicacion adicionales para los bloques que el
# agente del plan detecto como deliberadamente repetidos.
#
# Los tests tambien se excluyen de CPD. No porque repitan logica (no lo hacen),
# sino porque los tres ficheros comparten el mismo *andamiaje*: los imports de
# `node:test` y `node:assert/strict`, la funcion `abrir()` que crea la pagina,
# y los `test("nombre", () => {...})` que se leen todos igual. Eso no es
# duplicacion accidental: es la forma que tiene node:test de escribir tests, y
# "corregirlo" obligaria a inventar una capa de abstraccion que estorbaria mas
# de lo que ayuda.
#
# `**/app.js*` cubre el unico bloque duplicado de `Web/scripts/app.js`: las dos
# tablas de traduccion (ingles y espanol) del diccionario i18n. Las dos tienen
# exactamente la misma forma (`clave: "valor"` una linea cada una) y muchisimas
# claves se llaman igual en los dos idiomas, asi que CPD las ve como el mismo
# bloque. No es duplicacion que se pueda quitar sin romper la traduccion: son
# las dos mitades necesarias de un sitio bilingue, y las claves tienen que
# estar paralelas para que `t(clave)` funcione. Salen ~18 lineas, el bloque mas
# grande del fichero, pero sacarlas exigiria reescribir el i18n entero.
sonar.cpd.exclusions=**/prefers-reduced-motion,**/script.js
