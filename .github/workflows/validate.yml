name: Validar sitio

# No despliega. El build de Vercel genera el catalogo por su cuenta
# (buildCommand en vercel.json); este workflow ejecuta exactamente los mismos
# pasos en cada push y pull request, para ver aqui el error si falla.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Validar (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      # Sin fail-fast, una version rota no cancela las demas: se ven todas de una vez.
      fail-fast: false
      matrix:
        # package.json promete "node": ">=20". Con una unica version fija lo que
        # promete no esta verificado: si el codigo usara una API que solo existe
        # en 22, en 20 revienta y el CI no lo cuenta.
        node-version: [20, 22, 24]
    steps:
      # Fijadas por SHA, no por tag: un tag se puede mover por quien tenga
      # escritura en el repositorio de la accion, y el CI pasaria a ejecutar
      # codigo que nadie reviso. El comentario conserva la version legible; es
      # ademas el formato que dependabot actualiza si se configura el
      # ecosistema github-actions.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token no hace falta: ningun paso de aqui escribe en el
          # repositorio, y sin esto se queda en .git/config del clon.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          # El lockfile es la unica forma de que el CI instale exactamente las
          # mismas versiones que se han probado en local. Con "npm install" y sin
          # lockfile, cada push podia traerse una version distinta de playwright.
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Dependabot avisa con alertas y con correos, pero no corta nada: una
      # vulnerabilidad de nivel alto seguia entrando en main y hasta que alguien
      # abria la alerta podian pasar semanas. Aqui falla el CI en el mismo push,
      # que es cuando todavia es barato de arreglar. Solo high y critical: con
      # low o medium el ruido seria tal que la gente dejaria de mirar el CI, y eso
      # es peor que la vulnerabilidad.
      - name: Comprobar vulnerabilidades de dependencias
        run: npm audit --audit-level=high

      # El catalogo no se versiona, asi que este clon parte de cero: se genera
      # aqui igual que lo hara Vercel.
      - name: Generar el catalogo (mismo comando que el build de Vercel)
        run: node Web/scripts/generate-catalog.mjs

      - name: Comprobar el catalogo generado
        run: node Web/scripts/validate.mjs

      # El CSP de vercel.json tiene que cubrir los hosts externos que usan los
      # demos (las fotos de las galerias vienen de Wikimedia). Si no, en
      # produccion se ven rotos y en local no, que es lo que mas confunde.
      - name: Comprobar el CSP del despliegue
        run: node Web/scripts/validar-csp.mjs

      # El sellado y los ZIP son los otros dos comandos del buildCommand de
      # Vercel, y hasta aqui solo se habian ejecutado en el despliegue: un HTML
      # que apunte a un asset inexistente o un demo que cambie de licencia no
      # se enteraba nadie hasta produccion. Se comprueban aqui, en el mismo
      # orden y con los mismos argumentos --force con los que los corre Vercel.
      - name: Comprobar el sellado de assets (mismo comando que Vercel)
        run: node Web/scripts/stamp-assets.mjs --force

      - name: Comprobar que se generan los ZIP de Davoker (mismo comando que Vercel)
        run: node Web/scripts/build-zips.mjs --force

      # La unica comprobacion que abre un navegador de verdad. Las anteriores son
      # estaticas: miran ficheros, sintaxis, el catalogo y las cabeceras, y
      # ninguna mide lo que se ve. Una pagina que se dibuja 39 px mas ancha de lo
      # que permite la ventana no falla ninguna de ellas. Chromium son ~170 MB
      # en la cache del runner, y el paso va aparte para que se vea en el
      # log cuanto cuesta. Baja una sola vez: lo que varia con la version de Node
      # es la comprobacion estatica de arriba, no el navegador que la mide.
      - name: Instalar Chromium (para la comprobacion de layout)
        if: matrix.node-version == 24
        run: npx playwright install --with-deps chromium

      - name: Comprobar que ninguna pagina se sale de lado
        if: matrix.node-version == 24
        run: npm run validar:layout

      # Axe-core sobre las tres paginas del sitio en los dos idiomas y los dos
      # temas. Las anteriores miden anchos y ficheros; esta es la unica que
      # contesta si el sitio se puede usar sin raton ni vision: nombres
      # accesibles, contraste de los 9 px del catalogo, orden de encabezados.
      # Corta con serious y critical; moderate y minor solo se informan.
      # Reutiliza el Chromium del paso anterior.
      - name: Comprobar la accesibilidad de las paginas del sitio
        if: matrix.node-version == 24
        run: npm run validar:a11y

      # Abre los 1.018 demos de verdad, con el sandbox de produccion. Es el
      # unico paso que mide lo que ve el visitante: las anteriores son
      # estaticas y un demo que revienta en runtime no las hacia fallar.
      # Compara contra Web/data/smoke-baseline.json (versionada) y solo corta
      # si aparece un fallo NUEVO, no por los que ya estan catalogados.
      # Reutiliza el Chromium del paso anterior; solo en Node 24 para no
      # triplicar ~3-4 minutos por cada una de las tres versiones.
      - name: Abrir los demos (test de humo)
        if: matrix.node-version == 24
        run: npm run validar:demos
