name: Enlaces externos

# Workflow aparte y deliberadamente inofensivo: solo `schedule` y
# `workflow_dispatch`, nunca `pull_request`. Un enlace a un sitio de terceros
# se rompe cuando el otro lado se mueve y eso no es culpa de nadie que abra un
# PR, asi que aqui no puede haber rojo en una rama. Si falla, queda el aviso en
# la pestaña Actions y ya.
on:
  schedule:
    # Lunes a las 06:17 UTC. La hora es arbitraria; el minuto, no: GitHub
    # descarta los cron que caen a la hora en punto por congestion.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enlaces-externos
  cancel-in-progress: false

jobs:
  comprobar:
    name: Enlaces externos (no bloquea)
    runs-on: ubuntu-24.04
    # El matiz entero del workflow: el trabajo se ejecuta y se informa, pero
    # su resultado nunca se propaga como fallo.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin `npm ci`: comprobar-enlaces-externos.mjs solo usa la libreria
      # estandar, y de paso el job no depende de que npm tenga el dia bueno.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Comprobar los enlaces externos del sitio y del README
        run: node Web/scripts/comprobar-enlaces-externos.mjs
