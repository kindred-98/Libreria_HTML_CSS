# Dependabot: mantiene al día las dos cosas que este repo usa de fuera.
# npm (solo playwright, que es de desarrollo) y las acciones de GitHub.
# Abre PRs pequeñas y frecuentes en lugar de una actualización grande de golpe.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
