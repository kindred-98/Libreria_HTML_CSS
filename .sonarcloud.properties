# SonarCloud Automatic Analysis only; unlike sonar-project.properties, this
# file is read by the hosted analyzer. Keep the paths explicit: Automatic
# Analysis does not accept wildcards here.
#
# The six standalone HTML pages intentionally repeat their accessible site
# header/footer. They are independent static entry points (SEO, direct links,
# and no runtime template/build dependency).
#
# app.js has matching EN/ES translation keys by design. The guide's new keys
# are stored as paired values to avoid adding mirrored blocks, but the existing
# locale maps still share their schema. Exclude only these seven files from
# copy/paste detection; every other Sonar rule still analyzes them.
sonar.cpd.exclusions=Web/index.html,Web/components.html,Web/team-core.html,Web/como-usar.html,Web/privacidad.html,Web/legal.html,Web/scripts/app.js
