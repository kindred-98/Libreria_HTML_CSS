<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <fieldset>
        <label style="--_img: url(./vendor/pexels-photo-807598.jpeg)">
          <input type="radio" name="images" value="Fiddle Leaf">
        </label>
        <label style="--_img: url(./vendor/pexels-photo-1444620.jpeg)">
          <input type="radio" name="images" value="Pink Princess">
        </label>
        <label style="--_img: url(./vendor/pexels-photo-1819713.jpeg)">
          <input type="radio" name="images" value="Monstera" checked>
        </label>
        <label style="--_img: url(./vendor/pexels-photo-1680255.jpeg)">
          <input type="radio" name="images" value="Pothos">
        </label>
        <label style="--_img: url(./vendor/pexels-photo-1089455.jpeg)">
          <input type="radio" name="images" value="Rubber Tree">
        </label>
    </fieldset>
</body>
</html>
