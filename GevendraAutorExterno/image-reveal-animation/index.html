<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Reveal Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg viewBox="0 0 500 500" xmlns='http://www.w3.org/2000/svg'>

        <filter id='noise' x='0%' y='0%' width='100%' height='100%'>
            <feTurbulence baseFrequency="0.02 0.6" result="NOISE" numOctaves="2" />
            <feDisplacementMap in="SourceGraphic" in2="NOISE" scale="20" xChannelSelector="R" yChannelSelector="R"></feDisplacementMap>
        </filter>
        <!-- 		<rect width='100%' height='100%' filter='url(#challengeNoise)' /> -->
        <image class="image one" id="img" xlink:href="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7a/Amundsen-Scott_marsstation_ray_h_edit.jpg/960px-Amundsen-Scott_marsstation_ray_h_edit.jpg" x="-60" y="0" width="300px" height="300px" filter="url(#noise)"></image>
    
        <image class="image two" id="img" xlink:href="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Aurora_borealis_over_Eielson_Air_Force_Base%2C_Alaska.jpg/960px-Aurora_borealis_over_Eielson_Air_Force_Base%2C_Alaska.jpg" x="450" y="0" width="300px" height="300px" filter="url(#noise)"></image>
        <image class="image three" id="img" xlink:href="https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/Aurora_australis_dancing_over_an_LED_illuminated_igloo.jpg/960px-Aurora_australis_dancing_over_an_LED_illuminated_igloo.jpg" x="180" y="240" width="300px" height="300px" filter="url(#noise)">
        </image>
    
        <image class="image five" id="img" xlink:href="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Drone_view_of_ocean_waves_%28Unsplash%29.jpg/960px-Drone_view_of_ocean_waves_%28Unsplash%29.jpg" x="470" y="260" width="300px" height="300px" filter="url(#noise)">
        </image>
    
        <image class="image six" id="img" xlink:href="https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/Kiev_cake_slice.JPG/960px-Kiev_cake_slice.JPG" x="-300" y="-30" width="300px" height="260px" filter="url(#noise)">
        </image>
    
        <image class="image seven" id="img" xlink:href="https://upload.wikimedia.org/wikipedia/commons/thumb/f/ff/Andromeda_galaxy.jpg/960px-Andromeda_galaxy.jpg" x="190" y="-30" width="300px" height="260px" filter="url(#noise)">
        </image>
        <image class="image four" id="img" xlink:href="https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Coral_Reef_in_the_Red_Sea.JPG/960px-Coral_Reef_in_the_Red_Sea.JPG" x="-300" y="240" width="300px" height="300px" filter="url(#noise)">
        </image>
        <image class="image eight" id="img" xlink:href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Edouard_Manet_-_At_the_Caf%C3%A9_-_Google_Art_Project.jpg/960px-Edouard_Manet_-_At_the_Caf%C3%A9_-_Google_Art_Project.jpg" x="-40" y="320" width="200px" height="260px" filter="url(#noise)">
        </image>
    </svg>
</body>
</html>
